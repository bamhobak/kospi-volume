<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>

.mkt{display:inline-flex;align-items:center;gap:6px;padding:0 2px;font-weight:700;font-size:13px;white-space:nowrap;font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

.chk{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:0;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--acc);width:15px;height:15px;margin:0}
.opts{color:var(--mut);font-size:12px;width:100%;white-space:normal}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:2px}
.s-item{background:var(--panel2);border:1px solid var(--line);border-radius:0;padding:5px 12px;text-align:center;min-width:78px}
.info-btn{border-color:var(--acc)!important;color:var(--acc)!important}
.info-card{cursor:pointer;color:var(--acc);font-size:15px;font-weight:700;min-width:60px}.info-card:hover{border-color:var(--acc)}
.s-item b{display:block;color:var(--acc);font-size:15px;line-height:1.2}.s-item small{color:var(--mut);font-size:10px}
.s-item{cursor:help;padding:9px 12px}.s-item:hover{border-color:var(--acc)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.s-item{background:var(--panel2);border:1px solid var(--line);border-radius:0;padding:5px 12px;text-align:center;min-width:76px}
.info-btn{border-color:var(--acc)!important;color:var(--acc)!important}
.info-card{cursor:pointer;color:var(--acc);font-size:15px;font-weight:700;min-width:60px}.info-card:hover{border-color:var(--acc)}
.s-item b{display:block;color:var(--acc);font-size:15px;line-height:1.25;font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}.s-item small{color:var(--mut);font-size:10px}
.themes{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.thtag{background:var(--panel2);border:1px solid var(--line);border-radius:0;padding:3px 8px;font-size:11px;color:var(--mut)}
.thtag.sector{border-color:var(--acc);color:var(--acc)}.thtag.up{border-color:#fb718555;color:#fb7185}

.tag.kq{background:var(--ind)}

button.mini{padding:3px 8px;font-size:11px;border-radius:0}
.tabs button.pos-tab{border-color:#fb718555;color:#fb7185}.tabs button.pos-tab.on{background:#fb7185;border-color:#fb7185;color:#08090b}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-weight:600;padding:7px 12px}

.brk{flex-basis:100%;height:0;margin:0}

.mkleg i{display:inline-block;width:9px;height:9px;border-radius:0;margin-right:4px;vertical-align:-1px}
.mkleg i.kp{background:var(--acc)}.mkleg i.kq{background:var(--ind)}
.kqtag{color:var(--ind);font-weight:700}
.tabs button.done-tab{border-color:#4ade8055;color:#4ade80}.tabs button.done-tab.on{background:var(--org);border-color:var(--org);color:#08090b}
.tabs button.all-tab{opacity:.75;font-weight:500}.tabs button.all-tab.on{opacity:1;font-weight:700}.opts label{cursor:pointer}.opts input[type=checkbox]{width:14px;accent-color:var(--acc);vertical-align:-2px}.opts input{width:44px;min-width:0;padding:4px 6px;font-size:12px;text-align:right;flex:none}
td.sc{color:#9aa3ae}
.rule{margin:12px 16px 0;padding:10px 14px;border:1px solid #fb718544;background:#fb71850f;border-radius:0;font-size:13px;line-height:1.6}
.rule b{color:#fb7185;margin-right:8px}.rule em{font-style:normal;color:var(--txt);font-weight:700}.rule small{display:block;color:var(--mut);font-size:11px}
header{height:52px;padding:0 18px;flex-wrap:nowrap;gap:16px}
.mktstate{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;background:var(--panel2);
          border:1px solid var(--line);color:var(--mut);font-size:11px;white-space:nowrap}
.mktstate i{width:6px;height:6px;border-radius:999px;background:var(--org);display:inline-block}
.mktstate b{color:var(--txt)}
body{display:flex;flex-direction:column;height:100%}
header{flex:none}
.shell{display:flex;flex:1;min-height:0}
.rail{width:212px;flex:none;background:#0b0d10;border-right:1px solid var(--line);
      display:flex;flex-direction:column;padding:14px 10px;gap:15px;overflow-y:auto}
.rail .k{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.08em;padding:0 8px 4px}
.rail .grp{display:flex;flex-direction:column;gap:4px}
.rail .it{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;
          border:1px solid transparent;color:var(--mut);white-space:nowrap;font-weight:600}
.rail .it:hover{background:var(--panel2)}
.rail .it.on{background:var(--panel2);border-color:var(--acc);color:var(--txt)}
.rail .it .n{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;color:var(--dim)}
.rail .it.on .n{color:var(--acc);font-weight:700}
.rail .it .bar{width:5px;height:15px;flex:none;background:var(--acc);opacity:.3}
.rail .it.on .bar{opacity:1}
.rail .it.kq .bar{background:var(--ind)}.rail .it.kq.on{border-color:var(--ind)}.rail .it.kq.on .n{color:var(--ind)}
.rail .it.pos{border-color:#fb718555}.rail .it.pos.on{border-color:var(--up)}.rail .it.pos.on .n{color:var(--up)}
.rail .it.done.on{border-color:var(--org)}.rail .it.done.on .n{color:var(--org)}
.rail .it .rid{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11px;width:20px;color:var(--acc)}
.rail .it.kq .rid{color:var(--ind)}
.rail .sec{padding:11px;background:var(--panel2);border:1px solid var(--line)}
.rail .sec .row{display:flex;justify-content:space-between;font-size:11px;margin-top:5px}
.main{flex-grow:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.fdesc{padding:12px 18px 0;color:var(--mut);font-size:12px}
.wrap{display:grid;grid-template-columns:1fr 470px;gap:14px;padding:12px 18px 14px;flex-grow:1;min-height:0}
.cards{overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.sig{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);
     padding:19px 21px;display:flex;flex-direction:column;gap:17px}
.sig.kq{border-left-color:var(--ind)}
.sig{cursor:pointer}.sig:hover{background:#12161d}.sig.sel{background:#0d2b26}
.sig .hd{display:flex;align-items:flex-start;gap:14px}
.sig .nm{font-weight:900;font-size:19px;letter-spacing:-.6px}
.sig .why{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.sig .why div{background:var(--panel2);padding:11px 12px}
.sig .why .l{color:var(--dim);font-size:10px;margin-bottom:5px}
.sig .why .v{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:16px;font-weight:700}
.sig .why .s{color:var(--faint);font-size:10px;margin-top:3px}
.sig .plan{display:flex;align-items:center;background:var(--panel2);padding:14px 18px;gap:16px}
.sig .plan .st{flex-grow:1}.sig .plan .st b{display:block;font-weight:600;margin-top:4px}
.sig .warn{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:11px;line-height:1.5}
.k{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.08em}
.dsum{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:2px}
.dchip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel2);
       border:1px solid var(--line);cursor:pointer;font-size:12px;white-space:nowrap}
.dchip:hover{border-color:var(--acc)}
.dchip.on{border-color:var(--acc);background:#0d2b26}
.dchip.kq.on{border-color:var(--ind);background:#2b2405}
.dchip b{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--acc)}
.dchip.kq b{color:var(--ind)}
.dchip .c{color:var(--dim)}
.dchip span{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:0;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.tblwrap{overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap}
th{position:sticky;top:0;z-index:2;background:var(--panel2);color:var(--mut);font-weight:600;padding:10px 9px;text-align:right;cursor:pointer;user-select:none;border-bottom:1px solid var(--line);font-size:12px}
th.l,td.l{text-align:left}th.on{color:var(--acc)}
th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:var(--panel)}th:first-child{z-index:3;background:var(--panel2)}
td{padding:8px 9px;border-bottom:1px solid #1b1f2680;text-align:right;font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:12px}
td.l,td.name{font-family:'Gothic A1',Pretendard,sans-serif;font-size:13px}
tr:hover td{background:#ffffff08}tr.sel td{background:#0d2b26}
td.name{font-weight:600}td .code{color:var(--mut);font-size:11px;font-weight:400}
.pos{color:var(--up)}.neg{color:var(--dn)}
.pct{font-size:11px;opacity:.85;margin-left:3px}
.hot{background:#fb718522;color:#fb7185;border-radius:0;padding:2px 6px;font-weight:600}
.side{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.side h2{margin:0;font-size:18px}.side .sub{color:var(--mut);font-size:12px;margin-top:2px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi div{background:var(--panel2);border-radius:0;padding:10px}
.kpi small{display:block;color:var(--mut);font-size:11px;margin-bottom:4px}.kpi b{font-size:14px}
.chart{background:var(--panel2);border-radius:0;padding:8px;height:210px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:0;margin-right:5px;vertical-align:-1px}
.empty{color:var(--mut);text-align:center;margin-top:120px}
#close{display:none;margin-left:auto}
@media (max-width:900px){
  /* 모바일은 가로 스크롤을 만들지 않는다 — 모든 것을 줄바꿈하고 세로로만 스크롤한다.
     레일은 숨기지 않고(규칙 탭 접근 불가) 여러 줄로 감싼다. 표는 컬럼을 줄여 폭에 맞춘다. */
  html,body{overflow-x:hidden;max-width:100%}
  .shell{flex-direction:column}
  .rail{width:auto;flex:none;flex-direction:row;flex-wrap:wrap;align-items:stretch;gap:5px;
        padding:8px 10px;overflow:visible;
        border-right:0;border-bottom:1px solid var(--line)}
  .rail .k{display:none}
  .rail .grp{flex-direction:row;flex-wrap:wrap;gap:5px;width:100%}
  .rail .grp+.grp{border-left:0;border-top:1px dashed var(--line);padding-top:6px}
  .rail .it{white-space:nowrap;padding:7px 9px;font-size:12px;flex:0 0 auto}
  .rail .it .n{margin-left:6px}
  .rail .it .bar{height:11px}
  .main{min-height:0;flex:1;min-width:0}
  .wrap{grid-template-columns:1fr;padding:10px;min-width:0}
  .rule{margin:10px 10px 0;font-size:12px}
  /* 헤더: 한 줄에 다 못 넣으면 줄바꿈 */
  header{height:auto;padding:9px 12px;flex-wrap:wrap;gap:8px}
  header h1{width:auto;font-size:15px}
  .mkt{font-size:12px}
  .mktstate{font-size:10px;padding:3px 8px;white-space:normal}
  #q{flex:1 1 100%;min-width:0}
  .side{position:fixed;inset:0;z-index:20;border-radius:0;background:var(--panel);transform:translateY(100%);transition:transform .25s}
  .side.open{transform:none}#close{display:inline-block}
  .kpi{grid-template-columns:repeat(2,1fr)}.chart{height:190px}
  /* 표: 페이지는 가로로 안 밀리되(html overflow-x:hidden) 표 안에서만 가로 스크롤한다.
     글자를 세로로 쪼개면 안 되므로 nowrap 유지. 조회 탭(컬럼 31개)은 이 스크롤로 본다.
     대신 종목명 열은 왼쪽에 고정해 무엇을 보는 중인지 놓치지 않게 한다. */
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{white-space:nowrap;table-layout:auto;width:auto;min-width:100%}
  td,th{padding:7px 6px;font-size:11px}
  th:first-child,td:first-child{position:sticky;left:0;z-index:3;
      background:var(--panel);box-shadow:1px 0 0 var(--line);max-width:120px;
      overflow:hidden;text-overflow:ellipsis}
  thead th:first-child{z-index:4;background:var(--panel2)}
  tr.sel td:first-child{background:var(--panel2)}
  .card{min-width:0}
}
</style></head><body>
<header>
  <h1>밤호박 <span>종목 선별기</span></h1>
  <span id="mkt" class="mkt"></span>
  <span id="mktstate" class="mktstate"></span>
  <input id="q" type="search" placeholder="종목명·코드 검색" autocomplete="off">
  <div id="status">불러오는 중…</div>
</header>
<div class="shell">
  <nav id="rail" class="rail"></nav>
  <div class="main">
    <div id="fdesc" class="fdesc"></div>
    <div class="rule" id="rule" style="display:none"></div>
    <div class="wrap">
      <div class="card" id="tblcard"><div class="tblwrap"><table id="tbl"><thead></thead><tbody></tbody></table></div></div>
      <div id="cards" class="cards" style="display:none"></div>
      <div class="card side" id="side"><div class="empty">종목을 클릭하면 거래량·투자자 추이가 표시됩니다</div></div>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
// 천/만/억 단위 축약
function kor(n,sign){if(n==null||isNaN(n))return '';const a=Math.abs(n);let s;
  if(a>=1e8)s=(a/1e8).toFixed(a>=1e9?0:1).replace(/\.0$/,'')+'억';else if(a>=1e4)s=(a/1e4).toFixed(a>=1e6?0:1).replace(/\.0$/,'')+'만';else if(a>=1e3)s=(a/1e3).toFixed(1).replace(/\.0$/,'')+'천';else s=String(Math.round(a));
  return (n<0?'-':(sign&&n>0?'+':''))+s}
const fmt=n=>n==null?'':Math.round(n).toLocaleString();const cls=n=>n>0?'pos':n<0?'neg':'';const WD=['일','월','화','수','목','금','토'];const md=d=>d.slice(4,6)+'/'+d.slice(6)+'('+WD[new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6)).getDay()]+')';
const pct=(c,ch)=>{if(c==null||ch==null||c-ch===0)return '';const p=ch/(c-ch)*100;return `<span class="pct">(${p>0?'+':''}${p.toFixed(2)}%)</span>`};
const chg=(c,ch)=>ch==null?'':`<span class="${cls(ch)}">${ch>0?'+':''}${fmt(ch)}${pct(c,ch)}</span>`;

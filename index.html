<style>
:root{--dim:#5b626d;--faint:#41474f;--bg:#0a0b0e;--panel:#101217;--panel2:#171a21;--line:#272b34;--txt:#eef1f6;--mut:#858c99;/* 강조색은 손익색과 절대 겹치지 않게 분리한다 — 예전엔 --acc 와 --dn 이 둘 다 민트(5eead4)였다 */--acc:#a78bfa;--up:#f87171;--dn:#60a5fa;--ind:#fbbf24;--org:#34d399;--frg:#e879f9}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:13px;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:700;letter-spacing:-.4px;white-space:nowrap}header h1 span{color:var(--acc)}
input:not([type=checkbox]),select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:0;padding:8px 12px;font-size:14px;outline:none;-webkit-appearance:none}
input:focus{border-color:var(--acc)}input:not([type=checkbox]){flex:1;min-width:120px}
button{background:var(--acc);border:0;color:#0a0b0e;border-radius:0;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
button.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
#q{flex:none;width:180px;padding:6px 10px;font-size:12px;border-radius:0}
#q:focus{border-color:var(--acc)}
#status{color:var(--mut);font-size:12px;margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;min-width:0}
/* 헤더 상태줄 — 항목마다 라벨(작게)+값(굵게), 사이에 세로 구분선 */

  border-left:1px solid var(--line);white-space:nowrap}
#status .sgrp:first-child{padding-left:0;border-left:0}
#status .sgrp i{font-style:normal;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.06em}
#status .sgrp b{font-weight:600;color:var(--txt);font-size:12px;
  font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
#status .sgrp b.pos{color:var(--up)}#status .sgrp b.neg{color:var(--dn)}
#status .sgrp b.off{color:var(--dim);font-weight:400}
.mkt{display:inline-flex;align-items:center;gap:6px;padding:0 2px;font-weight:700;font-size:13px;white-space:nowrap;font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.mkt.up{color:#f87171}.mkt.dn{color:#60a5fa}
.mkt small{font-weight:400;opacity:.8}
.chk{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:0;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--acc);width:15px;height:15px;margin:0}
.opts{color:var(--mut);font-size:12px;width:100%;white-space:normal}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:2px}
.s-item{background:var(--panel2);border:1px solid var(--line);border-radius:0;padding:5px 12px;text-align:center;min-width:78px}
.info-btn{border-color:var(--acc)!important;color:var(--acc)!important}
.info-card{cursor:pointer;color:var(--acc);font-size:15px;font-weight:700;min-width:60px}.info-card:hover{border-color:var(--acc)}
.s-item b{display:block;color:var(--acc);font-size:15px;line-height:1.2}.s-item small{color:var(--mut);font-size:10px}
.s-item{cursor:help;padding:9px 12px}.s-item:hover{border-color:var(--acc)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.s-item{background:var(--panel2);border:1px solid var(--line);border-radius:0;padding:5px 12px;text-align:center;min-width:76px}
.info-btn{border-color:var(--acc)!important;color:var(--acc)!important}
.info-card{cursor:pointer;color:var(--acc);font-size:15px;font-weight:700;min-width:60px}.info-card:hover{border-color:var(--acc)}
.s-item b{display:block;color:var(--acc);font-size:15px;line-height:1.25;font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}.s-item small{color:var(--mut);font-size:10px}
.themes{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.thtag{background:var(--panel2);border:1px solid var(--line);border-radius:0;padding:3px 8px;font-size:11px;color:var(--mut)}
.thtag.sector{border-color:var(--acc);color:var(--acc)}.thtag.up{border-color:#f8717155;color:#f87171}
.thtag b{font-weight:700}
.tag.kq{background:var(--ind)}
.tag{display:inline-block;min-width:20px;text-align:center;background:var(--acc);color:#0a0b0e;border-radius:0;padding:1px 6px;font-size:11px;font-weight:700;margin-right:3px}
button.mini{padding:3px 8px;font-size:11px;border-radius:0}
.tabs button.pos-tab{border-color:#f8717155;color:#f87171}.tabs button.pos-tab.on{background:#f87171;border-color:#f87171;color:#0a0b0e}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-weight:600;padding:7px 12px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#0a0b0e}
.tabs button.mk-kp{border-color:#a78bfa55;color:#a78bfa}
.tabs button.mk-kp.on{background:var(--acc);border-color:var(--acc);color:#0a0b0e}
.tabs button.mk-kq{border-color:#fbbf2455;color:#fbbf24}
.tabs button.mk-kq.on{background:var(--ind);border-color:var(--ind);color:#0a0b0e}
.brk{flex-basis:100%;height:0;margin:0}
.mkleg{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--mut);margin-left:2px}
.mkleg i{display:inline-block;width:9px;height:9px;border-radius:0;margin-right:4px;vertical-align:-1px}
.mkleg i.kp{background:var(--acc)}.mkleg i.kq{background:var(--ind)}
.kqtag{color:var(--ind);font-weight:700}
.tabs button.done-tab{border-color:#34d39955;color:#34d399}.tabs button.done-tab.on{background:var(--org);border-color:var(--org);color:#0a0b0e}
.tabs button.all-tab{opacity:.75;font-weight:500}.tabs button.all-tab.on{opacity:1;font-weight:700}.opts label{cursor:pointer}.opts input[type=checkbox]{width:14px;accent-color:var(--acc);vertical-align:-2px}.opts input{width:44px;min-width:0;padding:4px 6px;font-size:12px;text-align:right;flex:none}
td.sc{color:#99a0ac}
.rule{margin:12px 16px 0;padding:10px 14px;border:1px solid #f8717144;background:#f871710f;border-radius:0;font-size:13px;line-height:1.6}
.rule b{color:#f87171;margin-right:8px}.rule em{font-style:normal;color:var(--txt);font-weight:700}.rule small{display:block;color:var(--mut);font-size:11px}
header{height:52px;padding:0 18px;flex-wrap:nowrap;gap:16px}
.mktstate{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;background:var(--panel2);
          border:1px solid var(--line);color:var(--mut);font-size:11px;white-space:nowrap}
.mktstate i{width:6px;height:6px;border-radius:999px;background:var(--org);display:inline-block}
.mktstate b{color:var(--txt)}
body{display:flex;flex-direction:column;height:100%}
header{flex:none}
.shell{display:flex;flex:1;min-height:0}
.rail{width:212px;flex:none;background:#0c0e12;border-right:1px solid var(--line);
      display:flex;flex-direction:column;padding:14px 10px;gap:15px;overflow-y:auto}
.rail .k{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.08em;padding:0 8px 4px}
.rail .grp{display:flex;flex-direction:column;gap:4px}
.rail .it{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;
          border:1px solid transparent;color:var(--mut);white-space:nowrap;font-weight:600}
.rail .it:hover{background:var(--panel2)}
.rail .it.on{background:var(--panel2);border-color:var(--acc);color:var(--txt)}
.rail .it .n{margin-left:auto;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:var(--dim)}
.rail .it.on .n{color:var(--acc);font-weight:700}
.rail .it .bar{width:5px;height:15px;flex:none;background:var(--acc);opacity:.3}
.rail .it.on .bar{opacity:1}
.rail .it.kq .bar{background:var(--ind)}.rail .it.kq.on{border-color:var(--ind)}.rail .it.kq.on .n{color:var(--ind)}
.rail .it.pos{border-color:#f8717155}.rail .it.pos.on{border-color:var(--up)}.rail .it.pos.on .n{color:var(--up)}
.rail .it.done.on{border-color:var(--org)}.rail .it.done.on .n{color:var(--org)}
.rail .it .rid{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;width:20px;color:var(--acc)}
/* 발현 장세 색조 — 회색 기준에서 살짝만. 켜진 행은 원래대로 밝게 둔다 */
.rail .it.rg-up{color:#9d8891}.rail .it.rg-down{color:#7f8a9c}
.rail .it.rg-up:hover{color:#c39aa4}.rail .it.rg-down:hover{color:#93a4bd}
.rail .it.rg-up.on,.rail .it.rg-down.on{color:var(--txt)}
.rail .it.kq .rid{color:var(--ind)}
.rail .sec{padding:11px;background:var(--panel2);border:1px solid var(--line)}
.rail .sec .row{display:flex;justify-content:space-between;font-size:11px;margin-top:5px}
.main{flex-grow:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.fdesc{padding:12px 18px 0;color:var(--mut);font-size:12px}
.wrap{display:grid;grid-template-columns:1fr;gap:14px;padding:12px 18px 14px;flex-grow:1;min-height:0}
.cards{overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.sig{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);
     padding:19px 21px;display:flex;flex-direction:column;gap:17px}
.sig.kq{border-left-color:var(--ind)}
.sig{cursor:pointer}.sig:hover{background:#14171d}.sig.sel{background:#1c1730}
.sig .hd{display:flex;align-items:flex-start;gap:14px}
.sig .nm{font-weight:700;font-size:19px;letter-spacing:-.2px}
.sig .why{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.sig .why div{background:var(--panel2);padding:11px 12px}
.sig .why .l{color:var(--dim);font-size:10px;margin-bottom:5px}
.sig .why .v{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-size:16px;font-weight:700}
.sig .why .s{color:var(--faint);font-size:10px;margin-top:3px}
.sig .plan{display:flex;align-items:center;background:var(--panel2);padding:14px 18px;gap:16px}
.sig .plan .st{flex-grow:1}.sig .plan .st b{display:block;font-weight:600;margin-top:4px}
.sig .warn{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:11px;line-height:1.5}
.k{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.08em}
.dsum{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:2px}
.dchip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel2);
       border:1px solid var(--line);cursor:pointer;font-size:12px;white-space:nowrap}
.dchip:hover{border-color:var(--acc)}
.dchip.on{border-color:var(--acc);background:#1c1730}
.dchip.kq.on{border-color:var(--ind);background:#2a2008}
.dchip b{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--acc)}
.dchip.kq b{color:var(--ind)}
.dchip .c{color:var(--dim)}
.dchip span{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:0;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.tblwrap{overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap}
th{position:sticky;top:0;z-index:2;background:var(--panel2);color:var(--mut);font-weight:600;padding:10px 9px;text-align:right;cursor:pointer;user-select:none;border-bottom:1px solid var(--line);font-size:12px}
th.l,td.l{text-align:left}th.on{color:var(--acc)}
th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:var(--panel)}th:first-child{z-index:3;background:var(--panel2)}
td{padding:8px 9px;border-bottom:1px solid #272b3480;text-align:right;font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:12.5px}
td.l,td.name{font-family:'Noto Sans KR',Pretendard,sans-serif;font-size:13px}
tr:hover td{background:#ffffff08}tr.sel td{background:#1c1730}
td.name{font-weight:600}td .code{color:var(--mut);font-size:11px;font-weight:400}
.pos{color:var(--up)}.neg{color:var(--dn)}
.pct{font-size:11px;opacity:.85;margin-left:3px}
.hot{background:#f8717122;color:#f87171;border-radius:0;padding:2px 6px;font-weight:600}
/* 상세 패널은 기본으로 숨긴다 — 목록의 '상세' 버튼이 새 창(?detail=코드)으로 띄운다 */
.side{display:none;padding:16px;flex-direction:column;gap:12px;overflow:auto}
body.detail header,body.detail .rail,body.detail #fdesc,body.detail .rule,
body.detail #tblcard,body.detail #cards{display:none!important}
body.detail .shell{height:100%}body.detail .wrap{padding:10px;grid-template-columns:1fr}
body.detail .side{display:flex;height:100%;border-radius:0}
body.detail #close{display:none}
th[draggable]{cursor:grab;user-select:none}th.dragover{box-shadow:inset 3px 0 0 var(--acc)}
/* 열 너비 조절 — 머리글 오른쪽 끝 손잡이. 폭을 하나라도 정하면 표는 fixed 로 고정된다 */
th{padding-right:16px}
th .rz{position:absolute;right:0;top:0;bottom:0;width:11px;cursor:col-resize;touch-action:none;z-index:4}
th .rz::after{content:'';position:absolute;right:4px;top:6px;bottom:6px;width:2px;background:var(--line)}
th .rz:hover::after,th .rz.on::after{background:var(--acc);top:0;bottom:0}
#tbl.fixed{table-layout:fixed}
#tbl.fixed th,#tbl.fixed td{overflow:hidden;text-overflow:ellipsis}
.colbtn{margin-left:auto}
.colmenu{position:absolute;right:18px;z-index:30;background:var(--panel2);border:1px solid var(--line);
  padding:14px 16px;width:min(780px,calc(100vw - 40px));box-shadow:0 8px 24px #000a}

  margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--line)}

/* 체크 영역은 최소로 — 남는 폭은 전부 열 이름에 준다. 켜짐은 글자 밝기로 구분 */
.colitem{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;
  padding:5px 6px;color:var(--dim);min-width:0;border-radius:0}
.colitem:hover{background:#ffffff0d}

  width:13px;height:13px;min-width:0;max-width:13px;margin:0;padding:0;background:none;border:0;
  accent-color:var(--acc);cursor:pointer}
.colitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colitem.on{color:var(--txt)}
/* 이미 보유 중인 종목 표시 — 규칙 카드·조회 표 공용 */
.tag.hold{background:#2e2205;border-color:var(--ind);color:var(--ind);font-weight:700}
.pdet{margin-left:8px;vertical-align:middle;opacity:.75}.pdet:hover{opacity:1}
.colmenu .colft{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--line);color:var(--mut);font-size:11px}
.colmenu .sp{margin-left:auto}
button.prim{background:var(--acc);border:1px solid var(--acc);color:#0a0b0e;font-weight:700}
@media (max-width:900px){th .rz{width:18px}th{padding-right:20px}
  .colmenu{right:8px;left:8px;width:auto}
  .colmenu .colgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.side h2{margin:0;font-size:18px}.side .sub{color:var(--mut);font-size:12px;margin-top:2px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi div{background:var(--panel2);border-radius:0;padding:10px}
.kpi small{display:block;color:var(--mut);font-size:11px;margin-bottom:4px}.kpi b{font-size:14px}
.chart{background:var(--panel2);border-radius:0;padding:8px;height:210px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:0;margin-right:5px;vertical-align:-1px}
.empty{color:var(--mut);text-align:center;margin-top:120px}
#close{display:none;margin-left:auto}
@media (max-width:900px){
  /* 모바일은 가로 스크롤을 만들지 않는다 — 모든 것을 줄바꿈하고 세로로만 스크롤한다.
     레일은 숨기지 않고(규칙 탭 접근 불가) 여러 줄로 감싼다. 표는 컬럼을 줄여 폭에 맞춘다. */
  html,body{overflow-x:hidden;max-width:100%}
  .shell{flex-direction:column}
  .rail{width:auto;flex:none;flex-direction:row;flex-wrap:wrap;align-items:stretch;gap:5px;
        padding:8px 10px;overflow:visible;
        border-right:0;border-bottom:1px solid var(--line)}
  .rail .k{display:none}
  .rail .grp{flex-direction:row;flex-wrap:wrap;gap:5px;width:100%}
  .rail .grp+.grp{border-left:0;border-top:1px dashed var(--line);padding-top:6px}
  .rail .it{white-space:nowrap;padding:7px 9px;font-size:12px;flex:0 0 auto}
  .rail .it .n{margin-left:6px}
  .rail .it .bar{height:11px}
  .main{min-height:0;flex:1;min-width:0}
  .wrap{grid-template-columns:1fr;padding:10px;min-width:0}
  .rule{margin:10px 10px 0;font-size:12px}
  /* 헤더: 한 줄에 다 못 넣으면 줄바꿈 */
  header{height:auto;padding:9px 12px;flex-wrap:wrap;gap:8px}
  header h1{width:auto;font-size:15px}
  .mkt{font-size:12px}
  .mktstate{font-size:10px;padding:3px 8px;white-space:normal}
  #q{flex:1 1 100%;min-width:0}
  body:not(.detail) .side.open{position:fixed;inset:0;z-index:20;border-radius:0;background:var(--panel);display:flex}
  body:not(.detail) .side.open #close{display:inline-block}
  .kpi{grid-template-columns:repeat(2,1fr)}.chart{height:190px}
  /* 표: 페이지는 가로로 안 밀리되(html overflow-x:hidden) 표 안에서만 가로 스크롤한다.
     글자를 세로로 쪼개면 안 되므로 nowrap 유지. 조회 탭(컬럼 31개)은 이 스크롤로 본다.
     대신 종목명 열은 왼쪽에 고정해 무엇을 보는 중인지 놓치지 않게 한다. */
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{white-space:nowrap;table-layout:auto;width:auto;min-width:100%}
  td,th{padding:7px 6px;font-size:11px}

      background:var(--panel);box-shadow:1px 0 0 var(--line);max-width:120px;
      overflow:hidden;text-overflow:ellipsis}
  thead th:first-child{z-index:4;background:var(--panel2)}
  tr.sel td:first-child{background:var(--panel2)}
  .card{min-width:0}
}

function applyColCfg(cols){
  const c=loadColCfg();
  let out=cols;
  if(c.order&&c.order.length){
    const by={};cols.forEach(x=>by[x[0]]=x);
    const seen=new Set();
    out=[];
    c.order.forEach(k=>{if(by[k]&&!seen.has(k)){out.push(by[k]);seen.add(k)}});
    /* 저장 이후 새로 생긴 열은 뒤에 원래 순서대로 붙인다 (앞의 순서를 밀지 않는다) */
    cols.forEach(x=>{if(!seen.has(x[0]))out.push(x)});
  }
  const hid=new Set(c.hidden||[]);
  return out.filter(x=>!hid.has(x[0]));

    if(d&&Array.isArray(d.positions)&&d.positions.length){POS=d.positions;try{localStorage.setItem('positions',JSON.stringify(POS))}catch(e){}}else if(POS.length){await pushRemote()}}catch(e){console.warn('sync pull',e)}}

  try{localStorage.setItem('pin',pin)}catch(e){}

    return {ticker:r.t,name:r.n,close:r.c,change:r.ch,foreign_ratio:r.fr,vols,avg,total:valid.reduce((a,b)=>a+b,0),ratio,indiv:sum(r.i),organ:sum(r.o),frgn:sum(r.f),amt:r.amt,cap:r.cap,r1m:r.r1m,r3m:r.r3m,r6m:r.r6m,r1y:r.r1y,per:r.per,pbr:r.pbr,pcr:r.pcr,dy:r.dy,pref:r.pref,fw:r.f.slice(-5).reduce((x,y)=>x+(y||0),0),v5:r.v.slice(-5).reduce((x,y)=>x+(y||0),0),fwp:(()=>{const v=r.v.slice(-5).reduce((x,y)=>x+(y||0),0),f=r.f.slice(-5).reduce((x,y)=>x+(y||0),0);return v?f/v*100:null})(),streak:r.streak||0,ret3:r.ret3,ret10:r.ret10,ret20:r.ret20,sr60:r.sr60,vs1:r.vs1,fw60:r.fw60,amt20:r.amt20,disc:r.disc,fromhi:r.fromhi,fw5:r.fw5,vol20:r.vol20,ret2y:r.ret2y,ret250:r.ret250,above20:r.above20,sr20:r.sr20,ow20:r.ow20,dbt:r.dbt,pbrd:r.pbrd,dma20:r.dma20,mdd60:r.mdd60,up:r.up,rs:r.rs,sr:r.sr,srDown:r.srDown,dilu:r.dilu,th:r.th||[],mk:r.mk||'KOSPI',aw:r.aw,a1:r.a1,a6:r.a6,r16:(r.a1&&r.a6)?r.a1/r.a6*100:null,rw1:(r.aw&&r.a1)?r.aw/r.a1*100:null,last:last??-1,chpct:(r.c&&r.ch!=null&&r.c-r.ch)?r.ch/(r.c-r.ch)*100:-999}})}
function val(r,k){if(k==='hits')return FILTERS.filter(f=>f.fn(r)).length;if(k.startsWith('d:'))return r.vols[+k.slice(2)]??-1;return r[k]??-1}

  /* 모바일에선 '상세' 열을 뺀다 — 팝업 새 창이 모바일에서 쓸모없고, 행을 누르면 어차피 상세가 열린다 */
  if(isMobile())cols=cols.filter(c=>c[0]!=='detail');
  const ALLCOLS=cols; cols=applyColCfg(cols);

  const total=rows.length,shown=rows.slice(0,rowLimit);rowTotal=total;
  /* 셀을 컬럼 id 로 만들어 cols 순서대로 출력한다 — 모바일 축약 시 머리글과 어긋나지 않게 */
  const cellOf=(r)=>({

    sr60:`<td class="${cls(r.sr60)}">${r.sr60==null?'':(r.sr60>0?'+':'')+r.sr60.toFixed(1)+'%'}</td>`,
    streak:`<td>${r.streak?`<span class="${r.streak>=4?'hot':''}">${r.streak}일</span>`:''}</td>`,
    ret3:`<td class="${cls(r.ret3)}">${r.ret3==null?'':(r.ret3>0?'+':'')+r.ret3.toFixed(1)+'%'}</td>`,
    ret10:`<td class="${cls(r.ret10)}">${r.ret10==null?'':(r.ret10>0?'+':'')+r.ret10.toFixed(1)+'%'}</td>`,
    close:`<td>${fmt(r.close)}</td>`,
    chpct:`<td>${chg(r.close,r.change)}</td>`,
    last:`<td class="name">${kor(r.last<0?null:r.last)}</td>`,
    avg:`<td>${kor(r.avg)}</td>`,

    a6:`<td class="sc">${kor(r.a6)}</td>`,a1:`<td class="sc">${kor(r.a1)}</td>`,aw:`<td class="sc">${kor(r.aw)}</td>`,
    r16:`<td class="sc">${r.r16==null?'':Math.round(r.r16)+'%'}</td>`,
    rw1:`<td>${r.rw1==null?'':(r.rw1>=200?`<span class="hot">${Math.round(r.rw1)}%</span>`:Math.round(r.rw1)+'%')}</td>`,
    fw:`<td class="${cls(r.fw)}">${kor(r.fw,1)}</td>`,
    fwp:`<td class="${cls(r.fwp)}">${r.fwp==null?'':r.fwp.toFixed(1)+'%'}</td>`,

    return `<tr data-c="${r.ticker}" class="${sel===r.ticker?'sel':''}">`+cols.map(c=>C[c[0]]||'<td></td>').join('')+'</tr>'}).join('');
  applyColWidths(cols);
  /* 머리글 오른쪽 끝을 끌어 너비 조절 (마우스·터치 공용 pointer 이벤트) → 동기화 저장 */
  (function(){
    const t=$('#tbl'); if(!t)return;

        e.preventDefault(); e.stopPropagation();
        const k=th.dataset.k;

        cols.forEach(c=>{if(!w[c[0]])w[c[0]]=90});
        COLCFG=Object.assign(loadColCfg(),{w:w}); applyColWidths(cols);   /* 먼저 fixed 로 전환 */
        const cg=t.querySelector('colgroup'), col=cg?cg.children[idx]:null;
        const x0=e.clientX, w0=w[k];
        g.classList.add('on'); th.draggable=false;
        const sum=()=>cols.reduce((a,c)=>a+(w[c[0]]||90),0);
        const mv=ev=>{const nw=Math.max(48,Math.round(w0+ev.clientX-x0));

     /* 체크는 화면에만 반영하고, 적용을 눌러야 저장하고 다시 그린다 */

     const on=(id,fn)=>{const el=wrap.querySelector(id); if(el)el.onclick=fn};

async function showStock(code){
  const d=await (await fetch(`data/stock/${code}.json?v=${raw.updated}`)).json();
  const n=20;const rows=d.rows.slice(-n).map(x=>({date:d.dates[x[0]],close:x[1],change:x[2],volume:x[3],indiv:x[4],organ:x[5],frgn:x[6],fr:x[7]}));
  if(!rows.length)return;const L=rows[rows.length-1],labels=rows.map(r=>md(r.date));const sum=k=>rows.reduce((a,r)=>a+(r[k]||0),0);
  $('#side').innerHTML=`<div style="display:flex;align-items:flex-start"><div><h2>${d.name} <span style="color:var(--mut);font-size:13px">${d.ticker}</span></h2><div class="sub">종가 <b style="color:var(--txt)">${fmt(L.close)}</b> ${chg(L.close,L.change)} · ${md(L.date)} 기준 · 외국인 보유 ${L.fr}%</div>
  ${(()=>{const row=raw.rows.find(x=>x.t===d.ticker);if(!row)return '';const TR=raw.themeRet||{};
    const tags=(row.th||[]).map(g=>`<span class="thtag ${(TR[g]||0)>0?'up':''}">${g}${TR[g]!=null?` <b>${TR[g]>0?'+':''}${TR[g]}%</b>`:''}</span>`).join('');
    return (row.up||tags)?`<div class="themes">${row.up?`<span class="thtag sector">${row.up}</span>`:''}${tags}</div>`:''})()}</div><div style="display:flex;gap:6px;flex:none;align-items:flex-start">${(()=>{const hp=heldPos(d.ticker);
    return `<button class="ghost mini" id="buyhere" title="${hp?'이미 보유 중입니다 — 추가 매수를 기록합니다':'규칙에 걸리지 않아도 직접 매수를 기록할 수 있습니다'}">${hp?'추가 매수':'매수'}</button>`})()}<button class="ghost mini" id="close">닫기</button></div></div>
  <div class="kpi"><div><small>최근 거래량</small><b>${kor(L.volume)}</b></div><div><small>개인 누적(${rows.length}일)</small><b class="${cls(sum('indiv'))}">${kor(sum('indiv'),1)}</b></div><div><small>기관 누적</small><b class="${cls(sum('organ'))}">${kor(sum('organ'),1)}</b></div><div><small>외국인 누적</small><b class="${cls(sum('frgn'))}">${kor(sum('frgn'),1)}</b></div></div>
  <div class="legend"><span><i style="background:#a78bfa"></i>거래량</span><span><i style="background:#eef1f6"></i>종가</span></div><div class="chart"><canvas id="c1"></canvas></div>
  <div class="legend"><span><i style="background:var(--ind)"></i>개인</span><span><i style="background:var(--org)"></i>기관</span><span><i style="background:var(--frg)"></i>외국인</span><span style="margin-left:auto">일별 순매수</span></div><div class="chart"><canvas id="c2"></canvas></div>
  <div class="legend"><span style="margin-left:auto">누적 순매수</span></div><div class="chart"><canvas id="c3"></canvas></div>`;
  $('#side').classList.add('open');$('#close').onclick=()=>$('#side').classList.remove('open');
  {const bb=$('#buyhere');
   if(bb)bb.onclick=()=>{const row=view.rows.find(x=>x.ticker===d.ticker);
     addPosition(d.ticker,d.name,row?row.close:(L?L.close:0))};}
  charts.forEach(c=>c.destroy());charts=[];
  const grid={color:'#272b34'},tick={color:'#858c99',font:{size:10}};
  const base={responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${c.dataset.label==='종가'?c.raw.toLocaleString():kor(c.raw,1)}`}}},scales:{x:{grid:{display:false},ticks:{...tick,maxTicksLimit:8}}}};
  charts.push(new Chart($('#c1'),{data:{labels,datasets:[{type:'bar',label:'거래량',data:rows.map(r=>r.volume),backgroundColor:'#a78bfa99',yAxisID:'y',borderRadius:3},{type:'line',label:'종가',data:rows.map(r=>r.close),borderColor:'#eef1f6',borderWidth:2,pointRadius:2,yAxisID:'y2',tension:.3}]},

}

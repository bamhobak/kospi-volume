<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>밤호박 종목 선별기</title>
<meta name="theme-color" content="#0f1218">
<link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json">

<style>
:root{--bg:#0f1218;--panel:#171b24;--panel2:#1e2330;--line:#2a3040;--txt:#e6e9ef;--mut:#8b93a5;--acc:#4f8cff;--up:#ff5b5b;--dn:#4f8cff;--ind:#f5a623;--org:#38c98b;--frg:#c06bff}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--txt);font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:13px;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:700;letter-spacing:-.3px;white-space:nowrap}header h1 span{color:var(--acc)}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 12px;font-size:14px;outline:none;-webkit-appearance:none}
input:focus{border-color:var(--acc)}input{flex:1;min-width:120px}
button{background:var(--acc);border:0;color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
button.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
#status{color:var(--mut);font-size:12px;margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkt{display:inline-flex;align-items:center;gap:6px;padding:0 2px;font-weight:700;font-size:13px;white-space:nowrap}
.mkt.up{color:#ff8a8a}.mkt.dn{color:#8ab4ff}
.mkt small{font-weight:400;opacity:.8}
.chk{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--acc);width:15px;height:15px;margin:0}
.opts{color:var(--mut);font-size:12px;width:100%;white-space:normal}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:2px}
.s-item{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 12px;text-align:center;min-width:78px}
.info-btn{border-color:var(--acc)!important;color:var(--acc)!important}
.info-card{cursor:pointer;color:var(--acc);font-size:15px;font-weight:700;min-width:60px}.info-card:hover{border-color:var(--acc)}
.s-item b{display:block;color:var(--acc);font-size:15px;line-height:1.2}.s-item small{color:var(--mut);font-size:10px}
.s-item{cursor:help;padding:9px 12px}.s-item:hover{border-color:var(--acc)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.s-item{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 12px;text-align:center;min-width:76px}
.info-btn{border-color:var(--acc)!important;color:var(--acc)!important}
.info-card{cursor:pointer;color:var(--acc);font-size:15px;font-weight:700;min-width:60px}.info-card:hover{border-color:var(--acc)}
.s-item b{display:block;color:var(--acc);font-size:15px;line-height:1.25}.s-item small{color:var(--mut);font-size:10px}
.themes{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.thtag{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--mut)}
.thtag.sector{border-color:var(--acc);color:var(--acc)}.thtag.up{border-color:#ff5b5b55;color:#ff8a8a}
.thtag b{font-weight:700}
.tag{display:inline-block;min-width:20px;text-align:center;background:var(--acc);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;margin-right:3px}
button.mini{padding:3px 8px;font-size:11px;border-radius:6px}
.tabs button.pos-tab{border-color:#ff5b5b55;color:#ff8a8a}.tabs button.pos-tab.on{background:#ff5b5b;border-color:#ff5b5b;color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-weight:600;padding:7px 12px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs button.mk-kp{border-color:#4f8cff55;color:#93b6ff}
.tabs button.mk-kp.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs button.mk-kq{border-color:#f5a62355;color:#f3c169}
.tabs button.mk-kq.on{background:var(--ind);border-color:var(--ind);color:#14171f}
.brk{flex-basis:100%;height:0;margin:0}
.mkleg{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--mut);margin-left:2px}
.mkleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.mkleg i.kp{background:var(--acc)}.mkleg i.kq{background:var(--ind)}
.kqtag{color:var(--ind);font-weight:700}
.tabs button.done-tab{border-color:#38c98b55;color:#7fdcb4}.tabs button.done-tab.on{background:var(--org);border-color:var(--org);color:#0f1218}
.tabs button.all-tab{opacity:.75;font-weight:500}.tabs button.all-tab.on{opacity:1;font-weight:700}.opts label{cursor:pointer}.opts input[type=checkbox]{width:14px;accent-color:var(--acc);vertical-align:-2px}.opts input{width:44px;min-width:0;padding:4px 6px;font-size:12px;text-align:right;flex:none}
td.sc{color:#b8c0d0}
.rule{margin:12px 16px 0;padding:10px 14px;border:1px solid #ff5b5b44;background:#ff5b5b0f;border-radius:12px;font-size:13px;line-height:1.6}
.rule b{color:#ff8a8a;margin-right:8px}.rule em{font-style:normal;color:var(--txt);font-weight:700}.rule small{display:block;color:var(--mut);font-size:11px}
.wrap{display:grid;grid-template-columns:1fr 470px;gap:14px;padding:12px 16px 14px;height:calc(100% - 82px - 78px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.tblwrap{overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap}
th{position:sticky;top:0;z-index:2;background:var(--panel2);color:var(--mut);font-weight:600;padding:10px 9px;text-align:right;cursor:pointer;user-select:none;border-bottom:1px solid var(--line);font-size:12px}
th.l,td.l{text-align:left}th.on{color:var(--acc)}
th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:var(--panel)}th:first-child{z-index:3;background:var(--panel2)}
td{padding:8px 9px;border-bottom:1px solid #20263280;text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#ffffff08}tr.sel td{background:#243352}
td.name{font-weight:600}td .code{color:var(--mut);font-size:11px;font-weight:400}
.pos{color:var(--up)}.neg{color:var(--dn)}
.pct{font-size:11px;opacity:.85;margin-left:3px}
.hot{background:#ff5b5b22;color:#ff8a8a;border-radius:6px;padding:2px 6px;font-weight:600}
.side{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.side h2{margin:0;font-size:18px}.side .sub{color:var(--mut);font-size:12px;margin-top:2px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi div{background:var(--panel2);border-radius:10px;padding:10px}
.kpi small{display:block;color:var(--mut);font-size:11px;margin-bottom:4px}.kpi b{font-size:14px}
.chart{background:var(--panel2);border-radius:10px;padding:8px;height:210px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--mut);text-align:center;margin-top:120px}
#close{display:none;margin-left:auto}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;padding:10px;height:calc(100% - 92px - 110px)}.rule{margin:10px 10px 0;font-size:12px}
  header{padding:10px 12px}header h1{width:100%}
  .side{position:fixed;inset:0;z-index:20;border-radius:0;background:var(--panel);transform:translateY(100%);transition:transform .25s}
  .side.open{transform:none}#close{display:inline-block}
  .kpi{grid-template-columns:repeat(2,1fr)}.chart{height:190px}
  td,th{padding:8px 7px;font-size:12px}
}
</style></head><body>
<header>
  <h1>밤호박 <span>종목 선별기</span></h1>
  <span id="mkt" class="mkt"></span>
  <div id="status">불러오는 중…</div>
  <div class="brk"></div>

  <div class="mkleg"><span><i class="kp"></i>코스피</span><span><i class="kq"></i>코스닥</span></div>

<div class="rule" id="rule" style="display:none"></div>
<div class="wrap">
  <div class="card"><div class="tblwrap"><table id="tbl"><thead></thead><tbody></tbody></table></div></div>

</div>

const $=s=>document.querySelector(s);

function kor(n,sign){if(n==null||isNaN(n))return '';const a=Math.abs(n);let s;

  {id:'P1',name:'P1 · 상승초입',mkt:'KOSPI',desc:'2개월 거래량 < 1년 평균의 50% · 최근 3거래일 ≥ 2개월 평균의 200% · 외국인 1주 순매수 ≥ 거래량의 **3%** · 2개월 평균 거래대금 ≥ 50억 · 최근 10거래일 주가 0~20% 상승 · **코스피 5일선·20일선 둘 다 위** · 업종 상대강도 > 0(업종 20일 수익률이 시장 초과) · 공매도 비중 5일평균 < 20일평균(감소 중) · 우선주 제외  ▶ 매매: **당일 종가 매수(NXT 야간거래)** 또는 다음날 시가 매수 · 10거래일 보유 · 익절 +20% · 손절 없음 · **다음날 시가가 +5% 이상 갭상승하면 매수 보류**  ▶ 백테스트 2019~26(8년, 절대수익): 평균 +3.13% / 중앙값 +1.64% / 승률 55% (139건)  ▶ **학습(2019~22) +2.59% → 검증(2023~26) +3.54%** — 세 필터 중 유일하게 검증기간이 학습기간보다 좋습니다(과최적화 흔적 없음). 대신 수익률 자체는 가장 낮습니다',

function val(r,k){if(k==='hits')return FILTERS.filter(f=>f.fn(r)).length;if(k.startsWith('d:'))return r.vols[+k.slice(2)]??-1;return r[k]??-1}

<style>
:root{--dim:#5b626d;--faint:#41474f;--bg:#0a0b0e;--panel:#101217;--panel2:#171a21;--line:#272b34;--txt:#eef1f6;--mut:#858c99;/* 강조색은 손익색과 절대 겹치지 않게 분리한다 — 예전엔 --acc 와 --dn 이 둘 다 민트(5eead4)였다 */--acc:#a78bfa;--up:#f87171;--dn:#60a5fa;--ind:#fbbf24;--org:#34d399;--bth:#4ade80;/* 공통(A) 규칙 초록 */--usc:#fb923c;/* 미장(N) 규칙 주황 — D 계열 amber 와 구분 */--frg:#e879f9}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:13px;overflow:hidden}

header h1:active{opacity:.6}header h1 span{color:var(--acc)}
input:not([type=checkbox]),select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:0;padding:8px 12px;font-size:14px;outline:none;-webkit-appearance:none}

button{background:var(--acc);border:0;color:#0a0b0e;border-radius:0;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}

.s-item b{display:block;color:var(--acc);font-size:15px;line-height:1.2}.s-item small{color:var(--mut);font-size:10px}
.s-item{cursor:help;padding:9px 12px}.s-item:hover{border-color:var(--acc)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.s-item{background:var(--panel2);border:1px solid var(--line);border-radius:0;padding:5px 12px;text-align:center;min-width:76px}
.info-btn{border-color:var(--acc)!important;color:var(--acc)!important}
.info-card{cursor:pointer;color:var(--acc);font-size:15px;font-weight:700;min-width:60px}.info-card:hover{border-color:var(--acc)}
.s-item b{display:block;color:var(--acc);font-size:15px;line-height:1.25;font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}.s-item small{color:var(--mut);font-size:10px}
.themes{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

.thtag.sector{border-color:var(--acc);color:var(--acc)}.thtag.up{border-color:#f8717155;color:#f87171}
.thtag b{font-weight:700}
.tag.kq{background:var(--ind)}.tag.bo{background:var(--bth)}.tag.us{background:var(--usc)}
.tag{display:inline-block;min-width:20px;text-align:center;background:var(--acc);color:#0a0b0e;border-radius:0;padding:1px 6px;font-size:11px;font-weight:700;margin-right:3px}
button.mini{padding:3px 8px;font-size:11px;border-radius:0}
.tabs button.pos-tab{border-color:#f8717155;color:#f87171}.tabs button.pos-tab.on{background:#f87171;border-color:#f87171;color:#0a0b0e}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-weight:600;padding:7px 12px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#0a0b0e}

.brk{flex-basis:100%;height:0;margin:0}

.mkleg i.kp{background:var(--acc)}.mkleg i.kq{background:var(--ind)}
.kqtag{color:var(--ind);font-weight:700}
.tabs button.done-tab{border-color:#34d39955;color:#34d399}.tabs button.done-tab.on{background:var(--org);border-color:var(--org);color:#0a0b0e}
.tabs button.all-tab{opacity:.75;font-weight:500}.tabs button.all-tab.on{opacity:1;font-weight:700}.opts label{cursor:pointer}.opts input[type=checkbox]{width:14px;accent-color:var(--acc);vertical-align:-2px}.opts input{width:44px;min-width:0;padding:4px 6px;font-size:12px;text-align:right;flex:none}
td.sc{color:#99a0ac}
.rule{margin:12px 16px 0;padding:10px 14px;border:1px solid #f8717144;background:#f871710f;border-radius:0;font-size:13px;line-height:1.6}
.rule b{color:#f87171;margin-right:8px}.rule em{font-style:normal;color:var(--txt);font-weight:700}.rule small{display:block;color:var(--mut);font-size:11px}
header{height:52px;padding:0 18px;flex-wrap:nowrap;gap:16px}
.mktstate{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;background:var(--panel2);
          border:1px solid var(--line);color:var(--mut);font-size:11px;white-space:nowrap}
.mktstate i{width:6px;height:6px;border-radius:999px;background:var(--org);display:inline-block}
.mktstate b{color:var(--txt)}
body{display:flex;flex-direction:column;height:100%}
header{flex:none}
.shell{display:flex;flex:1;min-height:0}
.rail{width:212px;flex:none;background:#0c0e12;border-right:1px solid var(--line);
      display:flex;flex-direction:column;padding:14px 10px;gap:15px;overflow-y:auto}
.railtog{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
  padding:8px 10px;font-size:12px;color:var(--mut);border:1px solid var(--line);
  background:var(--panel2);width:100%}
.railtog:hover{color:var(--txt)}
.railtog .n{margin-left:auto;font-family:'JetBrains Mono',monospace;color:var(--dim);font-size:11px}
.descmore{cursor:pointer;color:var(--acc);white-space:nowrap}
.descmore:hover{text-decoration:underline}
.rail .k{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.08em;padding:0 8px 4px}
.rail .k.khead{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.rail .freq{font-weight:600;letter-spacing:0;color:var(--mut);font-size:10px;cursor:help;
  white-space:nowrap}
.rail .freq:hover{color:var(--txt)}
.rail .grp{display:flex;flex-direction:column;gap:4px}
.rail .it{display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;
          border:1px solid transparent;color:var(--mut);white-space:nowrap;font-weight:600}
.rail .it:hover{background:var(--panel2)}
.rail .it.on{background:var(--panel2);border-color:var(--acc);color:var(--txt)}
.rail .it .n{margin-left:auto;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:var(--dim)}
.rail .it.on .n{color:var(--acc);font-weight:700}
.rail .it .bar{width:5px;height:15px;flex:none;background:var(--acc);opacity:.14}
.rail .it.on .bar{opacity:1}
.rail .it.kq .bar{background:var(--ind)}.rail .it.kq.on{border-color:var(--ind)}.rail .it.kq.on .n{color:var(--ind)}
.rail .it.bo .bar{background:var(--bth)}.rail .it.bo.on{border-color:var(--bth)}.rail .it.bo.on .n{color:var(--bth)}
.rail .it.us .bar{background:var(--usc)}.rail .it.us.on{border-color:var(--usc)}.rail .it.us.on .n{color:var(--usc)}
.rail .it.pos.on{border-color:var(--up)}.rail .it.pos.on .n{color:var(--up)}
.rail .it.done.on{border-color:var(--org)}.rail .it.done.on .n{color:var(--org)}
.rail .it .rid{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;width:20px;color:var(--acc)}
/* 발현 장세는 왼쪽 세로 막대 색으로 — 상승장 붉은색, 하락장 파란색.
   글자는 회색 그대로 두어 목록이 균질하게 읽힌다.
   시장 구분(코스피/코스닥)은 규칙 코드 색이 계속 담당한다(.it.kq .rid). */
/* 규칙 행은 끌어서 순서를 바꿀 수 있다 */
.rail .it[data-rule]{cursor:grab}.rail .it[data-rule]:active{cursor:grabbing}
.rail .it.rdrag{box-shadow:inset 0 3px 0 var(--acc)}
.rail .it.rgrab{opacity:.5}
.rail .it.rg-up .bar{background:var(--up)}
.rail .it.rg-down .bar{background:var(--dn)}
/* 국면 조건이 없는 규칙(양쪽에서 도는 규칙)은 위 절반 빨강·아래 절반 파랑으로 표시한다.
   이 규칙이 없으면 앞의 시장색(.us 주황)이 남아 상승장 규칙처럼 보인다(2026-09-10). */
.rail .it.rg-both .bar{background:var(--mut)}
.rail .it.kq .rid{color:var(--ind)}.rail .it.bo .rid{color:var(--bth)}.rail .it.us .rid{color:var(--usc)}
.rail .sec{padding:11px;background:var(--panel2);border:1px solid var(--line)}

.k{color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.08em}
.dsum{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:2px}

/* 시장별로 저장된 순서대로 정렬. 순서에 없는(새로 생긴) 규칙은 뒤에 붙는다. */
function ordered(mkt){
  const base=FILTERS.filter(f=>f.mkt===mkt);
  const ord=(loadROrder()||{})[mkt];
  if(!Array.isArray(ord)||!ord.length)return base;
  const by={};base.forEach(f=>by[f.id]=f);
  const out=[],seen=new Set();
  ord.forEach(id=>{if(by[id]&&!seen.has(id)){out.push(by[id]);seen.add(id)}});
  base.forEach(f=>{if(!seen.has(f.id))out.push(f)});
  return out;
}
/* 공통(BOTH) 규칙은 A1·A2… 로 코스피·코스닥 뒤에 붙는다 */
const orderedAll=()=>ordered('KOSPI').concat(ordered('KOSDAQ')).concat(ordered('BOTH')).concat(ordered('US'));
/* 표시 번호 — 순서에서 계산한다. 폐기 규칙(P0)처럼 목록에 없으면 원래 코드 그대로. */
function codeOf(id){
  const nid=normId(id);
  for(const mkt of ['KOSPI','KOSDAQ','BOTH','US']){
    const i=ordered(mkt).findIndex(f=>f.id===nid);
    if(i>=0)return ({KOSPI:'P',KOSDAQ:'D',BOTH:'A',US:'N'}[mkt])+(i+1);
  }
  return nid;
}
const fcode=id=>codeOf(id);

/* 보유 중인 포지션(미매도) 을 돌려준다 — 규칙 탭에서 '이미 보유' 표시에 쓴다 */
function heldPos(code){return positions().find(p=>p.code===code&&!p.sell)||null}
function heldDays(p){try{const a=new Date(p.date.slice(0,4),+p.date.slice(4,6)-1,p.date.slice(6,8));
  return Math.max(0,Math.round((Date.now()-a)/864e5))}catch(e){return null}}
/* 그 규칙으로 이미 산 종목인가 — 같은 규칙 탭에서는 감추고, 다른 규칙에 걸렸을 때만 보여준다 */
function heldBy(code,rid){const p=heldPos(code);
  return !!(p&&(p.filters||[]).some(f=>normId(f)===normId(rid)))}
function passes(r){
  if(cur==='done'||cur==='pos')return false;   /* 규칙 탭이 아닌 곳에서는 걸러 낼 것이 없다 */
  if(cur==='kp')return r.mk==='KOSPI';        /* 전체 종목 탭은 보유 여부와 무관하게 다 보여준다 */
  if(cur==='kq')return r.mk==='KOSDAQ';
  if(cur==='us')return r.mk==='US';
  /* 그 규칙으로 이미 산 종목은 그 탭에서 감춘다(기존과 동일).
     다른 규칙에 새로 걸린 경우에만 남기고 '어느 규칙으로 보유 중' 인지 배지로 알린다. */

  if(cur==='all')return FILTERS.some(f=>f.fn(r)&&!heldBy(r.ticker,f.id));

/* 규칙 목록 맨 아래 신호 빈도 — 지금 국면의 예상치만 한 줄로, 근거는 툴팁에.

   두 조각을 곱한다.
   (1) 규칙별 stats.perMonth(검증기간 실측)를 게이트별로 합산 — 규칙을 추가하면 자동 반영
   (2) 코스피 60일선 이격도 구간별 배율 — 같은 '하락장' 이라도 이격 -2% 와 -20% 는
       신호량이 700배 차이가 난다(실측). 국면 이분법만으로는 예상치가 무의미하다.
   배율은 2018~26 전 규칙 신호를 이격 구간별로 세어 같은 국면 평균으로 나눈 값이다. */
const FREQ_MULT=[[-20,36.3],[-10,7.0],[-5,0.83],[-2,0.22],[0,0.05],[3,0.74],[7,0.94],[999,1.54]];
function freqNote(){
  let up=0, dn=0, miss=0;
  orderedAll().forEach(f=>{
    const pm=(f.stats&&typeof f.stats.perMonth==='number')?f.stats.perMonth:null;
    if(pm===null){miss++;return}
    const g=f.gate||'always';
    if(g==='up60')up+=pm; else if(g==='dn60'||g==='dn20')dn+=pm; else {up+=pm;dn+=pm}
  });
  const k=raw.kospi||{};
  const dev=(k.close&&k.ma60)?(k.close/k.ma60-1)*100:null;
  const isUp=GATE.up60(k), isDn=GATE.dn60(k);
  const gateSum=isUp?up:(isDn?dn:null);
  let mult=null;
  if(dev!==null){for(const[hi,m]of FREQ_MULT){if(dev<=hi){mult=m;break}}}
  const est=(gateSum!==null&&mult!==null)?gateSum*mult:null;
  const fx=v=>v>=10?v.toFixed(0):v.toFixed(1);
  const txt=est!==null?`월 ${fx(est)}건(예상)`
    :(gateSum!==null?`월 ${fx(gateSum)}건(예상)`:`상승장 월 ${fx(up)}건 · 하락장 월 ${fx(dn)}건`);
  const tip=[
    est!==null?`지금: 코스피 60일선 이격 ${dev.toFixed(1)}% · ${isUp?'상승장':'하락장'}`:null,
    est!==null?`계산: 국면 기준 월 ${fx(gateSum)}건 × 이격 구간 배율 ${mult} = 약 ${fx(est)}건`:null,
    '',
    `국면 기준  상승장 월 ${fx(up)}건 · 하락장 월 ${fx(dn)}건`,
    '  규칙별 검증기간(2023~) 실측 빈도를 게이트별로 합한 값입니다.',
    '  상승장 전용 규칙과 하락장 전용 규칙은 동시에 열리지 않으므로 따로 셉니다.',
    '',
    '이격 구간 배율 (2018~26 실측)',
    '  -20%↓ 36.3배 · -20~-10% 7.0배 · -10~-5% 0.83배 · -5~-2% 0.22배',
    '  -2~0% 0.05배 · 0~+3% 0.74배 · +3~+7% 0.94배 · +7%↑ 1.54배',
    '  같은 하락장이라도 이격 -2% 와 -20% 는 신호량이 700배 차이 납니다.',
    '',
    '신호는 폭락 구간에 몰려 나옵니다 — 평상시엔 80~89% 의 날이 0건입니다.',
    miss?`성적을 아직 재지 않은 규칙 ${miss}개는 빠져 있습니다.`:null
  ].filter(x=>x!==null&&x!==undefined).join(String.fromCharCode(10));
  return `<div class="freq" title="${tip.replace(/"/g,'&quot;')}">${txt}</div>`;
}
/* 규칙이 어느 시장 것인지 → 색 클래스. 한 곳에서만 정한다.

  /* 규칙 행을 끌어 순서 변경 — 코스피↔코스닥은 서로 넘어가지 못한다.

    const w=window.open(base+'?detail='+b.dataset.detail,'detail_'+b.dataset.detail,
                        'width=560,height=920,scrollbars=yes,resizable=yes');
    if(w)w.focus(); else alert('팝업이 차단되었습니다. 브라우저에서 이 사이트의 팝업을 허용해주세요.');});
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=e=>{e.stopPropagation();const r=view.rows.find(x=>x.ticker===b.dataset.buy);addPosition(r.ticker,r.name,r.close)});
}
async function showStock(code){
  const d=await (await fetch(`data/stock/${code}.json?v=${raw.updated}`)).json();
  const n=20;const rows=d.rows.slice(-n).map(x=>({date:d.dates[x[0]],close:x[1],change:x[2],volume:x[3],indiv:x[4],organ:x[5],frgn:x[6],fr:x[7]}));
  if(!rows.length)return;const L=rows[rows.length-1],labels=rows.map(r=>md(r.date));const sum=k=>rows.reduce((a,r)=>a+(r[k]||0),0);
  $('#side').innerHTML=`<div style="display:flex;align-items:flex-start"><div><h2>${d.name} <span style="color:var(--mut);font-size:13px">${d.ticker}</span></h2><div class="sub">종가 <b style="color:var(--txt)">${fmt(L.close)}</b> ${chg(L.close,L.change)} · ${md(L.date)} 기준 · 외국인 보유 ${L.fr}%</div>
  ${(()=>{const row=raw.rows.find(x=>x.t===d.ticker);if(!row)return '';const TR=raw.themeRet||{};
    const tags=(row.th||[]).map(g=>`<span class="thtag ${(TR[g]||0)>0?'up':''}">${g}${TR[g]!=null?` <b>${TR[g]>0?'+':''}${TR[g]}%</b>`:''}</span>`).join('');
    return (row.up||tags)?`<div class="themes">${row.up?`<span class="thtag sector">${row.up}</span>`:''}${tags}</div>`:''})()}</div><div style="display:flex;gap:6px;flex:none;align-items:flex-start">${(()=>{const hp=heldPos(d.ticker);
    return `<button class="ghost mini" id="buyhere" title="${hp?'이미 보유 중입니다 — 추가 매수를 기록합니다':'규칙에 걸리지 않아도 직접 매수를 기록할 수 있습니다'}">${hp?'추가 매수':'매수'}</button>`})()}<button class="ghost mini" id="close">닫기</button></div></div>
  <div class="kpi"><div><small>최근 거래량</small><b>${kor(L.volume)}</b></div><div><small>개인 누적(${rows.length}일)</small><b class="${cls(sum('indiv'))}">${kor(sum('indiv'),1)}</b></div><div><small>기관 누적</small><b class="${cls(sum('organ'))}">${kor(sum('organ'),1)}</b></div><div><small>외국인 누적</small><b class="${cls(sum('frgn'))}">${kor(sum('frgn'),1)}</b></div></div>
  <div class="legend"><span><i style="background:#a78bfa"></i>거래량</span><span><i style="background:#eef1f6"></i>종가</span></div><div class="chart"><canvas id="c1"></canvas></div>
  <div class="legend"><span><i style="background:var(--ind)"></i>개인</span><span><i style="background:var(--org)"></i>기관</span><span><i style="background:var(--frg)"></i>외국인</span><span style="margin-left:auto">일별 순매수</span></div><div class="chart"><canvas id="c2"></canvas></div>
  <div class="legend"><span style="margin-left:auto">누적 순매수</span></div><div class="chart"><canvas id="c3"></canvas></div>`;
  $('#side').classList.add('open');$('#close').onclick=()=>$('#side').classList.remove('open');
  {const bb=$('#buyhere');
   if(bb)bb.onclick=()=>{const row=view.rows.find(x=>x.ticker===d.ticker);
     addPosition(d.ticker,d.name,row?row.close:(L?L.close:0))};}
  charts.forEach(c=>c.destroy());charts=[];
  const grid={color:'#272b34'},tick={color:'#858c99',font:{size:10}};
  const base={responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${c.dataset.label==='종가'?c.raw.toLocaleString():kor(c.raw,1)}`}}},scales:{x:{grid:{display:false},ticks:{...tick,maxTicksLimit:8}}}};
  charts.push(new Chart($('#c1'),{data:{labels,datasets:[{type:'bar',label:'거래량',data:rows.map(r=>r.volume),backgroundColor:'#a78bfa99',yAxisID:'y',borderRadius:3},{type:'line',label:'종가',data:rows.map(r=>r.close),borderColor:'#eef1f6',borderWidth:2,pointRadius:2,yAxisID:'y2',tension:.3}]},
    options:{...base,scales:{...base.scales,y:{grid,ticks:{...tick,callback:v=>kor(v)}},y2:{position:'right',grid:{display:false},ticks:{...tick,callback:v=>v.toLocaleString()}}}}}));
  const ds=(k,label,c)=>({label,data:rows.map(r=>r[k]),backgroundColor:c,borderColor:c});
  charts.push(new Chart($('#c2'),{type:'bar',data:{labels,datasets:[ds('indiv','개인','#fbbf24'),ds('organ','기관','#34d399'),ds('frgn','외국인','#e879f9')]},options:{...base,scales:{...base.scales,y:{grid,ticks:{...tick,callback:v=>kor(v,1)}}}}}));
  const cum=k=>{let a=0;return rows.map(r=>a+=(r[k]||0))};
  charts.push(new Chart($('#c3'),{type:'line',data:{labels,datasets:[{label:'개인',data:cum('indiv'),borderColor:'#fbbf24',tension:.3,pointRadius:1},{label:'기관',data:cum('organ'),borderColor:'#34d399',tension:.3,pointRadius:1},{label:'외국인',data:cum('frgn'),borderColor:'#e879f9',tension:.3,pointRadius:1}]},options:{...base,scales:{...base.scales,y:{grid,ticks:{...tick,callback:v=>kor(v,1)}}}}}));
}


load();

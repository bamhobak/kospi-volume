<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>밤호박 종목 선별기</title>
<meta name="theme-color" content="#0f1218">
<link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="sb.js"></script>
<style>
:root{--bg:#0f1218;--panel:#171b24;--panel2:#1e2330;--line:#2a3040;--txt:#e6e9ef;--mut:#8b93a5;--acc:#4f8cff;--up:#ff5b5b;--dn:#4f8cff;--ind:#f5a623;--org:#38c98b;--frg:#c06bff}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--txt);font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:13px;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:700;letter-spacing:-.3px;white-space:nowrap}header h1 span{color:var(--acc)}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 12px;font-size:14px;outline:none;-webkit-appearance:none}
input:focus{border-color:var(--acc)}input{flex:1;min-width:120px}
button{background:var(--acc);border:0;color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
button.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
#status{color:var(--mut);font-size:12px;width:100%}
.mkt{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.mkt.up{background:#ff5b5b22;color:#ff8a8a;border:1px solid #ff5b5b55}.mkt.dn{background:#4f8cff22;color:#8ab4ff;border:1px solid #4f8cff55}
.mkt small{font-weight:400;opacity:.8}
.chk{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--acc);width:15px;height:15px;margin:0}
.opts{color:var(--mut);font-size:12px;width:100%;white-space:normal}
.tag{display:inline-block;min-width:20px;text-align:center;background:var(--acc);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;margin-right:3px}
button.mini{padding:3px 8px;font-size:11px;border-radius:6px}
.tabs button.pos-tab{border-color:#ff5b5b55;color:#ff8a8a}.tabs button.pos-tab.on{background:#ff5b5b;border-color:#ff5b5b;color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-weight:600;padding:7px 12px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}.opts label{cursor:pointer}.opts input[type=checkbox]{width:14px;accent-color:var(--acc);vertical-align:-2px}.opts input{width:44px;min-width:0;padding:4px 6px;font-size:12px;text-align:right;flex:none}
td.sc{color:#b8c0d0}
.rule{margin:12px 16px 0;padding:10px 14px;border:1px solid #ff5b5b44;background:#ff5b5b0f;border-radius:12px;font-size:13px;line-height:1.6}
.rule b{color:#ff8a8a;margin-right:8px}.rule em{font-style:normal;color:var(--txt);font-weight:700}.rule small{display:block;color:var(--mut);font-size:11px}
.wrap{display:grid;grid-template-columns:1fr 470px;gap:14px;padding:12px 16px 14px;height:calc(100% - 82px - 78px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.tblwrap{overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap}
th{position:sticky;top:0;z-index:2;background:var(--panel2);color:var(--mut);font-weight:600;padding:10px 9px;text-align:right;cursor:pointer;user-select:none;border-bottom:1px solid var(--line);font-size:12px}
th.l,td.l{text-align:left}th.on{color:var(--acc)}
th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:var(--panel)}th:first-child{z-index:3;background:var(--panel2)}
td{padding:8px 9px;border-bottom:1px solid #20263280;text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#ffffff08}tr.sel td{background:#243352}
td.name{font-weight:600}td .code{color:var(--mut);font-size:11px;font-weight:400}
.pos{color:var(--up)}.neg{color:var(--dn)}
.pct{font-size:11px;opacity:.85;margin-left:3px}
.hot{background:#ff5b5b22;color:#ff8a8a;border-radius:6px;padding:2px 6px;font-weight:600}
.side{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.side h2{margin:0;font-size:18px}.side .sub{color:var(--mut);font-size:12px;margin-top:2px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi div{background:var(--panel2);border-radius:10px;padding:10px}
.kpi small{display:block;color:var(--mut);font-size:11px;margin-bottom:4px}.kpi b{font-size:14px}
.chart{background:var(--panel2);border-radius:10px;padding:8px;height:210px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--mut);text-align:center;margin-top:120px}
#close{display:none;margin-left:auto}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;padding:10px;height:calc(100% - 92px - 110px)}.rule{margin:10px 10px 0;font-size:12px}
  header{padding:10px 12px}header h1{width:100%}
  .side{position:fixed;inset:0;z-index:20;border-radius:0;background:var(--panel);transform:translateY(100%);transition:transform .25s}
  .side.open{transform:none}#close{display:inline-block}
  .kpi{grid-template-columns:repeat(2,1fr)}.chart{height:190px}
  td,th{padding:8px 7px;font-size:12px}
}
</style></head><body>
<header>
  <h1>밤호박 <span>종목 선별기</span></h1>
  <span id="mkt" class="mkt"></span>
  <nav id="tabs" class="tabs"></nav>
  <div id="fdesc" class="opts"></div>
  <div id="status">불러오는 중…</div>
</header>
<div class="rule"><b>추천 매매 규칙</b> <span>코스피 5일선 <em>위</em>(▲)일 때만 매수 · 월요일 시가 매수 · <em>15거래일</em> 보유 · 고점 대비 <em>-8%</em> 되돌림 시 조기 매도(트레일링) · 퍼센트 익절·고정 손절 없음</span><small>백테스트 6/8~8/24 · 16건 · 평균 +7.8% · 승률 69% · 5일선 위 매수 시 5일 승률 90% / 아래 17% — 표본이 작으니 소액 분산으로 검증하며 운용</small></div>
<div class="wrap">
  <div class="card"><div class="tblwrap"><table id="tbl"><thead></thead><tbody></tbody></table></div></div>
  <div class="card side" id="side"><div class="empty">종목을 클릭하면 거래량·투자자 추이가 표시됩니다</div></div>
</div>
<script>
const $=s=>document.querySelector(s);
// 천/만/억 단위 축약
function kor(n,sign){if(n==null||isNaN(n))return '';const a=Math.abs(n);let s;
  if(a>=1e8)s=(a/1e8).toFixed(a>=1e9?0:1).replace(/\.0$/,'')+'억';else if(a>=1e4)s=(a/1e4).toFixed(a>=1e6?0:1).replace(/\.0$/,'')+'만';else if(a>=1e3)s=(a/1e3).toFixed(1).replace(/\.0$/,'')+'천';else s=String(Math.round(a));
  return (n<0?'-':(sign&&n>0?'+':''))+s}
const fmt=n=>n==null?'':Math.round(n).toLocaleString();const cls=n=>n>0?'pos':n<0?'neg':'';const WD=['일','월','화','수','목','금','토'];const md=d=>d.slice(4,6)+'/'+d.slice(6)+'('+WD[new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6)).getDay()]+')';
const pct=(c,ch)=>{if(c==null||ch==null||c-ch===0)return '';const p=ch/(c-ch)*100;return `<span class="pct">(${p>0?'+':''}${p.toFixed(2)}%)</span>`};
const chg=(c,ch)=>ch==null?'':`<span class="${cls(ch)}">${ch>0?'+':''}${fmt(ch)}${pct(c,ch)}</span>`;
// ===== 필터 정의: 새 필터는 이 배열에 추가 =====
const FILTERS=[
  {id:1,name:'1번 · 거래량 급등',desc:'2개월 거래량 < 1년 평균의 50% · 최근 3거래일 ≥ 2개월 평균의 200% · 외국인 1주 순매수 ≥ 1주 거래량의 2% · 거래대금 ≥ 3억 · 우선주 제외',
   fn:r=>r.r16!=null&&r.rw1!=null&&r.r16<50&&r.rw1>=200&&r.fw>0&&r.fw>=0.02*r.v5&&!r.pref&&(r.amt||0)>=3},
];
let cur='all';  // 'all' = 모든 필터 통과, 숫자 = 해당 필터만
function passes(r){return cur==='all'?FILTERS.every(f=>f.fn(r)):FILTERS.find(f=>f.id===cur).fn(r)}
function renderTabs(){$('#tabs').innerHTML=[`<button data-f="all" class="${cur==='all'?'on':''}">전체 (모든 필터 통과)</button>`,...FILTERS.map(f=>`<button data-f="${f.id}" class="${cur===f.id?'on':''}">${f.name} <small>${view.rows.filter(f.fn).length}</small></button>`),`<button data-f="pos" class="pos-tab ${cur==='pos'?'on':''}">보유 종목 <small>${positions().filter(p=>!p.sell).length}</small></button>`].join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cur=b.dataset.f==='all'?'all':b.dataset.f==='pos'?'pos':+b.dataset.f;render()});
  $('#fdesc').innerHTML=cur==='pos'?`내가 매수한 종목 관리 · 추천 규칙: 15거래일 보유, 고점 대비 -8% 이탈 시 매도 · <button class="ghost mini" id="pinbtn">${getPin()===DEFAULT_PIN?'자동 동기화 중 (PIN 변경)':'PIN: '+getPin()+' (공유 중)'}</button>`:cur==='all'?FILTERS.map(f=>`[${f.name}] ${f.desc}`).join('  |  '):FILTERS.find(f=>f.id===cur).desc;const pb=$('#pinbtn');if(pb)pb.onclick=setPin}
// ===== 보유 종목(포지션) — localStorage =====
let POS=(()=>{try{return JSON.parse(localStorage.getItem('positions')||'[]')}catch(e){return []}})();
function positions(){return POS}
const DEFAULT_PIN='bh-e0997ecc2798';  // 기본 공유 키(자동 동기화). PIN 버튼으로 변경 가능
function getPin(){try{return localStorage.getItem('pin')||DEFAULT_PIN}catch(e){return DEFAULT_PIN}}
async function rpc(fn,body){const r=await fetch(`${SB.url}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(fn+' '+r.status);const t=await r.text();return t?JSON.parse(t):null}
async function pullRemote(){const pin=getPin();if(!pin||!window.SB)return;try{const d=await rpc('kospi_state_get',{p_pin:pin});if(d&&Array.isArray(d.positions)&&d.positions.length){POS=d.positions;try{localStorage.setItem('positions',JSON.stringify(POS))}catch(e){}}else if(POS.length){await pushRemote()}}catch(e){console.warn('sync pull',e)}}
async function pushRemote(){const pin=getPin();if(!pin||!window.SB)return;try{await rpc('kospi_state_set',{p_pin:pin,p_data:{positions:POS}})}catch(e){alert('서버 저장 실패: '+e.message)}}
function savePositions(a){POS=a;try{localStorage.setItem('positions',JSON.stringify(a))}catch(e){};pushRemote()}
async function setPin(){const cur_=getPin();const v=prompt('기기 간 공유용 PIN (4자 이상). 기본값이면 모든 기기가 자동 공유됩니다. 남과 분리하고 싶을 때만 바꾸세요.',cur_===DEFAULT_PIN?'':cur_);if(v==null)return;const pin=v.trim();if(pin.length<4){if(pin===''){try{localStorage.removeItem('pin')}catch(e){};await pullRemote();render();return}alert('4자 이상 입력하세요');return}
  try{localStorage.setItem('pin',pin)}catch(e){}
  const remote=await rpc('kospi_state_get',{p_pin:pin}).catch(()=>null);
  if(remote&&Array.isArray(remote.positions)&&remote.positions.length){if(POS.length&&!confirm(`이 PIN에 저장된 보유 종목 ${remote.positions.length}건을 불러옵니다. 현재 기기의 ${POS.length}건은 덮어씁니다. 계속?`))return;POS=remote.positions;try{localStorage.setItem('positions',JSON.stringify(POS))}catch(e){}}
  else if(POS.length){await pushRemote()}
  render()}
function addPosition(code,name,close){const last=raw.dates[raw.dates.length-1];
  const date=prompt(`${name} 매수일 (YYYYMMDD)`,last);if(!date)return;
  const price=+prompt(`${name} 매수가 (원)`,close);if(!price)return;
  const qty=+(prompt(`${name} 매수 수량 (주)`,'')||0);
  const row=view.rows.find(x=>x.ticker===code);const filters=row?FILTERS.filter(f=>f.fn(row)).map(f=>f.id):[];
  const a=positions();a.push({code,name,date:date.replace(/\D/g,''),price,qty,filters,id:Date.now()});savePositions(a);cur='pos';render()}
async function renderPositions(){
  const ps=positions();
  let live={updated:'',prices:{}};try{const d=await rpc('kospi_state_get',{p_pin:'__prices__'});if(d&&d.prices)live=d}catch(e){}
  const lastD=raw.dates[raw.dates.length-1];
  const cols=['종목','필터','매수일','매수가','수량','매수금액','현재가','수익률','평가손익','보유일','고점','매도선(-8%)','상태','매도가/손익',''];
  $('#tbl thead').innerHTML='<tr>'+cols.map((c,i)=>`<th class="${[0,1,2,12,14].includes(i)?'l':''}">${c}</th>`).join('')+'</tr>';
  if(!ps.length){$('#tbl tbody').innerHTML='<tr><td colspan="15" class="l" style="color:var(--mut);padding:30px">보유 종목이 없습니다. 종목 행의 「매수」 버튼으로 추가하세요.</td></tr>';$('#status').textContent='보유 0종목';return}
  const rows=await Promise.all(ps.map(async p=>{let d=null;try{d=await (await fetch(`data/stock/${p.code}.json?v=${raw.updated}`)).json()}catch(e){}
    const rs=d?d.rows.map(x=>({date:d.dates[x[0]],close:x[1]})).filter(x=>x.date>=p.date):[];
    const lv=live.prices[p.code];const lvDate=lv&&lv.at?lv.at.slice(0,10).replace(/-/g,''):'';const useLive=lv&&lv.now&&lvDate>lastD&&lvDate>=p.date;
    const now=useLive?lv.now:(rs.length?rs[rs.length-1].close:null);
    const hi=Math.max(p.price,...rs.map(x=>x.close),useLive&&lv.high?lv.high:0);const days=rs.length+(useLive?1:0);
    const line=hi*0.92;const ret=now?(now/p.price-1)*100:null;
    let st='보유',sc='';if(p.sell){st='매도 완료';sc='sc'}else if(now!=null&&now<=line){st='⚠ 매도선 이탈';sc='pos'}else if(days>=15){st='⏰ 15일 도래';sc='pos'}
    return {p,now,hi,days,line,ret,st,sc}}));
  const pr=p=>(p.sell/p.price-1)*100;
  $('#tbl tbody').innerHTML=rows.map(({p,now,hi,days,line,ret,st,sc})=>`<tr>
    <td class="l name">${p.name} <span class="code">${p.code}</span></td>
    <td class="l">${(p.filters||[]).map(f=>`<span class="tag">${f}</span>`).join('')||'<span class="code">-</span>'}</td>
    <td class="l">${md(p.date)}</td><td>${fmt(p.price)}</td><td>${p.qty?fmt(p.qty)+'주':''}</td><td>${p.qty?kor(p.price*p.qty)+'원':''}</td><td>${fmt(now)}${(()=>{const lv=live.prices[p.code];const d=lv&&lv.at?lv.at.slice(0,10).replace(/-/g,''):'';return (lv&&lv.now&&d>lastD)?`<div class="code">${lv.at.slice(11,16)} ${lv.status==='OPEN'?'장중':'마감'}</div>`:`<div class="code">${md(lastD)} 종가</div>`})()}</td>
    <td class="${cls(ret)}">${ret==null?'':(ret>0?'+':'')+ret.toFixed(1)+'%'}</td><td class="${cls(ret)}">${p.qty&&now?kor((now-p.price)*p.qty,1)+'원':''}</td><td>${days}일</td><td>${fmt(hi)}</td><td>${fmt(line)}</td>
    <td class="l ${sc}" style="font-weight:600">${st}</td>
    <td class="${p.sell?cls(pr(p)):''}">${p.sell?fmt(p.sell)+' ('+(pr(p)>0?'+':'')+pr(p).toFixed(1)+'%'+(p.qty?' · '+kor((p.sell-p.price)*p.qty,1)+'원':'')+')':''}</td>
    <td class="l">${p.sell?'':`<button class="ghost mini" data-sell="${p.id}">매도</button>`} <button class="ghost mini" data-del="${p.id}">삭제</button></td></tr>`).join('');
  const open_=rows.filter(r=>!r.p.sell);const avg=open_.length?open_.reduce((a,r)=>a+(r.ret||0),0)/open_.length:0;
  const closed=rows.filter(r=>r.p.sell);const realized=closed.reduce((a,r)=>a+pr(r.p),0);
  const inv=open_.reduce((a,r)=>a+(r.p.qty||0)*r.p.price,0),pnl=open_.reduce((a,r)=>a+((r.p.qty&&r.now)?(r.now-r.p.price)*r.p.qty:0),0);
  $('#status').textContent=`보유 ${open_.length}종목 평균 ${avg>0?'+':''}${avg.toFixed(1)}%${inv?` · 매수금액 ${kor(inv)}원 · 평가손익 ${kor(pnl,1)}원`:''}${closed.length?` · 매도 완료 ${closed.length}건 합산 ${realized>0?'+':''}${realized.toFixed(1)}%`:''} · 장중 시세 ${live.updated?live.updated.slice(5)+' 갱신 (평일 09~16시 5분 간격)':'없음'}`;
  document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{const a=positions();const p=a.find(x=>x.id==b.dataset.sell);const r=rows.find(r=>r.p.id==p.id);
    const sell=+prompt(`${p.name} 매도가 (원)`,r.now||p.price);if(!sell)return;p.sell=sell;p.sellDate=raw.dates[raw.dates.length-1];savePositions(a);render()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('삭제할까요?'))return;savePositions(positions().filter(x=>x.id!=b.dataset.del));render()});
}
let raw={dates:[],rows:[]},view={dates:[],rows:[]},sortKey='last',desc=true,sel=null,charts=[];
async function load(){await pullRemote();raw=await (await fetch('data/table.json?v='+Date.now())).json();prep();render();mktBadge()}
function mktBadge(){const k=raw.kospi,el=$('#mkt');if(!k){el.style.display='none';return}
  const d=(k.close/k.ma5-1)*100;el.className='mkt '+(k.up?'up':'dn');
  el.innerHTML=`${k.up?'▲':'▼'} 코스피 ${k.close.toLocaleString()} <small>· 5일선 ${k.up?'위':'아래'} (${d>0?'+':''}${d.toFixed(1)}%)</small>`}
function prep(){const n=7,D=raw.dates,k=Math.max(0,D.length-n);view.dates=D.slice(k);
  view.rows=raw.rows.map(r=>{const vols=r.v.slice(k),valid=vols.filter(x=>x!=null);const sum=a=>a.slice(k).reduce((x,y)=>x+(y||0),0);
    const prev=vols.slice(0,-1).filter(x=>x!=null),last=vols[vols.length-1];const avg=valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:0;
    const ratio=(prev.length&&last!=null&&prev.reduce((a,b)=>a+b,0))?last/(prev.reduce((a,b)=>a+b,0)/prev.length)*100:null;
    return {ticker:r.t,name:r.n,close:r.c,change:r.ch,foreign_ratio:r.fr,vols,avg,total:valid.reduce((a,b)=>a+b,0),ratio,indiv:sum(r.i),organ:sum(r.o),frgn:sum(r.f),amt:r.amt,pref:r.pref,fw:r.f.slice(-5).reduce((x,y)=>x+(y||0),0),v5:r.v.slice(-5).reduce((x,y)=>x+(y||0),0),fwp:(()=>{const v=r.v.slice(-5).reduce((x,y)=>x+(y||0),0),f=r.f.slice(-5).reduce((x,y)=>x+(y||0),0);return v?f/v*100:null})(),aw:r.aw,a1:r.a1,a6:r.a6,r16:(r.a1&&r.a6)?r.a1/r.a6*100:null,rw1:(r.aw&&r.a1)?r.aw/r.a1*100:null,last:last??-1,chpct:(r.c&&r.ch!=null&&r.c-r.ch)?r.ch/(r.c-r.ch)*100:-999}})}
function val(r,k){if(k==='hits')return FILTERS.filter(f=>f.fn(r)).length;if(k.startsWith('d:'))return r.vols[+k.slice(2)]??-1;return r[k]??-1}
function render(){renderTabs();if(cur==='pos'){renderPositions();return}
  const q='';const D=view.dates;
  let rows=view.rows.filter(r=>!q||r.name.toLowerCase().includes(q)||r.ticker.includes(q));
  const th2=200;
  rows=rows.filter(passes);
  rows.sort((a,b)=>{const x=val(a,sortKey),y=val(b,sortKey);return (typeof x==='string')?(desc?y.localeCompare(x):x.localeCompare(y)):(desc?y-x:x-y)});
  const cols=[['name','종목','l'],['hits','통과 필터'],['close','종가'],['chpct','전일비'],['last','최근 거래량'],['avg','평균'],['ratio','최근/평균'],['a6','1Y평균'],['a1','2M평균'],['aw','3일평균'],['r16','2M/1Y'],['rw1','3일/2M'],['fw','외국인 1W'],['fwp','외인/거래량'],['amt','2M 거래대금'],['indiv','개인'],['organ','기관'],['frgn','외국인'],['foreign_ratio','외인비율']];
  $('#tbl thead').innerHTML='<tr>'+cols.map(c=>`<th class="${c[2]||''} ${sortKey===c[0]?'on':''}" data-k="${c[0]}">${c[1]}${sortKey===c[0]?(desc?' ▼':' ▲'):''}</th>`).join('')+'</tr>';
  $('#tbl tbody').innerHTML=rows.map(r=>`<tr data-c="${r.ticker}" class="${sel===r.ticker?'sel':''}">
    <td class="l name">${r.name} <span class="code">${r.ticker}</span></td>
    <td class="l">${FILTERS.filter(f=>f.fn(r)).map(f=>`<span class="tag">${f.id}</span>`).join('')} <button class="ghost mini" data-buy="${r.ticker}">매수</button></td>
    <td>${fmt(r.close)}</td><td>${chg(r.close,r.change)}</td>
    <td class="name">${kor(r.last<0?null:r.last)}</td><td>${kor(r.avg)}</td><td>${r.ratio==null?'':(r.ratio>=200?`<span class="hot">${Math.round(r.ratio)}%</span>`:Math.round(r.ratio)+'%')}</td>
    <td class="sc">${kor(r.a6)}</td><td class="sc">${kor(r.a1)}</td><td class="sc">${kor(r.aw)}</td><td class="sc">${r.r16==null?'':Math.round(r.r16)+'%'}</td><td>${r.rw1==null?'':(r.rw1>=th2?`<span class="hot">${Math.round(r.rw1)}%</span>`:Math.round(r.rw1)+'%')}</td><td class="${cls(r.fw)}">${kor(r.fw,1)}</td><td class="${cls(r.fwp)}">${r.fwp==null?'':r.fwp.toFixed(1)+'%'}</td><td class="sc">${r.amt==null?'':r.amt+'억'}</td>
    <td class="${cls(r.indiv)}">${kor(r.indiv,1)}</td><td class="${cls(r.organ)}">${kor(r.organ,1)}</td><td class="${cls(r.frgn)}">${kor(r.frgn,1)}</td><td>${r.foreign_ratio??''}%</td></tr>`).join('');
  $('#status').textContent=D.length?`${rows.length}종목 (${cur==='all'?'모든 필터':FILTERS.find(f=>f.id===cur).name}) · ${md(D[0])}~${md(D[D.length-1])} · 개인/기관/외국인=기간 순매수 합계(주) · 갱신 ${raw.updated}`:'데이터 없음';
  document.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortKey===k)desc=!desc;else{sortKey=k;desc=k!=='name'}render()});
  document.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>{sel=tr.dataset.c;render();showStock(sel)});
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=e=>{e.stopPropagation();const r=view.rows.find(x=>x.ticker===b.dataset.buy);addPosition(r.ticker,r.name,r.close)});
}
async function showStock(code){
  const d=await (await fetch(`data/stock/${code}.json?v=${raw.updated}`)).json();
  const n=20;const rows=d.rows.slice(-n).map(x=>({date:d.dates[x[0]],close:x[1],change:x[2],volume:x[3],indiv:x[4],organ:x[5],frgn:x[6],fr:x[7]}));
  if(!rows.length)return;const L=rows[rows.length-1],labels=rows.map(r=>md(r.date));const sum=k=>rows.reduce((a,r)=>a+(r[k]||0),0);
  $('#side').innerHTML=`<div style="display:flex;align-items:flex-start"><div><h2>${d.name} <span style="color:var(--mut);font-size:13px">${d.ticker}</span></h2><div class="sub">종가 <b style="color:var(--txt)">${fmt(L.close)}</b> ${chg(L.close,L.change)} · ${md(L.date)} 기준 · 외국인 보유 ${L.fr}%</div></div><button class="ghost" id="close">닫기</button></div>
  <div class="kpi"><div><small>최근 거래량</small><b>${kor(L.volume)}</b></div><div><small>개인 누적(${rows.length}일)</small><b class="${cls(sum('indiv'))}">${kor(sum('indiv'),1)}</b></div><div><small>기관 누적</small><b class="${cls(sum('organ'))}">${kor(sum('organ'),1)}</b></div><div><small>외국인 누적</small><b class="${cls(sum('frgn'))}">${kor(sum('frgn'),1)}</b></div></div>
  <div class="legend"><span><i style="background:#4f8cff"></i>거래량</span><span><i style="background:#e6e9ef"></i>종가</span></div><div class="chart"><canvas id="c1"></canvas></div>
  <div class="legend"><span><i style="background:var(--ind)"></i>개인</span><span><i style="background:var(--org)"></i>기관</span><span><i style="background:var(--frg)"></i>외국인</span><span style="margin-left:auto">일별 순매수</span></div><div class="chart"><canvas id="c2"></canvas></div>
  <div class="legend"><span style="margin-left:auto">누적 순매수</span></div><div class="chart"><canvas id="c3"></canvas></div>`;
  $('#side').classList.add('open');$('#close').onclick=()=>$('#side').classList.remove('open');
  charts.forEach(c=>c.destroy());charts=[];
  const grid={color:'#2a3040'},tick={color:'#8b93a5',font:{size:10}};
  const base={responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${c.dataset.label==='종가'?c.raw.toLocaleString():kor(c.raw,1)}`}}},scales:{x:{grid:{display:false},ticks:{...tick,maxTicksLimit:8}}}};
  charts.push(new Chart($('#c1'),{data:{labels,datasets:[{type:'bar',label:'거래량',data:rows.map(r=>r.volume),backgroundColor:'#4f8cff99',yAxisID:'y',borderRadius:3},{type:'line',label:'종가',data:rows.map(r=>r.close),borderColor:'#e6e9ef',borderWidth:2,pointRadius:2,yAxisID:'y2',tension:.3}]},
    options:{...base,scales:{...base.scales,y:{grid,ticks:{...tick,callback:v=>kor(v)}},y2:{position:'right',grid:{display:false},ticks:{...tick,callback:v=>v.toLocaleString()}}}}}));
  const ds=(k,label,c)=>({label,data:rows.map(r=>r[k]),backgroundColor:c,borderColor:c});
  charts.push(new Chart($('#c2'),{type:'bar',data:{labels,datasets:[ds('indiv','개인','#f5a623'),ds('organ','기관','#38c98b'),ds('frgn','외국인','#c06bff')]},options:{...base,scales:{...base.scales,y:{grid,ticks:{...tick,callback:v=>kor(v,1)}}}}}));
  const cum=k=>{let a=0;return rows.map(r=>a+=(r[k]||0))};
  charts.push(new Chart($('#c3'),{type:'line',data:{labels,datasets:[{label:'개인',data:cum('indiv'),borderColor:'#f5a623',tension:.3,pointRadius:1},{label:'기관',data:cum('organ'),borderColor:'#38c98b',tension:.3,pointRadius:1},{label:'외국인',data:cum('frgn'),borderColor:'#c06bff',tension:.3,pointRadius:1}]},options:{...base,scales:{...base.scales,y:{grid,ticks:{...tick,callback:v=>kor(v,1)}}}}}));
}

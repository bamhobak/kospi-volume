<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>규칙 후보</title>
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="sb.js"></script>
<!-- 규칙 공장 후보 페이지(2026-10-10 사용자: "규칙 후보군 한 번에 볼 수 있게, 언제든"). 밤 작업(research/factory/board.py)이 Supabase '__factory__' 에 쓴다.
     2026-11-16 사용자 "너무 길게 나열 … 사람이 보기 편하게 정리": 칸마다 한 줄 요약으로 접고(누르면 펼침), 긴 설명 글은 한 문장으로, 표는 꼭 볼 칸만.
     [갭하락] 하루 위 3개 그림자(H0362) 칸은 11-12 중단·11-16 예약 작업 삭제로 뺌. -->
<style>
:root{--bg:#0B0D12;--panel:#12151C;--panel2:#181C25;--line:#242A35;--txt:#E8ECF2;--mut:#A0A8B6;--dim:#7A8394;--acc:#F5A524;--up:#FF6166;--dn:#5B9BFF;--ind:#F5C26B;--ok:#34D3C0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans KR',Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:13.5px;line-height:1.55}
.mono{font-family:'IBM Plex Mono','IBM Plex Sans KR',ui-monospace,monospace;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
header h1{font-size:20px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
header a{color:var(--txt);text-decoration:none;border:1px solid var(--line);padding:8px 14px;background:var(--panel);border-radius:8px;font-size:12.5px}
header a:hover{border-color:var(--acc);color:var(--ind)}
header .up{margin-left:auto;color:var(--mut);font-size:12px}
main{max-width:920px;margin:0 auto;padding:16px 16px 70px}
.chips{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--mut);font-size:12.5px;margin:2px 2px 14px}
.chips b{color:var(--txt);font-family:'IBM Plex Mono',monospace;font-weight:600}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;scroll-margin-top:70px}
details.sec>summary{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;list-style:none}
details.sec>summary::-webkit-details-marker,details.more>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:'▸';color:var(--dim);width:10px;flex:none}
details.sec[open]>summary::before{content:'▾'}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
details.sec>summary:hover .t{color:var(--ind)}
details.sec.cand{background:var(--panel2);margin:0 0 8px}
.t{font-weight:700;font-size:14.5px;white-space:nowrap}
.s{flex:1;min-width:0;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w{color:var(--dim);font-size:12px;white-space:nowrap}
.body{padding:12px 16px 14px}
.hint{margin:0 0 10px;color:var(--mut);font-size:12.5px;word-break:keep-all}
.sub{margin:12px 0 6px;color:var(--mut);font-size:12.5px;font-weight:600}.sub:first-child{margin-top:0}
details.more{margin-top:6px}
details.more>summary{cursor:pointer;color:var(--mut);font-weight:600;font-size:12.5px;padding:6px 0;list-style:none}
details.more>summary::before{content:'▸ ';color:var(--dim)}details.more[open]>summary::before{content:'▾ '}
details.more>summary:hover{color:var(--ind)}
.badge{font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-weight:600;white-space:nowrap}
.g{color:var(--ok);border-color:var(--ok)}.y{color:var(--ind);border-color:var(--ind)}.r{color:var(--up);border-color:var(--up)}.m{color:var(--dim)}.b{color:var(--dn);border-color:var(--dn)}
.pos{color:var(--up)}.neg{color:var(--dn)}.muted{color:var(--mut)}.dim{color:var(--dim)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{color:var(--mut);font-weight:600;background:var(--panel2)}
td.ar,th.ar{text-align:right}
td.l{white-space:normal;min-width:180px}
tr:last-child td{border-bottom:none}
tr.base td{background:rgba(52,211,192,.06)}
td.clip{max-width:340px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
td.clip.on{white-space:normal;min-width:240px;word-break:keep-all}
.empty{color:var(--mut);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.gp{font-size:11px;padding:1px 7px;border-radius:5px;background:rgba(160,168,182,.14);color:#C9D0DB}.gp.big{background:rgba(52,211,192,.14);color:#5FE0D0}
/* 후보 카드 안 */
.desc{margin:0 0 8px;word-break:keep-all}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi small{color:var(--mut);font-size:11px;display:block}.kpi b{font-size:16px}.kpi>span{color:var(--mut);font-size:11px;display:block}
.yr{display:flex;align-items:flex-end;gap:3px;height:56px;padding:0 0 4px}
.yr div{flex:1;min-width:10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.yr i{display:block;width:100%}
.yrl{display:flex;gap:3px;padding:0 0 8px;color:var(--dim);font-size:10px}.yrl span{flex:1;min-width:10px;text-align:center}
.src{color:var(--mut);font-size:12px;word-break:break-all;margin:6px 0}.src a{color:var(--acc)}
.how{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
/* 자료 모으는 중 */
.it{padding:10px 0;border-top:1px solid var(--line)}.it:first-of-type{border-top:0;padding-top:0}
.ih{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}.ih b{font-size:13.5px}.ih .n{margin-left:auto}
.cbar{position:relative;height:8px;border-radius:99px;background:rgba(160,168,182,.16);overflow:hidden;margin:7px 0}
.cbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#5B9BFF}.cbar i.ex{background:rgba(91,155,255,.35)}
.cbar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:#F5C26B}
.gl{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:12.5px;color:var(--mut)}.gl b{color:var(--txt);font-family:'IBM Plex Mono',monospace;font-weight:600}
@media (max-width:640px){header{padding:10px 12px}main{padding:12px 12px 70px}
  details.sec>summary{flex-wrap:wrap;gap:4px 10px}.s{flex-basis:100%;order:3;margin-left:20px}.w{margin-left:auto}td.clip{max-width:200px}.kpis{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><a href="./">← 선별기</a><h1><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F5A524" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-4.6 0-8 2.7-8 6.6S7.4 20.5 12 20.5s8-3 8-6.9S16.6 7 12 7z"/><path d="M9.2 7.6c-1.3 2.2-1.3 10.4 0 12.5M14.8 7.6c1.3 2.2 1.3 10.4 0 12.5"/><path d="M12 7V4.2c1.4 0 2.6.6 3.2 1.6"/></svg>규칙 후보</h1><span class="up" id="upd">불러오는 중…</span></header>
<main>
  <div class="chips" id="chips"></div>
  <div id="root"><div class="empty">불러오는 중…</div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(v,d=2,u='%')=>v==null||v!==v?'<span class="dim">-</span>':`<span class="mono ${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${(+v).toFixed(d)}${u}</span>`;
const man=v=>v==null?'-':`<span class="mono ${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${(v/1e4).toFixed(1)}만</span>`;
const md=d=>d&&d.length>=8?d.slice(4,6)+'/'+d.slice(6,8):'-';
const YEAR=String(new Date().getFullYear());
const day=d=>!d?'-':(d.slice(0,4)===YEAR?'':d.slice(0,4)+'-')+d.slice(4,6)+'-'+d.slice(6,8);
const st=s=>s?`${pct(s.mean)} <span class="muted">· 승률 ${Math.round(s.win)}% · ${(+s.n).toLocaleString()}건${s.ex!=null?' · 초과 '+(s.ex>0?'+':'')+(+s.ex).toFixed(2):''}</span>`:'<span class="muted">-</span>';
const kpi=(lab,s,extra='')=>`<div class="kpi"><small>${lab}</small>${s?`<b class="mono">${pct(s.mean)}</b><span>승률 ${Math.round(s.win)}%${s.pf!=null?` · PF ${(+s.pf).toFixed(2)}`:''} · ${(+s.n).toLocaleString()}건${s.ny?` · 플러스 해 ${s.ypos}/${s.ny}`:''}${s.ex!=null?` · 같은 날 아무 종목 대비 ${s.ex>0?'+':''}${(+s.ex).toFixed(2)}%p`:''}${extra}</span>`:'<b class="muted">-</b>'}</div>`;
async function rpc(fn,body){const r=await fetch(`${SB.url}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(fn+' '+r.status);const t=await r.text();return t?JSON.parse(t):null}
/* 펼쳐 둔 칸 — 다시 그려도 그대로. 새로 들어오면 접힌 채로 시작(검토 대기 후보가 있으면 그 칸만 펼침). */
const OPEN=new Set();if(location.hash)OPEN.add(location.hash.slice(1));
document.addEventListener('toggle',e=>{const d=e.target;if(!d.id)return;d.open?OPEN.add(d.id):OPEN.delete(d.id)},true);
document.addEventListener('click',e=>{const c=e.target.closest('td.clip');if(c)c.classList.toggle('on')});
function sec(id,t,s,w,html,b,cls){return `<details class="sec${cls?' '+cls:''}" id="${id}"${OPEN.has(id)?' open':''}><summary><span class="t">${t}</span>${b||''}<span class="s">${s||''}</span>${w?`<span class="w">${w}</span>`:''}</summary><div class="body">${html}</div></details>`}
function more(id,label,html){return `<details class="more" id="${id}"${OPEN.has(id)?' open':''}><summary>${label}</summary>${html}</details>`}
function tbl(head,rows){return `<div class="tw"><table><thead><tr>${head.map(h=>/^<th/.test(h)?h:`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
const hint=s=>`<p class="hint">${s}</p>`;
const bdg=(c,s)=>`<span class="badge ${c}">${s}</span>`;
const clip=s=>`<td class="clip" title="누르면 전체">${esc(s)}</td>`;
const R=h=>`<th class="ar">${h}</th>`;

/* ── 검토 대기 후보 ── */
function yearly(Y){if(!Y||!Y.length)return'';const mx=Math.max(...Y.map(y=>Math.abs(y[2])),.01);
  return `<div class="yr">${Y.map(([y,n,m])=>`<div title="${y} · ${n}건 · ${m>0?'+':''}${m.toFixed(2)}%"><i style="height:${Math.max(2,Math.abs(m)/mx*50)}px;background:${m>=0?'var(--up)':'var(--dn)'}"></i></div>`).join('')}</div>
  <div class="yrl">${Y.map(([y])=>`<span>${String(y).slice(2)}</span>`).join('')}</div>`}
function cand(d){const r=d.res||{};const e=r.honest||r.va;const id='c-'+d.id;
  const src=/https?:\/\/\S+/.exec(d.source||'');
  const mks=(d.pass_mk||[]).map(m=>bdg(m==='US'?'g':'y',m==='US'?'미장 통과':'국장 통과')).join('');
  const V=d.variants||[],P=d.parts||[],O=d.overlap||[],SB_=d.siblings||[],RC=d.recent||[];
  const body=`<p class="desc">${esc(d.desc)}</p>
    <div class="kpis">${kpi('국장 참고 2010~15',r.ref)}${kpi('국장 학습 2016~22',r.tr)}${kpi('국장 검증 2023~',r.va)}${r.honest?kpi('15:19 가격으로 고르면(2023~)',r.honest):''}
      <div class="kpi"><small>다중검정 · 빈도</small><b class="mono">${r.dsr!=null?(+r.dsr).toFixed(2):'-'}</b><span>신호 날 하루 ${d.perday}종목 · 신호 있는 날 ${d.dayshare}%</span></div></div>
    ${d.res_us?`<div class="kpis">${kpi('미장 학습 2016~22',d.res_us.tr)}${kpi('미장 검증 2023~',d.res_us.va)}<div class="kpi"><small>미장 판정</small><b>${(d.pass_mk||[]).includes('US')?'<span class="pos">통과</span>':'탈락'}</b><span>${esc(d.why_us||'')}</span></div></div>`:`<p class="src">미장: ${esc(d.why_us||'판정 전')}</p>`}
    ${yearly(d.yearly)}`
    +more(id+'-v',`조정 후보 ${V.length}개`,tbl(['바꾼 것','참고 2010~15','학습 2016~22','검증 2023~'],[`<tr class="base"><td class="l"><b>원안</b></td><td>${st(r.ref)}</td><td>${st(r.tr)}</td><td>${st(r.va)}</td></tr>`,...V.map(v=>`<tr><td class="l">${esc(v.label)}</td><td>${st(v.ref)}</td><td>${st(v.tr)}</td><td>${st(v.va)}</td></tr>`)])
      +hint('검증 칸만 좋은 것보다 참고·학습 칸도 같이 좋은 걸로 고른다.'))
    +more(id+'-p','어디서 먹히나 — 종목 크기·시장 국면·비용',tbl(['나눔','학습 2016~22','검증 2023~'],P.map(p=>`<tr><td class="l">${esc(p.label)}</td><td>${st(p.tr)}</td><td>${st(p.va)}</td></tr>`)))
    +more(id+'-r','최근 신호 10개 · 겹침 · 형제',(O.length?`<p class="src">${O.map(o=>`${esc(o.with)} 와 겹침 ${o.pct}%`).join(' · ')}</p>`:'')+(SB_.length?`<p class="src">형제: ${SB_.map(esc).join(', ')}</p>`:'')
      +tbl(['날짜','종목','수익(비용 뒤)'],RC.map(([dt,n,rr])=>`<tr><td class="mono">${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6)}</td><td>${esc(n)}</td><td>${pct(rr)}</td></tr>`)))
    +more(id+'-h','실전이면 · 출처 · 못 옮긴 부분',`<div class="how">${esc(d.how)}</div>
      <p class="src">출처: ${esc(d.origin)} · ${src?`<a href="${esc(src[0])}" target="_blank" rel="noopener">${esc((d.source||'').replace(src[0],'').trim()||src[0])}</a>`:esc(d.source)}</p>
      ${d.approx?`<p class="src">근사한 부분: ${esc(d.approx)}</p>`:''}${d.untestable?`<p class="src">못 옮긴 부분: ${esc(d.untestable)}</p>`:''}
      ${d.fwd&&d.fwd.n?`<p class="src">통과 뒤 앞으로 성적: ${d.fwd.n}건 ${pct(d.fwd.mean)} · 승률 ${Math.round(d.fwd.win)}% (${d.fwd.days}거래일)</p>`:`<p class="src">통과 뒤 앞으로 성적: 아직 없음(${esc(d.since||'')}부터 기록)</p>`}`);
  return sec(id,`<span class="mono" style="color:var(--ind)">${esc(d.id)}</span>`,
    `${esc(d.name)}${e?` · 검증 ${pct(e.mean)} · 승률 ${Math.round(e.win)}%${e.pf!=null?` · PF ${(+e.pf).toFixed(2)}`:''} · 하루 ${d.perday}종목`:''}`,'',body,
    bdg(d.status==='adopted'?'g':'y',{review:'검토 대기',adopted:'채택'}[d.status]||esc(d.status))+bdg('m',esc(d.kind))+mks,'cand')}
function secCands(F){
  if(!F)return S.tried?sec('cands','검토 대기 후보','아직 데이터 없음','','<div class="empty">공장 밤 작업이 한 번 돌면 채워진다</div>'):'';
  const C=F.cands||[];
  return sec('cands','검토 대기 후보',C.length?`${C.length}개 · `+C.slice(0,4).map(d=>esc(d.id)).join(' · '):'지금은 없음','',
    hint('학습(2016~22)·잠가 둔 검증(2023~)·다중검정을 통과한 것만 올라온다. 수익은 비용 뒤 건당. 채택·조정은 클로드 창에서 "F0035 채택"처럼.')
    +(C.length?C.map(cand).join(''):'<div class="empty">지금은 검토 대기 후보가 없다</div>'),C.length?bdg('y',C.length+'개'):'')}

/* ── 그림자 테스트 중 — NXT 장후(H0366). 서버 nxt_shadow.py 가 '__nxt__' 에 단계마다 올린다 ── */
function secNxt(N){
  if(!N||!N.updated)return '';
  const won=v=>v==null?'-':Math.round(v).toLocaleString();
  const amt=v=>v==null||!v?'-':(v>=1e8?(v/1e8).toFixed(1)+'억':Math.round(v/1e4).toLocaleString()+'만');
  const S=N.snap||{};const rows=[...(S.picks||[]).map(x=>({...x,g:'상위 절반'})),...(S.big||[]).filter(x=>!(S.picks||[]).some(p=>p.t===x.t)).map(x=>({...x,g:'대형'}))];
  const head=['무리','종목',R('장후'),R('시장 대비'),R('살 금액'),R('다음 날 시가'),R('수익(매도 1호가)'),R('수익(비례 금액)')];
  const tr=x=>`<tr><td><span class="gp ${x.g==='대형'?'big':''}">${x.g}</span></td><td>${esc(x.n)} <span class="dim mono">${esc(x.t)}</span></td><td class="ar">${pct(x.ah)}</td><td class="ar">${pct(x.rel,2,'%p')}</td><td class="ar mono">${amt(x.amt)}</td><td class="ar mono">${won(x.o1)}</td><td class="ar">${pct(x.r)}</td><td class="ar">${pct(x.rc)}</td></tr>`;
  const pick=rows.length?tbl(head,rows.slice(0,6).map(tr))+(rows.length>6?more('nxt-rest',`나머지 ${rows.length-6}종목`,tbl(head,rows.slice(6).map(tr))):'')
    :`<div class="empty">${S.date?(S.calm===false?`${md(S.date)} 시장 장후 ${(+S.mkt).toFixed(2)}% — 시장 전체가 빠진 날이라 쉼`:`${md(S.date)} 조건에 맞는 종목 없음`):'아직 첫 기록 전 — 평일 19:50 에 고른다'}</div>`;
  const C=N.cum||{};const P=C.picks||[],B=C.big||[];const keys=[...new Set([...P,...B].map(c=>c.k))];
  const cc=c=>c?`<td class="ar mono">${c.n}</td><td class="ar">${pct(c.avg)}${c.tot!=null?` <span class="dim mono">${c.tot>0?'+':''}${c.tot.toLocaleString()}만</span>`:''}</td><td class="ar mono">${c.win}%</td>`:'<td class="ar dim">-</td><td class="ar dim">-</td><td class="ar dim">-</td>';
  const cum=keys.length?tbl(['매수 방식',R('상위 절반 건수'),R('건당(비용 뒤)'),R('승률'),R('대형 200 건수'),R('건당(비용 뒤)'),R('승률')],keys.map(k=>`<tr><td>${esc(k)}</td>${cc(P.find(c=>c.k===k))}${cc(B.find(c=>c.k===k))}</tr>`)):'';
  const T=N.test;const test=T&&T.date?`<p class="hint" style="margin:10px 0 0">1주 실주문 시험 <span class="mono">${esc(T.date)} ${esc(T.t)}</span> · ${T.error?`<span class="neg">거절 — ${esc(T.error).slice(0,160)}</span>`:`${esc(T.status||'-')} · 지정가 ${won(T.limit)}원 · 체결 ${T.filled||0}주 @ ${won(T.avg)}원${T.sell_avg?` → 다음 날 시가 ${won(T.sell_avg)}원 (${pct((T.sell_avg/T.avg-1)*100)}, 비용 전)`:T.sold?' → 시가 매도 주문함':''}`}</p>`:'';
  const f=a=>a[0]?`${pct(a[0].avg)} <span class="dim">${a[0].n}건</span>`:'-';
  return sec('nxt','장후 낙폭 그림자',`누적 ${N.days||0}일 · 상위 절반 ${f(P)} · 대형 ${f(B)}`,`${esc(N.stage||'')} · ${esc((N.updated||'').slice(5))}`,
    hint('NXT 장후에 빠진 종목을 19:51~20:00 에 샀다 치고 다음 날 시가에 판다. 돈은 안 든다(기록만).')
    +(cum?`<div class="sub">누적 성적</div>${cum}`:'')
    +`<div class="sub">${S.date?md(S.date)+' 고른 '+rows.length+'종목':'고른 종목'}${S.n_nxt?` <span class="dim" style="font-weight:400">· 시장 장후 ${pct(S.mkt)} · 후보 ${S.n_cand}</span>`:''}</div>${pick}`
    +more('nxt-rule','고르는 조건',`<p class="hint" style="margin:0">${esc(N.rule||'')}<br>대형 비교 무리: ${esc(N.big_rule||'')}</p>`)+test,
    bdg('y','테스트 중')+` <span class="dim mono" style="font-size:12px">${esc(N.hid||'')}</span>`)}

/* ── 실시간 재료 그림자(과거 없음 · 앞으로 성적만) ── */
function secShadow(S){
  S=S||[];if(!S.length)return '';const ready=S.filter(s=>(s.fwd||{}).ready).length;
  const rows=S.map(s=>{const f=s.fwd||{};return `<tr><td class="mono">${esc(s.id)}</td>${clip(s.desc)}<td class="mono">${f.days??0}/20일</td><td class="mono">${f.n??0}건 ${pct(f.mean)}</td><td class="mono">${f.win!=null?Math.round(f.win)+'%':'-'}</td><td>${pct(f.ex,2,'%p')}</td><td>${man(f.pnl50)}</td><td>${man(f.pnl)}</td><td class="mono">${f.twin?esc(f.twin)+' '+pct(f.twin_ex,2,'%p'):'-'}</td></tr>`});
  return sec('shadow','실시간 재료 그림자',`${S.length}개 · 판정 가능 ${ready}`,'매일 저녁',
    hint('과거 자료가 없는 재료라, 사지 않고 앞으로 오는 날 성적만 적는다. 20거래일 전엔 판정 안 한다.')
    +tbl(['id','규칙','날 수','건당','승률','시장 대비','50만 하루','100만 하루','뒤집은 짝'],rows),ready?bdg('g','판정 가능 '+ready):'')}

/* ── 자료 모으는 중 — 서버 research/collecting.py 가 '__collect__' 에 30분마다 ── */
function secCol(J){
  if(!J||!(J.items||[]).length)return '';
  const I=J.items.filter(x=>!x.err);
  const nx=I.flatMap(x=>(x.goals||[]).filter(g=>!g.done).map(g=>[g.eta,x,g])).sort((a,b)=>a[0]<b[0]?-1:1)[0];
  const its=I.map(x=>{const G=x.goals||[];const top=G.length?G[G.length-1].goal:1;const w=v=>Math.min(100,Math.max(0,v/top*100)).toFixed(1);
    const pr=x.unit==='쌍',u=pr?'쌍':'일';const bf=x.backfill;
    return `<div class="it"><div class="ih"><b>${esc(x.name)}</b><span class="dim mono">${esc(x.id)}</span><span class="muted">${esc(x.parent||'')}</span><span class="n mono">${(x.have||0).toLocaleString()} / ${top.toLocaleString()}${u}</span></div>
      <div class="cbar"><i class="ex" style="width:${w(x.expect||0)}%"></i><i style="width:${w(x.have||0)}%"></i>${G.slice(0,-1).map(g=>`<s style="left:${w(g.goal)}%"></s>`).join('')}</div>
      <div class="gl">${G.map(g=>`<span>${esc(String(g.lab).split('(')[0].trim())} ${g.done?'<b style="color:var(--ok)">도달</b>':`약 <b>${day(g.eta)}</b>`}</span>`).join('')}</div>`
      +more('col-'+x.id,'무엇을 · 어떻게',`<p class="hint" style="margin:0">${esc(x.what||'')}<br>${esc(x.how||'')}${x.first?`<br>${day(x.first)} ~ ${day(x.last)}`:''}${bf&&bf.left?`<br>남은 ${(bf.left||0).toLocaleString()}쌍 · 약 ${bf.eta_h??'-'}시간(밤 20:10~07:30 에만 받음)`:''}${bf&&bf.catching?` → 받기 끝나면 ${x.expect}일`:''}</p>`)+`</div>`}).join('');
  return sec('col','자료 모으는 중',`${I.length}개`+(nx?` · 가장 빠른 건 ${esc(nx[1].name)} ${esc(String(nx[2].lab).split('(')[0].trim())} 약 ${day(nx[0])}`:''),esc((J.updated||'').slice(5)),
    hint('자료가 쌓여야(받아야) 시험할 수 있는 가설. 예상 날짜는 거래일로 센 대략.')+its)}

/* ── 등록부의 그림자·후보 가설 — CI 의 shadow.py 가 매일 data/shadow.json ── */
function secShd(J){
  if(!J)return '';const H=J.hyps||[],RL=J.rules||[];if(!H.length&&!RL.length)return '';
  const won=v=>v==null?'-':Math.round(v).toLocaleString();
  const rules=RL.map(X=>{const it=X.items||[];
    return `<div class="sub">${esc(X.id)} · ${esc(X.name)} <span class="dim" style="font-weight:400">· ${X.hold}거래일 보유 · 신호 ${X.n}(진행 ${X.open} · 만기 ${X.done})${X.avg_done!=null?` · 만기 평균 ${pct(X.avg_done)} 승률 ${X.win_done}%`:''}</span></div>`
      +(it.length?more('shd-'+X.id,`신호 ${X.n}건`,tbl(['신호일','종목',R('산 값'),R('지금/만기 값'),R('수익(비용 뒤)'),R('보유')],it.map(x=>`<tr><td class="mono">${md(x.d)}</td><td>${esc(x.n)} <span class="dim mono">${esc(x.t)}</span></td><td class="ar mono">${won(x.in)}</td><td class="ar mono">${won(x.px)}</td><td class="ar">${pct(x.ret)}</td><td class="ar mono">${x.done?'만기 '+md(x.xd):(x.held==null?'-':x.held+'/'+x.hold+'일')}</td></tr>`))):'<div class="dim">아직 신호 없음</div>')}).join('');
  const hy=H.length?tbl(['번호','상태','가설','등록'],H.map(h=>`<tr><td class="mono">${esc(h.id)}</td><td>${bdg(h.st==='후보'?'b':'y',esc(h.st))}</td>${clip(h.name)}<td class="mono">${esc(h.date)}</td></tr>`)):'';
  return sec('shd','등록부 그림자·후보 가설',`${H.length}개`+(RL.length?` · 그림자 규칙 ${RL.length}`:'')+(H.length?' · '+H.slice(0,4).map(h=>esc(h.id)).join(' · '):''),'기준 '+md(J.asof),
    hint('가설 등록부에서 상태가 그림자·후보인 것.')+rules+hy)}

/* ── 글 수집 — 밤마다 모아 규칙 명세로 ── */
function secCollect(F){
  if(!F)return '';const CL=F.collect||{};const ST=CL.stats||[];
  const dates=[...new Set(ST.map(r=>r.date))].sort().reverse().slice(0,7);const srcs=[...new Set(ST.map(r=>r.src))].sort();
  const cell=r=>r?`<span title="찾음 ${r.found} · 시도 ${r.tried} · 읽음 ${r.ok} · 오류 ${r.err} · 쉼 ${r.blocked} · 짧음 ${r.short} · 통과 ${r.passed} · 번역 ${r.xl} · 명세 ${r.specs}">${r.ok}<span class="dim">/${r.found}</span>${(r.err||r.blocked)?` <span class="neg">${r.err+r.blocked}×</span>`:''}${r.specs?` <b style="color:var(--acc)">${r.specs}</b>`:''}</span>`:'<span class="dim">-</span>';
  const d0=dates[0];const t0=ST.filter(r=>r.date===d0);const sm=k=>t0.reduce((a,r)=>a+(r[k]||0),0);
  const P=(CL.pace||{}).hosts||{},E=(CL.pace||{}).events||[];const slow=Object.values(P).filter(p=>p.paused||p.gap>p.base*1.5).length;
  const stat=ST.length?tbl(['출처',...dates.map(d=>md(d))],srcs.map(s=>`<tr><td>${esc(s)}</td>${dates.map(d=>`<td class="mono">${cell(ST.find(r=>r.date===d&&r.src===s))}</td>`).join('')}</tr>`)):'<div class="empty">오늘 밤 수집부터 쌓인다</div>';
  return sec('collect','글 수집',d0?`${md(d0)} 찾음 ${sm('found')} → 읽음 ${sm('ok')} → 명세 ${sm('specs')}`+(slow?` · 느려진 사이트 ${slow}`:''):'아직 없음','매일 밤',
    hint('밤마다 매매 글을 모아 규칙 명세로 옮긴다. 칸 = 읽음/찾음 · <span class="neg">n×</span> = 오류·쉼 · <b style="color:var(--acc)">주황</b> = 명세로 간 수.')+stat
    +more('collect-how',`수집처 ${(CL.methods||[]).length}곳 · 하룻밤 몫`,tbl(['수집처','어떻게','방법'],(CL.methods||[]).map(m=>`<tr><td>${esc(m.name)}</td><td class="l">${esc(m.how)}</td><td class="l muted">${esc(m.via)}</td></tr>`))
      +hint('하룻밤 읽기 몫: 유튜브 30개 · 다른 곳 40개씩 · 번역 25개. 몫에 못 든 글은 다음 밤으로.'))
    +more('collect-pace',`속도 조절${slow?` · 느려진 사이트 ${slow}`:''}`,hint('막힌 낌새가 보이면 그 사이트 간격을 2배로(3번이면 12시간 쉼), 5번 성공마다 20%씩 되돌린다.')
      +tbl(['사이트','지금 간격','기본','상태','누적 걸림'],Object.entries(P).map(([h,p])=>`<tr><td>${esc(h)}</td><td class="mono">${p.gap}초</td><td class="mono dim">${p.base}초</td><td>${p.paused?'<span class="neg">쉬는 중</span>':(p.gap>p.base*1.5?'<span class="neg">느리게</span>':'보통')}</td><td class="mono">${p.hits||0}</td></tr>`))
      +(E.length?`<div class="sub">최근 사건</div>`+tbl(['때','사이트','조치','이유'],E.slice().reverse().map(e=>`<tr><td class="mono">${esc(e.ts)}</td><td>${esc(e.host)}</td><td>${esc(e.event)} → ${e.gap}초</td>${clip(e.why)}</tr>`)):''))
    +(F.usage?`<p class="hint" style="margin:10px 0 0">클로드 크레딧 · ${esc(F.usage)}</p>`:''))}

const S={F:null,N:null,C:null,J:null,init:0};
function render(){
  const F=S.F;
  if(F&&!S.init){S.init=1;if((F.cands||[]).length)OPEN.add('cands')}
  $('#upd').textContent=F?'갱신 '+(F.updated||'-').slice(5):S.tried?'아직 데이터 없음':'불러오는 중…';
  if(F){const c=F.counts||{};
    $('#chips').innerHTML=[['검토 대기',c.review||0],['채택',c.adopted||0],['그림자',c.shadow||0],['형제로 묶음',c.sibling||0],['지금까지 판정',Object.values(c).reduce((a,b)=>a+b,0).toLocaleString()],['공장 누적 시험',(F.trials||0).toLocaleString()]]
      .map(([l,v])=>`<span>${l} <b>${v}</b></span>`).join('')}
  $('#root').innerHTML=secCands(F)+secNxt(S.N)+secShadow(F&&F.shadow)+secCol(S.C)+secShd(S.J)+secCollect(F);
}
const get=async p=>{try{return await rpc('kospi_state_get',{p_pin:p})}catch(e){return null}};
async function load(){S.F=await get('__factory__');S.tried=1;render()}
async function loadNxt(){S.N=await get('__nxt__');render()}
async function loadCol(){S.C=await get('__collect__');render()}
async function loadShd(){try{const r=await fetch('data/shadow.json?'+Date.now(),{cache:'no-store'});if(r.ok)S.J=await r.json()}catch(e){}render()}
load();loadNxt();loadCol();loadShd();
/* 다시 읽기 — NXT 는 단계마다, 자료 모으는 중은 30분마다 올라온다. 탭이 안 보이면 안 읽고, 다시 보이면 바로 한 번. */
setInterval(()=>{if(!document.hidden){loadNxt();loadCol()}},300000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadNxt();loadCol()}});
</script></body></html>

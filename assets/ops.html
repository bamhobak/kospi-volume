<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>점검 현황</title>
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="sb.js"></script>
<!-- 점검 현황(2026-11-12 사용자 "자동으로 돌아가고 체크하는 것들 … 세세하게 그러나 보기 쉽게"). 서버 research/ops_status.py 가 30분마다 Supabase '__ops__' 에 쓴다.
     2026-11-16 사용자 "너무 길게 나열 … 사람이 보기 편하게 정리": 맨 위 '지금 볼 것'만 펼쳐 두고, 나머지는 칸마다 한 줄 요약으로 접음(누르면 펼침). 긴 설명 글은 한 문장으로. -->
<style>
:root{--bg:#0B0D12;--panel:#12151C;--panel2:#181C25;--line:#242A35;--txt:#E8ECF2;--mut:#A0A8B6;--dim:#7A8394;--acc:#F5A524;--up:#FF6166;--dn:#5B9BFF;--ind:#F5C26B;--ok:#34D3C0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans KR',Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:13.5px;line-height:1.55}
.mono{font-family:'IBM Plex Mono','IBM Plex Sans KR',ui-monospace,monospace;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
header h1{font-size:20px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
header a{color:var(--txt);text-decoration:none;border:1px solid var(--line);padding:8px 14px;background:var(--panel);border-radius:8px;font-size:12.5px}
header a:hover{border-color:var(--acc);color:var(--ind)}
header .up{margin-left:auto;color:var(--mut);font-size:12px}
main{max-width:920px;margin:0 auto;padding:16px 16px 70px}
.now{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.now.warn{border-color:rgba(245,194,107,.55)}
.now h2{margin:0;font-size:16px;font-weight:700}
.now ul{list-style:none;margin:10px 0 0;padding:0}
.now li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.now li a{color:var(--txt);text-decoration:none;min-width:0;word-break:keep-all}
.now li a:hover{color:var(--ind)}
.chips{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--mut);font-size:12.5px;margin-top:10px}
.chips b{color:var(--txt);font-family:'IBM Plex Mono',monospace;font-weight:600}
h3.grp{margin:22px 2px 8px;font-size:12.5px;color:var(--mut);font-weight:600}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;scroll-margin-top:70px}
details.sec>summary{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;list-style:none}
details.sec>summary::-webkit-details-marker,details.more>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:'▸';color:var(--dim);width:10px;flex:none}
details.sec[open]>summary::before{content:'▾'}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
details.sec>summary:hover .t{color:var(--ind)}
.t{font-weight:700;font-size:14.5px;white-space:nowrap}
.s{flex:1;min-width:0;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w{color:var(--dim);font-size:12px;white-space:nowrap}
.body{padding:12px 16px 14px}
.hint{margin:0 0 10px;color:var(--mut);font-size:12.5px;word-break:keep-all}
.sub{margin:12px 0 6px;color:var(--mut);font-size:12.5px;font-weight:600}.sub:first-child{margin-top:0}
details.more{margin-top:6px}
details.more>summary{cursor:pointer;color:var(--mut);font-weight:600;font-size:12.5px;padding:6px 0;list-style:none}
details.more>summary::before{content:'▸ ';color:var(--dim)}details.more[open]>summary::before{content:'▾ '}
details.more>summary:hover{color:var(--ind)}
.badge{font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-weight:600;white-space:nowrap}
.g{color:var(--ok);border-color:var(--ok)}.y{color:var(--ind);border-color:var(--ind)}.r{color:var(--up);border-color:var(--up)}.m{color:var(--dim)}
.pos{color:var(--up)}.neg{color:var(--dn)}.muted{color:var(--mut)}.dim{color:var(--dim)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{color:var(--mut);font-weight:600;background:var(--panel2)}
tr:last-child td{border-bottom:none}
td.clip{max-width:340px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
td.clip.on{white-space:normal;min-width:240px;word-break:keep-all}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line);min-width:90px}
.bar i{display:block;height:100%;background:var(--acc)}
.pre{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px}
.list{margin:0;padding-left:18px}.list li{margin:2px 0}
.empty{color:var(--mut);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:8px}
@media (max-width:640px){header{padding:10px 12px}main{padding:12px 12px 70px}
  details.sec>summary{flex-wrap:wrap;gap:4px 10px}.s{flex-basis:100%;order:3;margin-left:20px}.w{margin-left:auto}td.clip{max-width:200px}}
</style></head><body>
<header><a href="./">← 선별기</a><h1><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F5A524" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>점검 현황</h1><span class="up" id="upd">불러오는 중…</span></header>
<main>
  <section class="now" id="now"><h2>불러오는 중…</h2></section>
  <div id="root"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(v,d=2,u='%')=>v==null||v!==v?'<span class="dim">-</span>':`<span class="mono ${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${(+v).toFixed(d)}${u}</span>`;
const man=v=>v==null?'-':`<span class="mono ${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${(v/1e4).toFixed(1)}만</span>`;
const num=(v,d=2)=>v==null?'-':(+v).toFixed(d)+'%';
const dd=s=>s&&s.length>=8?`${s.slice(4,6)}/${s.slice(6,8)}`:esc(s||'');
const tm=s=>s?esc(s.slice(5)):'<span class="dim">-</span>';
async function rpc(fn,body){const r=await fetch(`${SB.url}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(fn+' '+r.status);const t=await r.text();return t?JSON.parse(t):null}
const ST={'정상':'g','실행 중':'y','첫 실행 전':'m','꺼짐':'m','오류':'r'};
const PR={open:['진행 중','y'],extended:['연장','y'],pass:['합격','g'],fail:['기각','r'],closed:['닫힘','m'],delegated:['밤 연구 일꾼이 판정','m']};
/* 펼쳐 둔 칸 — 5분마다 다시 그려도 그대로. 새로 들어오면 전부 접힌 채로 시작한다. */
const OPEN=new Set();
document.addEventListener('toggle',e=>{const d=e.target;if(!d.id)return;d.open?OPEN.add(d.id):OPEN.delete(d.id)},true);
document.addEventListener('click',e=>{const c=e.target.closest('td.clip');if(c)c.classList.toggle('on');
  const a=e.target.closest('a[data-open]');if(a){e.preventDefault();const d=document.getElementById(a.dataset.open);if(d){d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'})}}});
function sec(id,t,s,w,html,b){return `<details class="sec" id="${id}"${OPEN.has(id)?' open':''}><summary><span class="t">${t}</span>${b||''}<span class="s">${s||''}</span>${w?`<span class="w">${w}</span>`:''}</summary><div class="body">${html}</div></details>`}
function more(id,label,html){return `<details class="more" id="${id}"${OPEN.has(id)?' open':''}><summary>${label}</summary>${html}</details>`}
function tbl(head,rows){return `<div class="tw"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
const hint=s=>`<p class="hint">${s}</p>`;
const bdg=(c,s)=>`<span class="badge ${c}">${s}</span>`;
const clip=s=>`<td class="clip" title="누르면 전체">${esc(s)}</td>`;
const li=(a,f)=>a&&a.length?`<ul class="list">${a.map(f||(x=>`<li>${esc(x)}</li>`)).join('')}</ul>`:'<div class="dim">없음</div>';

function secDoctor(J){
  if(!J||!J.at)return sec('doctor','점검 의사','아직 안 돎','매일 10:20 · 17:40',hint('클로드가 이 페이지를 훑어 고장을 찾고, 고칠 수 있는 건 고친다.'));
  const body=hint('클로드가 매일 이 페이지를 훑어 고장·조용한 고장을 찾는다. '+(J.mode==='fix'?'연구·점검·수집 코드는 직접 고치고, 매매 코드·원장은 안 건드린다.':'보고만 한다.'))
    +`<div class="pre">${esc(J.summary||'')}</div>`
    +((J.found||[]).length?`<div class="sub">찾은 문제</div>${li(J.found,x=>`<li><b>${esc(x.what)}</b> — ${esc(x.why||'')} <span class="dim">${esc(x.where||'')}</span></li>`)}`:'')
    +((J.fixed||[]).length?`<div class="sub">고친 것</div>${li(J.fixed,x=>`<li><b>${esc(x.what)}</b> — ${esc(x.how||'')} <span class="dim">${esc(x.check||'')} ${esc(x.commit||'')}</span></li>`)}`:'')
    +((J.user||[]).length?`<div class="sub">정해 줘야 할 것</div>${li(J.user,x=>`<li><b>${esc(x.what)}</b> — ${esc(x.why||'')}${x.suggest?`<div class="dim">→ ${esc(x.suggest)}</div>`:''}</li>`)}`:'')
    +((J.reverted||[]).length?`<div class="pos" style="margin-top:8px">손대면 안 되는 파일을 바꿔서 되돌림: ${esc(J.reverted.join(', '))}</div>`:'')
    +(J.selftest===false?'<div class="pos" style="margin-top:8px">selftest 실패</div>':'')
    +((J.checked||[]).length?more('doctor-ok',`확인한 것 ${J.checked.length}개`,li(J.checked)):'');
  return sec('doctor','점검 의사',esc((J.summary||'').split(' — ')[0]),tm(J.at),body,J.ok?bdg('g','정상'):bdg('r','문제'))}

function secHealth(H){
  if(!H)return '';
  const np=(H.problems||[]).length,nf=(H.fixed||[]).length;
  const hist=(H.hist||[]).map(r=>`<tr><td class="mono">${dd(r.d)}</td><td class="mono"><span class="${r.n?'pos':''}">${r.n}</span>${r.crit?` ${bdg('r','🚨'+r.crit)}`:''}</td><td class="mono">${r.fix||0}</td>${clip(r.first)}</tr>`);
  return sec('health','점검기',`문제 ${np} · 스스로 고침 ${nf} · 정상 확인 ${(H.ok||[]).length}`,dd(H.date)+' 09:20',
    hint('지난 24시간이 맞게 돌았는지 본다. 아는 문제는 스스로 고치고 남은 것만 텔레그램.')
    +`<div class="sub">문제</div>${li(H.problems)}`+(nf?`<div class="sub">스스로 고친 것</div>${li(H.fixed)}`:'')
    +more('health-ok',`정상 확인 ${(H.ok||[]).length}개`,li(H.ok))+more('health-hist','최근 14일',tbl(['날','문제','고침','첫 문제'],hist)),
    np?bdg('y','문제 '+np):bdg('g','정상'))}

function secTasks(T){
  if(!T||!T.length)return sec('tasks','예약 작업','자료 없음','','<div class="empty">자료 없음</div>');
  const c=k=>T.filter(t=>t.state===k).length;
  const row=t=>`<tr><td class="mono">${esc(t.name)}</td><td>${bdg(ST[t.state]||'m',esc(t.state))}${t.state==='오류'?` <span class="dim mono">${t.res}</span>`:''}</td><td class="mono">${tm(t.last)}</td><td class="mono">${tm(t.next)}</td>${clip(t.what||t.path)}</tr>`;
  const head=['이름','상태','마지막','다음','하는 일'];
  const bad=T.filter(t=>t.state==='오류'||t.state==='꺼짐');
  const G=[];for(const t of T){let g=G.find(x=>x[0]===t.group);if(!g)G.push(g=[t.group,[]]);g[1].push(t)}
  const sum=`${T.length}개 · 정상 ${c('정상')}`+['실행 중','오류','꺼짐','첫 실행 전'].filter(k=>c(k)).map(k=>` · ${k} ${c(k)}`).join('');
  return sec('tasks','예약 작업',sum,'',
    hint('서버에서 시간 맞춰 저절로 도는 작업. 하는 일 칸을 누르면 전체가 보인다.')
    +(bad.length?`<div class="sub">정상 아님 ${bad.length}개</div>${tbl(head,bad.map(row))}`:'')
    +G.map(([g,a],i)=>{const e=a.filter(t=>t.state==='오류').length;return more('tasks-'+i,`${esc(g)} <span class="dim">${a.length}개${e?` · <span class="pos">오류 ${e}</span>`:''}</span>`,tbl(head,a.map(row)))}).join(''),
    c('오류')?bdg('r','오류 '+c('오류')):'')}

function secPrereg(P){
  P=P||[];const live=P.filter(x=>x.status==='open'||x.status==='extended'),rest=P.filter(x=>!live.includes(x));
  const row=x=>{const b=PR[x.status]||[x.status,'m'];const h=(x.history||[]).map(y=>`${y.at} ${y.verdict} — ${y.text}`).join(' / ');
    return `<tr><td class="mono">${esc(x.id)}</td>${clip(x.name)}<td>${bdg(b[1],b[0])}</td>${clip((x.now||'')+(h?' · '+h:''))}<td class="mono">${dd(x.start)}~ · ${x.need||'-'}일${x.extend?`(→${x.extend})`:''}</td></tr>`};
  const head=['id','무엇','상태','지금','시작 · 날 수'];
  return sec('prereg','사전 등록 판정',`진행 중 ${live.length}개`+(rest.length?` · 끝났거나 맡긴 것 ${rest.length}`:''),'매일 21:10',
    hint('결과를 보기 전에 정해 둔 합격선으로, 날 수가 차면 기계가 판정하고 텔레그램 한 줄.')
    +(live.length?tbl(head,live.map(row)):'<div class="empty">진행 중인 것 없음</div>')
    +(rest.length?more('prereg-rest',`끝났거나 맡긴 것 ${rest.length}개`,tbl(head,rest.map(row))):''))}

const auditFlags=A=>((A&&A.last5)||[]).flatMap(r=>[r.gap!=null&&r.gap<=-0.3?`[${r.rule}] 최근 5일 실전이 연구보다 ${(+r.gap).toFixed(2)}%p 나쁨`:null,r.out!=null&&r.out>20?`[${r.rule}] 최근 5일 연구 조건 밖 체결 ${r.out}% (${r.out_n})`:null]).filter(Boolean);
function secAudit(A){
  if(!A||!A.all)return sec('audit','실전-연구 대조','자료 없음','매일 16:50','<div class="empty">자료 없음</div>');
  const short=X=>tbl(['규칙','왕복','실전 건당','연구 건당','차이','연구 조건 밖'],X.map(r=>`<tr><td>[${esc(r.rule)}]</td><td class="mono">${r.n}</td><td>${pct(r.live)}</td><td>${pct(r.research)}</td><td>${pct(r.gap,2,'%p')}</td><td class="mono">${r.out==null?'<span class="dim">-</span>':`<span class="${r.out>20?'pos':''}">${r.out}%</span> <span class="dim">${esc(r.out_n)}</span>`}</td></tr>`));
  const full=X=>tbl(['규칙','왕복','실전 건당','연구 건당','차이','살 때 유리(+)','팔 때 유리(+)','연구 조건 밖'],X.map(r=>`<tr><td>[${esc(r.rule)}]</td><td class="mono">${r.n}</td><td>${pct(r.live)}</td><td>${pct(r.research)}</td><td>${pct(r.gap,2,'%p')}</td><td>${pct(r.slip_buy)}</td><td>${pct(r.slip_sell)}</td><td class="mono">${r.out==null?'<span class="dim">-</span>':`${r.out}% <span class="dim">${esc(r.out_n)}</span>`}</td></tr>`));
  const d=(A.daily||[]).map(r=>`<tr><td class="mono">${dd(r.d)}</td><td class="mono">${r.n}</td><td>${pct(r.live)}</td><td>${pct(r.research)}</td></tr>`);
  const fl=auditFlags(A);
  return sec('audit','실전-연구 대조','최근 5일 차이 '+(A.last5||[]).map(r=>`[${esc(r.rule)}] ${pct(r.gap,2,'%p')}`).join(' · '),'매일 16:50',
    hint('차이 = 실제로 사고판 값 − 연구가 가정한 값. -0.3%p 아래거나 [갭하락] 조건 밖이 20%를 넘으면 텔레그램.')
    +`<div class="sub">최근 5거래일</div>${short(A.last5||[])}`
    +more('audit-all',`전체 기간 ${dd(A.first)}~${dd(A.lastday)} · 살 때·팔 때 나눠 보기`,full(A.all))
    +more('audit-daily','날짜별(최근 10일)',tbl(['매도일','왕복','실전','연구'],d)),
    fl.length?bdg('y','경보 '+fl.length):'')}

function secShadow(S){
  S=S||[];const ready=S.filter(s=>(s.fwd||{}).ready).length;
  const rows=S.map(s=>{const f=s.fwd||{};return `<tr><td class="mono">${esc(s.id)}</td>${clip(s.desc)}<td class="mono">${f.days??0}/20일</td><td class="mono">${f.n??0}건 ${pct(f.mean)}</td><td>${pct(f.ex,2,'%p')}</td><td>${man(f.pnl50)}</td><td>${man(f.pnl)}</td><td class="mono">${f.twin?esc(f.twin)+' '+pct(f.twin_ex,2,'%p'):'-'}</td></tr>`});
  return sec('shadow','공장 그림자',`${S.length}개 · 판정 가능 ${ready}`,'매일 저녁',
    hint('사지 않고 앞으로 오는 날 성적만 적는 규칙. 20거래일·15건이 차야 판정한다.')
    +(rows.length?tbl(['id','규칙','날 수','건당','시장 대비','50만 하루','100만 하루','뒤집은 짝'],rows):'<div class="empty">그림자 없음</div>'),
    ready?bdg('g','판정 가능 '+ready):'')}

function secRed(R){
  R=R||[];const LV={'초록':'g','노랑':'y','빨강':'r'};const col=v=>/막|기각|빨/.test(v)?'r':/주의|노|보류/.test(v)?'y':'g';
  const n=k=>R.filter(x=>col(x.verdict||'')===k).length;
  const items=R.map((x,i)=>{const ch=(x.checks||[]).map(k=>`<tr><td>${esc(k.name)}</td><td>${bdg(LV[k.level]||'m',esc(k.level))}</td>${clip(k.note)}</tr>`);
    return more('red-'+i,`${bdg(col(x.verdict||''),esc(x.verdict))} ${esc(x.name)} <span class="dim">${tm(x.at)}</span>`,(ch.length?tbl(['함정','판정','내용'],ch):'')+`<div class="pre" style="margin-top:8px">${esc(x.text)}</div>`)});
  return sec('redteam','검토관',R.length?`최근 ${R.length}건 · 막음 ${n('r')} · 주의 ${n('y')} · 통과 ${n('g')}`:'아직 검토 없음','후보가 생길 때',
    hint('채택 제안·그림자 통과·밤 연구 결과를 함정 목록(미래 정보·다중검정·체결 손해 등)으로 깨 본다.')+(items.join('')||'<div class="empty">아직 검토 없음</div>'))}

function secLab(N){
  const q=(N&&N.queue)||[],reps=(N&&N.reports)||[];
  const rows=q.map(x=>`<tr><td class="mono">${esc(x.id)}</td>${clip(x.title+' — '+(x.hypothesis||''))}<td>${bdg(/done|끝|합격/.test(x.status)?'g':/fail|기각|막/.test(x.status)?'r':'y',esc({queued:'대기',running:'도는 중',done:'끝',failed:'실패'}[x.status]||x.status||'대기'))}</td>${clip(typeof x.result==='string'?x.result:JSON.stringify(x.result||''))}</tr>`);
  return sec('nightlab','밤 연구 일꾼',`대기 목록 ${q.length}개 · 보고서 ${reps.length}`,'밤 22:30~06:30',
    hint('시킨 실측만 밤에 사전 등록 → 실행 → 검토관 순으로 돌려 표로 남긴다. 실전 코드는 안 건드린다.')
    +(rows.length?tbl(['id','무엇','상태','결과'],rows):'<div class="empty">대기 목록 비어 있음</div>')
    +(reps.length?more('lab-reps',`보고서 ${reps.length}개`,li(reps,r=>`<li><span class="mono">${esc(r.name)}</span> <span class="dim">${esc(r.at)}</span></li>`)):''))}

function secRec(R){
  R=R||[];const mx=R.map(x=>x.last||'').sort().pop()||'';const late=R.filter(x=>x.last<mx).length;
  const rows=R.map(x=>`<tr><td>${esc(x.kind)}</td><td class="mono">${x.days||0}일</td><td class="mono">${dd(x.first)}~${dd(x.last)}</td><td class="mono">${(x.tickers??'-').toLocaleString()}</td><td class="mono">${x.mb??'-'}MB</td></tr>`);
  return sec('rec','녹화',`${R.length}종 · `+(late?`${late}종 뒤처짐`:`전부 ${dd(mx)}까지`),'매일 장전·마감',
    hint('지금 안 쌓으면 나중에 못 구하는 호가·체결 자료.')+tbl(['무엇','쌓인 날','기간','종목','용량'],rows),late?bdg('y','뒤처짐 '+late):'')}

function secFill(F){
  F=F||[];const act=F.filter(x=>x.left>0),done=F.filter(x=>x.left===0).length;const eta=act.reduce((a,x)=>a+(x.eta_hours||0),0);
  const rows=F.map(x=>{const p=x.total?Math.max(0,1-(x.left||0)/x.total):null;
    return `<tr>${clip(x.name)}<td style="min-width:150px">${p!=null?`<div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:${(p*100).toFixed(1)}%"></i></div><span class="mono">${(p*100).toFixed(0)}%</span></div>`:'<span class="dim">-</span>'}</td><td class="mono">${x.left===0?'끝':x.eta_hours!=null?x.eta_hours.toFixed(1)+'시간':'-'}</td><td class="mono">${x.updated?esc(x.updated.slice(5,16).replace('T',' ')):'-'}</td></tr>`});
  return sec('fill','밤 과거 받기',F.length?`받는 중 ${act.length} · 끝남 ${done}`+(act.length?` · 남은 약 ${eta.toFixed(0)}시간`:''):'상태 없음','매일 20:10~07:30',
    hint('밤마다 토스에서 지난 1분봉을 조금씩 이어 받는다. 실전 작업이 돌면 양보한다.')+(rows.length?tbl(['일감','진행','남은 예상','갱신'],rows):'<div class="empty">상태 없음</div>'))}

function secImpact(I){
  if(!I)return '';
  const u=I.use||{},c=I.cont||{};const m=(I.rows||[]).find(r=>r.amt==='100만');
  const rows=(I.rows||[]).map(r=>`<tr><td class="mono">${esc(r.amt)}</td><td class="mono">${num(r.real)}</td><td class="mono">${num(r.auction)}</td><td class="mono">${num(r.cont)}</td><td class="mono">${r.short!=null?(+r.short).toFixed(0)+'%':'-'}</td></tr>`);
  return sec('impact','체결 손해 모형',`${dd(I.date)} 맞춤`+(m?` · 100만 한 건 ${(+m.real).toFixed(2)}%`:''),'매일 17:10',
    hint('큰 금액일수록 값이 밀리는 정도(사고파는 손해 합). 녹화한 호가로 매일 다시 맞춘다.')
    +tbl(['한 건 금액','실현(실주문)','단일가 호가','접속매매 호가','호가 깊이 모자람'],rows)
    +`<p class="hint" style="margin:8px 0 0">단일가 규칙 <span class="mono">${u.a??'-'} + ${u.b??'-'}×√p</span> · 장중 매수 <span class="mono">${c.a??'-'} + ${c.b??'-'}×√p</span> · p = 금액 ÷ 20일 평균 거래대금(%)</p>`)}

function secBrief(B){
  if(!B||!B.text)return sec('brief','아침 브리핑','아직 안 보냄','평일 08:35','<div class="empty">아직 안 보냄</div>');
  return sec('brief','아침 브리핑',esc(B.text.split('\n').slice(1,3).join(' · ')),tm(B.at),hint('장 시작 전 텔레그램 한 통.')+`<div class="pre">${esc(B.text)}</div>`)}

function now(D){
  const T=D.tasks||[],H=D.health||{},J=D.doctor||{};const it=[];
  for(const t of T)if(t.state==='오류')it.push(['r','오류','tasks',`예약 작업 ${t.name} — ${t.last?t.last.slice(5)+' 실행 실패':'실행 실패'} · ${t.what||''}`]);
  for(const p of H.problems||[])it.push(['y','점검','health',String(p).replace(/^[⚠🚨\s]+/,'')]);
  for(const x of J.found||[])it.push(['r','고장','doctor',`${x.what} — ${x.why||''}`]);
  for(const x of J.user||[])it.push(['y','결정','doctor',`${x.what} — ${x.why||''}`]);
  if((J.reverted||[]).length)it.push(['r','되돌림','doctor','손대면 안 되는 파일을 바꿔서 되돌림: '+J.reverted.join(', ')]);
  for(const s of auditFlags(D.audit))it.push(['y','대조','audit',s]);
  for(const s of D.shadow||[])if((s.fwd||{}).ready)it.push(['g','판정','shadow',`공장 그림자 ${s.id} 판정 가능`]);
  if(D.err)it.push(['r','모으기','', '자료 모으기 실패: '+Object.keys(D.err).join(', ')]);
  const c=k=>T.filter(t=>t.state===k).length;const pr=(D.prereg||[]).filter(x=>x.status==='open'||x.status==='extended').length;
  const el=$('#now');el.className='now'+(it.length?' warn':'');
  el.innerHTML=`<h2>${it.length?`지금 볼 것 ${it.length}개`:'<span style="color:var(--ok)">전부 정상</span>'}</h2>`
    +(it.length?`<ul>${it.map(([k,l,to,s])=>`<li>${bdg(k,l)}<a href="#${to}"${to?` data-open="${to}"`:''}>${esc(s)}</a></li>`).join('')}</ul>`:'')
    +`<div class="chips"><span>예약 작업 <b>${T.length}</b></span><span>정상 <b>${c('정상')}</b></span>${c('실행 중')?`<span>실행 중 <b>${c('실행 중')}</b></span>`:''}<span>오류 <b>${c('오류')}</b></span><span>스스로 고침 <b>${(H.fixed||[]).length}</b></span><span>판정 기다림 <b>${pr}</b></span></div>`}

function render(D){
  now(D);
  $('#root').innerHTML='<h3 class="grp">점검</h3>'+secDoctor(D.doctor)+secHealth(D.health)+secTasks(D.tasks||[])
    +'<h3 class="grp">판정 · 성적</h3>'+secPrereg(D.prereg)+secAudit(D.audit)+secShadow(D.shadow)+secRed(D.redteam)+secLab(D.nightlab)
    +'<h3 class="grp">자료 · 알림</h3>'+secRec(D.rec)+secFill(D.nightfill)+secImpact(D.impact)+secBrief(D.brief);
  $('#upd').textContent='서버 갱신 '+(D.made||'-').slice(5)+' · 30분마다';
}
async function load(){let D=null;try{D=await rpc('kospi_state_get',{p_pin:'__ops__'})}catch(e){}
  if(D&&D.data)D=D.data;
  if(!D||!D.made){$('#now').innerHTML='<h2>아직 자료 없음</h2><div class="chips">서버가 30분마다 올린다</div>';$('#upd').textContent='-';return}
  render(D)}
load();setInterval(load,5*60*1000);
</script>
</body></html>

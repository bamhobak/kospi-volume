<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>점검 현황</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="sb.js"></script>
<!-- 점검 현황(2026-11-12 사용자 "자동으로 돌아가고 체크하는 것들 … 세세하게 그러나 보기 쉽게"). 서버 research/ops_status.py 가 30분마다 Supabase '__ops__' 에 쓴다. -->
<style>
:root{--bg:#0B0D12;--panel:#12151C;--panel2:#181C25;--line:#242A35;--txt:#E8ECF2;--mut:#A0A8B6;--dim:#7A8394;--acc:#F5A524;--up:#FF6166;--dn:#5B9BFF;--ind:#F5C26B;--ok:#34D3C0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans KR',Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:13.5px;line-height:1.55}
.mono{font-family:'IBM Plex Mono','IBM Plex Sans KR',ui-monospace,monospace;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
header h1{font-size:20px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
header a{color:var(--txt);text-decoration:none;border:1px solid var(--line);padding:8px 14px;background:var(--panel);border-radius:8px;font-size:12.5px}
header a:hover{border-color:var(--acc);color:var(--ind)}
header .up{margin-left:auto;color:var(--mut);font-size:12px}
main{max-width:1080px;margin:0 auto;padding:16px 16px 70px}
nav.toc{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
nav.toc a{color:var(--mut);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:4px 10px;border-radius:999px;font-size:12px}
nav.toc a:hover{color:var(--acc);border-color:var(--acc)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:16px}
.si{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.si b{display:block;font-size:20px;font-family:'IBM Plex Mono',monospace}.si small{color:var(--mut);font-size:11.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;scroll-margin-top:70px}
.ch{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ch h2{margin:0;font-size:15px;font-weight:700}
.ch .what{color:var(--mut);font-size:12.5px;flex-basis:100%}
.ch .when{margin-left:auto;color:var(--dim);font-size:12px}
.body{padding:12px 16px}
.badge{font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-weight:600;white-space:nowrap}
.g{color:var(--ok);border-color:var(--ok)}.y{color:var(--ind);border-color:var(--ind)}.r{color:var(--up);border-color:var(--up)}.m{color:var(--dim)}
.pos{color:var(--up)}.neg{color:var(--dn)}.muted{color:var(--mut)}.dim{color:var(--dim)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{color:var(--mut);font-weight:600;background:var(--panel2)}
td.l{white-space:normal;min-width:200px}
tr:last-child td{border-bottom:none}
tr.grp td{background:var(--panel2);color:var(--acc);font-weight:700;font-size:12px}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;padding:9px 16px;color:var(--mut);font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸ ';color:var(--dim)}details[open] summary::before{content:'▾ '}
.dbody{padding:0 16px 12px}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc)}
.pre{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px}
.list{margin:0;padding-left:18px}.list li{margin:2px 0}
.empty{color:var(--mut);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.kv div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}.kv small{display:block;color:var(--mut);font-size:11px}.kv b{font-size:15px}
@media (max-width:640px){header{padding:10px 12px}main{padding:12px 12px 70px}.ch .when{margin-left:0}.strip{grid-template-columns:repeat(3,1fr)}.si{padding:8px 10px}.si b{font-size:17px}}
</style></head><body>
<header><a href="./">← 선별기</a><h1><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F5A524" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>점검 현황</h1><span class="up" id="upd">불러오는 중…</span></header>
<main>
  <div class="strip" id="strip"></div>
  <nav class="toc" id="toc"></nav>
  <div id="root"><div class="empty">불러오는 중…</div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(v,d=2,u='%')=>v==null||v!==v?'<span class="dim">-</span>':`<span class="mono ${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${(+v).toFixed(d)}${u}</span>`;
const man=v=>v==null?'-':`<span class="mono ${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${(v/1e4).toFixed(1)}만</span>`;
const dd=s=>s&&s.length>=8?`${s.slice(4,6)}/${s.slice(6,8)}`:esc(s||'');
const tm=s=>s?esc(s.slice(5)):'<span class="dim">-</span>';
async function rpc(fn,body){const r=await fetch(`${SB.url}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(fn+' '+r.status);const t=await r.text();return t?JSON.parse(t):null}
const ST={'정상':'g','실행 중':'y','첫 실행 전':'m','꺼짐':'m','오류':'r'};
const PR={open:['진행 중','y'],extended:['연장','y'],pass:['합격','g'],fail:['기각','r'],closed:['닫힘','m'],delegated:['밤 연구 일꾼이 판정','m']};
function card(id,title,what,when,html){return `<section class="card" id="${id}"><div class="ch"><h2>${title}</h2>${when?`<span class="when">${when}</span>`:''}<div class="what">${what}</div></div>${html}</section>`}
function tbl(head,rows){return `<div class="tw"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}

function secTasks(T){
  if(!T||!T.length)return card('tasks','예약 작업','이 서버에서 시간 맞춰 저절로 도는 작업 전부','', '<div class="body"><div class="empty">자료 없음</div></div>');
  let g='',rows=[];
  for(const t of T){if(t.group!==g){g=t.group;rows.push(`<tr class="grp"><td colspan="5">${esc(g)}</td></tr>`)}
    rows.push(`<tr><td class="mono">${esc(t.name)}</td><td class="l">${esc(t.what)||'<span class="dim">'+esc(t.path)+'</span>'}</td><td><span class="badge ${ST[t.state]||'m'}">${esc(t.state)}</span>${t.state==='오류'?` <span class="dim mono">${t.res}</span>`:''}</td><td class="mono">${tm(t.last)}</td><td class="mono">${tm(t.next)}</td></tr>`)}
  return card('tasks','예약 작업',`이 서버에서 시간 맞춰 저절로 도는 작업 ${T.length}개 — 묶음별, 다음 실행 순`,'',`<div class="body">${tbl(['이름','하는 일','상태','마지막','다음'],rows)}</div>`)}

function secPrereg(P){
  const rows=(P||[]).map(x=>{const b=PR[x.status]||[x.status,'m'];const h=(x.history||[]).map(y=>`${esc(y.at)} ${esc(y.verdict)} — ${esc(y.text)}`).join('<br>');
    return `<tr><td class="mono">${esc(x.id)}</td><td class="l">${esc(x.name)}<div class="dim">${esc(x.doc)}</div></td><td><span class="badge ${b[1]}">${b[0]}</span></td><td class="mono">${dd(x.start)} · ${x.need||'-'}일${x.extend?`(→${x.extend})`:''}</td><td class="l">${esc(x.now)}${h?`<div class="dim">${h}</div>`:''}</td></tr>`});
  return card('prereg','사전 등록 판정','결과 보기 전에 정해 둔 합격선으로, 날 수가 차면 기계가 판정하고 텔레그램 한 줄. 합격선은 나중에 못 옮긴다.','매일 21:10',
    `<div class="body">${rows.length?tbl(['id','무엇','상태','시작 · 날 수','지금'],rows):'<div class="empty">등록 없음</div>'}</div>`)}

function secAudit(A){
  if(!A||!A.all)return card('audit','실전-연구 대조','','16:50','<div class="body"><div class="empty">자료 없음</div></div>');
  const t=X=>tbl(['규칙','왕복','실전 건당','연구 건당','차이','살 때 유리(+)','팔 때 유리(+)','연구 조건 밖'],X.map(r=>`<tr><td>[${esc(r.rule)}]</td><td class="mono">${r.n}</td><td>${pct(r.live)}</td><td>${pct(r.research)}</td><td>${pct(r.gap,2,'%p')}</td><td>${pct(r.slip_buy)}</td><td>${pct(r.slip_sell)}</td><td class="mono">${r.out==null?'<span class="dim">-</span>':`<span class="${r.out>20?'pos':''}">${r.out}%</span> <span class="dim">${esc(r.out_n)}</span>`}</td></tr>`));
  const d=(A.daily||[]).map(r=>`<tr><td class="mono">${dd(r.d)}</td><td class="mono">${r.n}</td><td>${pct(r.live)}</td><td>${pct(r.research)}</td></tr>`);
  return card('audit','실전-연구 대조','실제로 사고판 값과 연구가 가정한 값(KRX 시가·종가, 매도 1호가)을 왕복마다 비교. 유리(+) = 연구가 가정한 값보다 싸게 샀다·비싸게 팔았다. 최근 5거래일 차이 -0.3%p 아래 · [갭하락] 조건 밖 20% 넘음 · 지정가 체결 어긋남이면 텔레그램.','매일 16:50',
    `<div class="body"><div class="muted" style="margin-bottom:6px">최근 5거래일</div>${t(A.last5)}<div class="muted" style="margin:12px 0 6px">전체 ${dd(A.first)}~${dd(A.lastday)}</div>${t(A.all)}</div>
     <details><summary>날짜별(최근 10일)</summary><div class="dbody">${tbl(['매도일','왕복','실전','연구'],d)}</div></details>`)}

function secRed(R){
  const LV={'초록':'g','노랑':'y','빨강':'r'};
  const items=(R||[]).map(x=>{const v=x.verdict||'';const c=/막|기각|빨/.test(v)?'r':/주의|노|보류/.test(v)?'y':'g';
    const ch=(x.checks||[]).map(k=>`<tr><td>${esc(k.name)}</td><td><span class="badge ${LV[k.level]||'m'}">${esc(k.level)}</span></td><td class="l">${esc(k.note)}</td></tr>`);
    return `<details><summary><span class="badge ${c}">${esc(v)}</span> ${esc(x.name)} <span class="dim">${esc(x.at)}</span></summary><div class="dbody">${ch.length?tbl(['함정','판정','내용'],ch):''}<div class="pre" style="margin-top:8px">${esc(x.text)}</div></div></details>`});
  return card('redteam','적대적 검토관','채택 제안·그림자 통과·밤 연구 결과를 깨 보려고 함정 목록(미래 정보·고른 기간 겹침·뒤집은 짝·체결 손해·장 국면·위 10건·몰림·날 수·다중검정)을 스크립트로 돌리고 판정.','후보가 생길 때',
    items.length?items.join(''):'<div class="body"><div class="empty">아직 검토 없음</div></div>')}

function secLab(N){
  const q=(N&&N.queue)||[];
  const rows=q.map(x=>`<tr><td class="mono">${esc(x.id)}</td><td class="l">${esc(x.title)}<div class="dim">${esc(x.hypothesis)}</div></td><td><span class="badge ${/done|끝|합격/.test(x.status)?'g':/fail|기각|막/.test(x.status)?'r':'y'}">${esc(x.status||'대기')}</span></td><td class="l">${esc(typeof x.result==='string'?x.result:JSON.stringify(x.result||''))}</td></tr>`);
  const reps=((N&&N.reports)||[]).map(r=>`<li><span class="mono">${esc(r.name)}</span> <span class="dim">${esc(r.at)}</span></li>`).join('');
  return card('nightlab','밤 연구 일꾼','사용자가 시킨 실측만 대기 목록에 넣으면, 밤(22:30~06:30)에 사전 등록 → 실행 → 검토관을 거쳐 표로 남긴다. 스스로 가설을 지어내지 않고 실전 코드는 안 건드림.','밤 22:30~06:30',
    `<div class="body">${rows.length?tbl(['id','무엇','상태','결과'],rows):'<div class="empty">대기 목록 비어 있음</div>'}${reps?`<div class="muted" style="margin-top:10px">보고서(research/reports/nightlab)</div><ul class="list">${reps}</ul>`:''}</div>`)}

function secRec(R){
  const rows=(R||[]).map(x=>`<tr><td>${esc(x.kind)}</td><td class="mono">${x.days||0}일</td><td class="mono">${dd(x.first)}~${dd(x.last)}</td><td class="mono">${x.rows??'-'}</td><td class="mono">${x.tickers??'-'}</td><td class="mono">${x.mb??'-'}MB</td></tr>`);
  return card('rec','녹화','지금 안 쌓으면 나중에 돈 주고도 못 사는 자료. 11-13부터 NXT 장전 호가 10단계(08:12·08:25)와 시가 직후 체결가(09:00~09:01 5초, ~09:03 15초)를 더 찍는다.','매일 08:05~09:03 · 장전·마감',
    `<div class="body">${tbl(['무엇','쌓인 날','기간','마지막 날 줄 수','종목','용량'],rows)}</div>`)}

function secFill(F){
  const rows=(F||[]).map(x=>{const done=x.total?Math.max(0,1-(x.left||0)/x.total):null;
    return `<tr><td class="l">${esc(x.name)}</td><td class="mono">${x.total!=null?(x.total-(x.left||0)).toLocaleString()+' / '+x.total.toLocaleString():'-'}</td><td style="min-width:120px">${done!=null?`<div class="bar"><i style="width:${(done*100).toFixed(1)}%"></i></div>`:''}</td><td class="mono">${x.rate_per_s??'-'}/초</td><td class="mono">${x.eta_hours!=null?x.eta_hours.toFixed(1)+'시간':'-'}</td><td class="mono">${x.updated?esc(x.updated.slice(5,16).replace('T',' ')):'-'}</td></tr>`});
  return card('fill','밤 과거 자료 받기','밤마다 토스 API 로 지난 자료를 조금씩 받는다(NXT 장전·장후 1분봉 2025-03~, 빈 날 메우기). 초당 4회 · 실전 작업이 돌면 양보 · 07:30 멈추고 다음 밤 이어받기.','매일 20:10~07:30',
    `<div class="body">${rows.length?tbl(['일감','받은 / 전체','진행','속도','남은 예상','갱신'],rows):'<div class="empty">상태 없음</div>'}</div>`)}

function secImpact(I){
  if(!I)return '';
  const u=I.use||{},c=I.cont||{};
  const rows=(I.rows||[]).map(r=>`<tr><td class="mono">${esc(r.amt)}</td><td>${pct(r.real)}</td><td>${pct(r.auction)}</td><td>${pct(r.cont)}</td><td class="mono">${r.short!=null?(+r.short).toFixed(0)+'%':'-'}</td></tr>`);
  return card('impact','체결 손해 모형','큰 돈으로 사고팔면 값이 밀린다 — 녹화된 호가를 사다리 타듯 사서 매일 다시 잰다. 공장 그림자 판정이 이 값을 읽는다(단일가 규칙 = 실현 모형, 장중 매수 = 접속매매).','매일 17:10',
    `<div class="body"><div class="kv"><div><small>단일가 규칙(지금 씀)</small><b class="mono">${u.a??'-'} + ${u.b??'-'}×√p</b></div><div><small>장중 매수</small><b class="mono">${c.a??'-'} + ${c.b??'-'}×√p</b><small>${c.days??'-'}일 · ${c.n??'-'}건</small></div><div><small>맞춘 날</small><b class="mono">${esc(I.date||'-')}</b></div></div>
     ${tbl(['한 건 금액','실현(실주문)','단일가 호가','접속매매 호가','호가 깊이 모자람'],rows)}<div class="dim" style="margin-top:6px">p = 금액 ÷ 그 종목 20일 평균 거래대금(%) · 사고파는 손해 합</div></div>`)}

function secHealth(H){
  if(!H)return '';
  const li=a=>a&&a.length?`<ul class="list">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<div class="dim">없음</div>';
  const hist=(H.hist||[]).map(r=>`<tr><td class="mono">${dd(r.d)}</td><td class="mono"><span class="${r.n?'pos':''}">${r.n}</span>${r.crit?` <span class="badge r">🚨${r.crit}</span>`:''}</td><td class="mono">${r.fix||0}</td><td class="l">${esc(r.first)}</td></tr>`);
  return card('health','점검기','지난 24시간이 "돌았나"가 아니라 "맞게 돌았나"를 본다(예약 작업·녹화·전이표·정답지·숫자). 알려진 문제는 먼저 스스로 고치고(일봉 다시 넣기·1분봉 다시 받기 예약·수급 수집 재시작), 남은 것만 텔레그램.','매일 09:20',
    `<div class="body"><div class="muted">${dd(H.date)} 문제</div>${li(H.problems)}<div class="muted" style="margin-top:8px">스스로 고친 것</div>${li(H.fixed)}</div>
     <details><summary>정상 확인 ${(H.ok||[]).length}개</summary><div class="dbody">${li(H.ok)}</div></details>
     <details><summary>최근 14일</summary><div class="dbody">${tbl(['날','문제','고침','첫 문제'],hist)}</div></details>`)}

function secBrief(B){
  return card('brief','아침 브리핑','장 시작 전 텔레그램 한 통 — 오늘 특이일(만기·월말·늦은 개장) · 시가 매도 예정 · 어제 실전 · 매수 가능 금액 · 자동매매 STOP.','평일 08:35',
    `<div class="body">${B&&B.text?`<div class="dim" style="margin-bottom:6px">${esc(B.at)}</div><div class="pre">${esc(B.text)}</div>`:'<div class="empty">아직 안 보냄(11-13 첫 실행)</div>'}</div>`)}

function secShadow(S){
  const rows=(S||[]).map(s=>{const f=s.fwd||{};return `<tr><td class="mono">${esc(s.id)}</td><td class="l">${esc(s.desc)}</td><td class="mono">${f.ready?'<span class="badge g">판정 가능</span>':'<span class="badge y">판정 전</span>'} ${f.days??0}/20일</td><td class="mono">${f.n??0}건 ${pct(f.mean)}</td><td>${pct(f.ex,2,'%p')}</td><td class="mono">${f.twin?esc(f.twin)+' '+pct(f.twin_ex,2,'%p'):'-'}</td><td>${man(f.pnl50)}</td><td>${man(f.pnl)}</td></tr>`});
  return card('shadow','공장 그림자','실시간 재료(과거 없음) 규칙을 실제로 사지 않고 앞으로 오는 날 성적만 적는다. 통과 = 20거래일·15건·시장 대비 t≥2·뒤집은 짝보다 나음·50만 체결 손해 뒤 하루 손익 > 0.','매일 저녁',
    `<div class="body">${rows.length?tbl(['id','규칙','날 수','건당','시장 대비','뒤집은 짝','50만 하루','100만 하루'],rows):'<div class="empty">그림자 없음</div>'}</div>`)}

function secDoctor(J){
  const li=(a,f)=>a&&a.length?`<ul class="list">${a.map(f).join('')}</ul>`:'<div class="dim">없음</div>';
  const body=!J||!J.at?'<div class="empty">아직 안 돎 — 매일 10:20·17:40</div>':
    `<div class="kv"><div><small>마지막 점검</small><b class="mono">${esc(J.at)}</b></div><div><small>상태</small><b>${J.ok?'<span style="color:var(--ok)">정상</span>':'<span class="pos">문제 있음</span>'}</b></div><div><small>방식</small><b>${J.mode==='fix'?'고치기까지':'보고만'}</b></div><div><small>selftest</small><b>${J.selftest===false?'<span class="pos">실패</span>':'통과'}</b></div></div>
     <div class="pre" style="margin-bottom:10px">${esc(J.summary||'')}</div>
     <div class="muted">찾은 문제</div>${li(J.found,x=>`<li><b>${esc(x.what)}</b> — ${esc(x.why||'')} <span class="dim">${esc(x.where||'')}</span></li>`)}
     <div class="muted" style="margin-top:8px">고친 것</div>${li(J.fixed,x=>`<li><b>${esc(x.what)}</b> — ${esc(x.how||'')} <span class="dim">${esc(x.check||'')} ${esc(x.commit||'')}</span></li>`)}
     <div class="muted" style="margin-top:8px">정해 줘야 할 것 · 고칠 방법</div>${li(J.user,x=>`<li><b>${esc(x.what)}</b> — ${esc(x.why||'')}${x.suggest?`<div class="dim">→ ${esc(x.suggest)}</div>`:''}</li>`)}
     ${J.reverted&&J.reverted.length?`<div class="pos" style="margin-top:8px">손대면 안 되는 파일을 바꿔서 되돌림: ${esc(J.reverted.join(', '))}</div>`:''}`;
  return card('doctor','점검 의사','이 페이지 전체를 클로드가 매일 훑어 고장·조용한 고장(결과 파일 안 생김·날짜 묵음·숫자 이상)을 찾고 원인을 로그로 확인한다. 지금은 보고만 — 고칠 방법까지 적어 두면 클로드 창에서 "고쳐줘"로 고친다. 매매 코드·사이트·원장은 어떤 경우에도 안 건드림.','매일 10:20 · 17:40',
    `<div class="body">${body}</div>${J&&J.checked&&J.checked.length?`<details><summary>정상 확인 ${J.checked.length}개</summary><div class="dbody">${li(J.checked,x=>`<li>${esc(x)}</li>`)}</div></details>`:''}`)}
function render(D){
  const T=D.tasks||[];const cnt=k=>T.filter(t=>t.state===k).length;
  const H=D.health||{};const pr=(D.prereg||[]).filter(x=>x.status==='open'||x.status==='extended').length;
  $('#strip').innerHTML=[['예약 작업',T.length,''],['정상',cnt('정상'),'g'],['오류',cnt('오류'),cnt('오류')?'r':''],['꺼짐',cnt('꺼짐'),''],['오늘 점검 문제',(H.problems||[]).length,(H.problems||[]).length?'y':''],['스스로 고침',(H.fixed||[]).length,''],['판정 기다림',pr,'']]
    .map(([k,v,c])=>`<div class="si"><b class="${c==='g'?'':c==='r'?'pos':''}" style="${c==='g'?'color:var(--ok)':c==='y'?'color:var(--ind)':''}">${v}</b><small>${k}</small></div>`).join('');
  const secs=[['doctor','점검 의사'],['tasks','예약 작업'],['prereg','사전 등록 판정'],['audit','실전-연구 대조'],['shadow','공장 그림자'],['redteam','검토관'],['nightlab','밤 연구 일꾼'],['health','점검기'],['brief','아침 브리핑'],['rec','녹화'],['fill','밤 과거 받기'],['impact','체결 손해']];
  $('#toc').innerHTML=secs.map(([i,n])=>`<a href="#${i}">${n}</a>`).join('');
  $('#root').innerHTML=secDoctor(D.doctor)+secTasks(T)+secPrereg(D.prereg)+secAudit(D.audit)+secShadow(D.shadow)+secRed(D.redteam)+secLab(D.nightlab)+secHealth(D.health)+secBrief(D.brief)+secRec(D.rec)+secFill(D.nightfill)+secImpact(D.impact)
    +(D.err?`<div class="dim">모으기 실패: ${esc(JSON.stringify(D.err))}</div>`:'');
  $('#upd').textContent='서버 갱신 '+(D.made||'-').slice(5)+' · 30분마다';
}
async function load(){let D=null;try{D=await rpc('kospi_state_get',{p_pin:'__ops__'})}catch(e){}
  if(D&&D.data)D=D.data;
  if(!D||!D.made){$('#root').innerHTML='<div class="empty">아직 자료 없음 — 서버가 30분마다 올린다</div>';$('#upd').textContent='-';return}
  render(D)}
load();setInterval(load,5*60*1000);
</script>
</body></html>

name: intraday-prices
on:
  schedule:
    # KST 09:00~15:40 평일, 10분 간격 (장 마감 15:30 이후 10분까지만 확인)
    - cron: "*/10 0-5 * * 1-5"            # KST 09:00~14:50
    - cron: "0,10,20,30,40 6 * * 1-5"     # KST 15:00~15:40
  workflow_dispatch:
  push:
    paths: [prices.py, .github/workflows/prices.yml]
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: check secrets
        env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          C: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "token length=${#T} chat length=${#C}"
          if [ -z "$T" ] || [ -z "$C" ]; then echo '::error::TELEGRAM secrets 비어 있음'; exit 1; fi
      - run: python prices.py ${{ github.event_name == 'push' && '--ping' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

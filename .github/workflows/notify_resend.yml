# 알림 재전송 — 수집은 하지 않고, 이미 커밋된 데이터로 사이트를 다시 만들어
# 신규 편입 알림만 보낸다. 알림이 유실됐거나(스크립트 오류·네트워크) 텔레그램 경로를
# 점검하고 싶을 때 Actions 탭에서 직접 돌린다.
# ⚠ 수집을 안 하므로 데이터는 마지막으로 커밋된 거래일 기준이다.
name: notify-resend
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "실제로 보내지 않고 판정만 본다"
        type: boolean
        default: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      # 코스닥 DB 는 리포지토리에 없고 캐시가 유일한 출처다. 없으면 코스닥 종목이
      # 통째로 빠진 채 판정돼 코스닥 규칙의 기준 목록이 잘못 저장된다.
      - name: restore kosdaq cache
        id: kdcache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/kosdaq.db
            data/kosdaq_short_recent.csv
          key: kosdaq-db-v2-${{ github.run_id }}
          restore-keys: kosdaq-db-v2-
      - name: restore financials cache
        uses: actions/cache/restore@v4
        with:
          path: data/dart/financials.db
          key: dart-fin-v1-${{ github.run_id }}
          restore-keys: dart-fin-v1-
      - name: 코스닥 캐시 확인
        run: |
          if [ ! -s data/kosdaq.db ]; then
            echo "::error::코스닥 DB 캐시가 없다 — 코스닥 규칙이 잘못 판정되므로 중단한다"
            exit 1
          fi
      - name: build site (수집 없이 커밋된 데이터로만)
        env: { TZ: Asia/Seoul }
        run: python pipeline.py --no-collect
      - name: notify new picks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_new.py ${{ inputs.dry && '--dry' || '' }}

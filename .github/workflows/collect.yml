name: collect-and-deploy
on:
  schedule:
    # 아래는 외부 스케줄러(cron-job.org, 평일 19:00 KST)가 죽었을 때의 보험이다.
    # 주 트리거보다 이른 시각은 두지 않는다 — 발화해 봐야 데이터가 없어 대기에 들어갔다가
    # 19:00 트리거에 취소당하며 자리만 차지한다. 그래서 16:30·18:30 예약을 없앴다
    # (2026-09-03). 받을 게 없으면 is_trading_day.py 가 false 를 내어 스스로 빠진다.
    - cron: "30 12 * * 1-5"   # 21:30 KST 평일 — 19:00 트리거가 실패했을 때
    - cron: "0 22 * * 0-4"    # 다음날 07:00 KST — 최종 보충(앞의 둘을 다 놓쳤을 때)
  # 외부 스케줄러(cron-job.org)가 정시에 때려 주는 입구 — 이쪽이 주 트리거다.
  # GitHub 예약은 부하에 따라 몇 시간 밀리거나 통째로 유실된다(실측: 5일간 기대 10회 중
  # 4회만 발화, 지연 중앙값 3h). 이쪽은 시각을 우리가 소유한다.
  # 19:00 KST 로 잡았다 — 네이버가 당일 투자자 데이터를 올리는 시각이 17~21시로 들쭉날쭉해
  # (실측 완료 시각 17:25 / 19:35 / 20:21 / 20:47), 너무 이르면 몇 시간을 대기로 보낸다.
  repository_dispatch:
    types: [collect]
  workflow_dispatch:
    inputs:
      force:
        description: "휴장일에도 강제로 수집"
        type: boolean
        default: false
  push:
    branches: [main]
    # 연구 기록(가설 등록부·명세·보고서·시험 횟수)만 바뀐 커밋은 사이트와 무관하다 — 빌드·배포를 안 탄다.
    # 무인 야간 탐색이 매일 커밋해도 배포가 쌓이거나 수집과 줄을 서지 않게 한다(2026-09-19).
    # 다른 파일이 하나라도 섞이면 평소처럼 빌드된다.
    paths-ignore:
      - "research/**"
      - "data/trials.json"
permissions:
  contents: write
# 배포는 한 번에 하나만 — 그래서 그룹은 하나다. 그리고 **아무도 취소하지 않는다**.
#
# 전에는 수집성 실행(예약·dispatch)이 진행 중인 것을 취소했다. 푸시 빌드만 죽일 생각이었지만
# 실제로는 **돌고 있던 수집도 죽인다**. 수집은 100분쯤 걸려서 늦게 시작한 날은 21:30 예약
# 보충분과 겹치는데, 그러면 그날 데이터가 통째로 날아간다. 2026-09-11 에 푸시 빌드가 수집에
# 취소당하는 걸 실제로 봤다(그때는 푸시라 손해가 없었을 뿐이다).
#
# false 로 두면 전부 줄을 선다. 수집이 도는 동안 들어온 예약은 기다렸다가 제 차례에 돌고,
# 이미 받은 데이터를 보고 할 일이 없으면 금방 끝난다(is_trading_day·수집 필요 판정이 거른다).
# 푸시가 몰려도 낭비되지 않는다 — GitHub 은 대기 중인 실행을 하나만 남기고 **앞선 대기분을
# 스스로 지운다**. 대신 수집이 도는 동안 민 코드는 그게 끝나야 배포된다. 그 기다림이
# 하루치 데이터보다 싸다.
concurrency:
  # ⚠ 2026-09-17 데이터 유실: 전부 'site' 한 그룹이었는데, GitHub 은 같은 그룹에서
  #   **대기 중인 실행을 하나만 남기고 앞선 대기분을 지운다**. 그날 코드 푸시가 열세 번
  #   몰리면서, 줄 서 있던 20:20 KST 수집(repository_dispatch)이 **취소**됐고 국내·미장
  #   데이터가 하루 통째로 빠졌다. 아래 주석은 "푸시가 몰려도 낭비되지 않는다" 고 적혀
  #   있었는데, 낭비되는 게 푸시가 아니라 **수집** 이었다.
  #
  #   그래서 수집 실행은 **실행마다 다른 그룹**을 준다 — 누구와도 줄을 서지 않으므로
  #   지워질 일이 없다. 푸시 빌드끼리만 한 그룹으로 묶어 서로 양보하게 둔다.
  #   대가: 수집과 푸시 배포가 겹칠 수 있다. 그건 표 기준일 가드(collect_us_daily·deploy.py)가
  #   막으므로 하루치 데이터를 잃는 것보다 싸다.
  group: ${{ github.event_name == 'push' && 'site-push' || format('collect-{0}', github.run_id) }}
  cancel-in-progress: false
# 사이트 주소 — Cloudflare 로 옮기면 리포 설정의 Variables 에 SITE_URL 을 넣어 덮어쓴다.
# (코드를 고치지 않고 값만 바꿔 전환하려고 한 곳에 모아 뒀다 · 2026-09-11)
env:
  SITE_URL: ${{ vars.SITE_URL || 'https://kospi-volume.pages.dev' }}
  # Cloudflare Access 서비스 토큰 — 사이트가 Access 뒤로 가면 이게 있어야 자료를 받는다.
  # 아직 GitHub Pages 를 보는 동안에는 값이 있어도 무해하다(그쪽은 헤더를 무시한다).
  CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
  CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
  # ⚠ 최상위에 둬야 한다. step 의 `if:` 는 그 step 자신의 env 를 못 본다(먼저 평가된다).
  #   step env 로 뒀다가 조건이 늘 거짓이 돼 배포가 조용히 건너뛰어졌다(2026-09-11).
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    # 알림 잡이 '수집한 날인가' 와 '어느 거래일까지 담겼나' 를 알아야 한다.
    outputs:
      trading: ${{ steps.td.outputs.trading }}
      last_date: ${{ steps.lastdate.outputs.d }}
    # collect.py 의 wait_for_today 는 네이버가 당일 투자자 데이터를 올릴 때까지 21:00 까지
    # 기다린다. 잡 타임아웃이 그보다 짧으면 대기 중에 잡이 죽고(GitHub 은 이걸 cancelled 로
    # 표시한다) 뒤 단계가 전부 건너뛰어진다 — 2026-09-03 16:35 실행이 50분 만에 그렇게
    # 죽었다. 16:35 에 시작해 21:00 까지 버티려면 4시간 반이 필요하다. 공개 저장소라
    # 러너 시간은 무료다.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      # 코스피 지수의 최신 거래일이 우리가 가진 최신 거래일보다 앞서면 수집한다.
      # '오늘 장이 열렸나' 가 아니라 '못 받은 날이 있나' 로 보기 때문에,
      # 실행이 자정을 넘겨 지연돼도 전날치를 정상적으로 받아온다.
      - name: 수집 필요 판정 (못 받은 거래일이 있는가)
        id: td
        env: { TZ: Asia/Seoul }
        run: |
          OK=$(python is_trading_day.py)
          # 수동 실행은 inputs.force, 외부 스케줄러는 client_payload.force 로 강제할 수 있다
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event.client_payload.force }}" = "true" ]; then
            OK=true; echo "force 입력 — 휴장일이어도 수집"
          fi
          echo "trading=$OK" >> $GITHUB_OUTPUT
          echo "수집 여부: $OK"
      # 푸시(코드 변경)는 수집을 건너뛰고 빌드·배포만 한다.
      # 데이터 수집은 스케줄(평일 18:30)과 수동 실행에서만 — 하루 한 번이면 충분하다.
      - name: collect (wait for today's data)
        # us_only 는 엣지 함수가 '국내는 휴장으로 보이는데 미장은 열렸다' 고 판단해 부른 경우다.
        # 그날은 국내 수집을 아예 건너뛴다 — 안 그러면 러너가 21:00 까지 빈 손으로 기다린다.
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
            && github.event.client_payload.us_only != true
        # WAIT_MINUTES 는 **엣지 함수 trigger 가 깨운 경우에만** 들어간다(client_payload.ready).
        # 그쪽은 네이버에 당일 데이터가 있는 걸 보고 쏘므로 여기 도착했을 땐 기다릴 게 없다.
        # 나머지 경로(예약 보충분·수동·옛 cron-job.org)는 값이 비어 예전대로 21:00 까지 기다린다 —
        # 데이터보다 먼저 때리는 경로가 아직 살아 있어서, 무조건 짧게 잡으면 어제치를
        # 오늘로 수집하게 된다(조용히 틀리는 사고).
        env:
          TZ: Asia/Seoul
          WAIT_MINUTES: ${{ github.event.client_payload.ready == true && '20' || '' }}
        run: python pipeline.py --wait --no-site
      - name: collect sector/theme (테마 주1회·업종 분기1회)
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
        continue-on-error: true
        env: { TZ: Asia/Seoul }
        run: |
          DOW=$(date +%u); DOM=$(date +%d); MON=$(date +%m)
          ARGS=""
          if [ "$DOW" = "1" ]; then ARGS="--theme"; fi
          if [ "$DOM" = "01" ] && echo "01 04 07 10" | grep -qw "$MON"; then ARGS=""; fi
          if [ -n "${{ github.event_name == 'workflow_dispatch' && 'X' || '' }}" ]; then ARGS=""; fi
          if [ "$DOW" = "1" ] || [ "$DOM" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sector 수집: ARGS='$ARGS'"; python collect_sector.py $ARGS; python collect_industry.py
          else
            echo "오늘은 sector 수집 안 함 (요일=$DOW, 일=$DOM)"
          fi
      # 코스닥 DB·공매도는 리포지토리에 없어(용량) 캐시로 실행 간 이어붙인다.
      # 푸시 빌드에서도 복원해야 D1(코스닥) 규칙이 데이터를 찾는다.
      - name: restore kosdaq cache
        id: kdcache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/kosdaq.db
            data/kosdaq_short_recent.csv
          key: kosdaq-db-v2-${{ github.run_id }}
          restore-keys: kosdaq-db-v2-
      - name: collect kosdaq (최근 60거래일 누적 · 코스닥 필터용)
        # 캐시 미스면 푸시 빌드에서도 받는다. 코스닥 DB 는 리포지토리에 없어
        # 캐시가 유일한 출처이고, 비면 사이트에서 1,823종목이 통째로 사라진다.
        if: (github.event_name != 'push' && steps.td.outputs.trading == 'true') || steps.kdcache.outputs.cache-matched-key == ''
        continue-on-error: true
        env: { TZ: Asia/Seoul }
        run: python collect_kosdaq_daily.py --days 60 --backfill 260 --prune 300
      - name: save kosdaq cache
        uses: actions/cache/save@v4
        if: hashFiles('data/kosdaq.db') != ''
        with:
          path: |
            data/kosdaq.db
            data/kosdaq_short_recent.csv
          key: kosdaq-db-v2-${{ github.run_id }}

      - name: collect valuation (PER·PBR·PCR)
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
        continue-on-error: true
        env: { TZ: Asia/Seoul }
        run: python collect_valuation.py --workers 8

      # DART 재무(financials.db, 181MB)는 리포지토리에 못 넣어 캐시로 이어붙인다.
      # 분기 보고서는 자주 안 바뀌므로 월요일에만 최근 2년치를 갱신한다(약 2~3분).
      - name: restore financials cache
        id: fincache
        uses: actions/cache/restore@v4
        with:
          path: data/dart/financials.db
          key: dart-fin-v1-${{ github.run_id }}
          restore-keys: dart-fin-v1-
      - name: collect DART financials (월 1회 갱신)
        if: github.event_name != 'push' && (steps.td.outputs.trading == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          TZ: Asia/Seoul
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          DOW=$(date +%u)
          if [ ! -f data/dart/financials.db ]; then
            echo "재무 DB 없음 → 전체 수집(약 4분)"; python collect_dart_fin.py --workers 4
          elif [ "$DOW" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "월요일 → 최근 2년 갱신"; python collect_dart_fin.py --workers 4 --refresh --refresh-years 2
          else
            echo "오늘은 재무 갱신 안 함 (요일=$DOW)"
          fi
      - name: save financials cache
        if: hashFiles('data/dart/financials.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/dart/financials.db
          key: dart-fin-v1-${{ github.run_id }}

      - name: collect extra (공매도·희석공시 최근분)
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
        continue-on-error: true
        env:
          TZ: Asia/Seoul
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python collect_daily_extra.py

      # 신용잔고: [폭락반등] 이 쓴다. 20일 낙폭 -15% 이하 종목만 받으므로 보통 1~2분.
      - name: collect credit balance (신용잔고 · 폭락 종목만)
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
        continue-on-error: true
        env:
          TZ: Asia/Seoul
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python collect_credit_recent.py

      # 공포탐욕지수 — VKOSPI 실측을 먼저 받고(그날 값이 있어야 지수가 제대로 나온다),
      # 그 값으로 지수를 하루치 이어 붙인다. 전 구간 재계산(collect_feargreed.py)은
      # kospi.db(1GB, 저장소에 없음)가 필요해 CI 에서는 못 돌린다 — 증분 갱신만 한다.
      - name: collect VKOSPI (변동성지수)
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
        continue-on-error: true
        env: { TZ: Asia/Seoul }
        run: python collect_vkospi.py
      - name: update fear & greed index (공포탐욕지수 하루치)
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
        continue-on-error: true
        env: { TZ: Asia/Seoul }
        run: python update_feargreed.py

      # 토스(프로그램매매·대차·기관세부)는 2026-09-21 부터 **이 PC 의 일일 갱신(run_daily_research.py)** 이 받는다.
      # 여기서 뺀 이유: 러너에서는 2026-09-05 부터 전 종목 403 이 떨어졌는데, 403 을 종목마다 재시도하느라
      # 이 단계가 수 시간을 붙잡았다(09-18 1h44m · 09-20 4h15m 실패 · 09-21 50분+). 뒤에 줄 선
      # **사이트 빌드·데이터 커밋·배포가 전부 그만큼 늦어졌다.** 사이트는 토스 데이터를 쓰지 않는다
      # (별도 DB·연구용) — 실전에 기여 없이 실전만 막고 있었다.

      # 수집 단계는 continue-on-error 라서 실패해도 워크플로가 통과한다. 그때 빈 CSV 가
      # 그대로 빌드에 들어가면 그 필드를 쓰는 규칙이 조용히 0건이 된다 — 2026-09-02 에
      # 자사주·내부자가 비어 [자사주 낙폭]·[외인 매집] 이 하루 종일 멈춰 있었다.
      # 헤더만 남은 파일은 이전 것으로 되돌린다. 옛 데이터가 빈 데이터보다 낫다.
      - name: 수집 결과 점검 (빈 파일이면 이전 것을 지킨다)
        run: |
          bad=0
          for f in data/buyback_recent.csv data/insider_recent.csv data/dilution_recent.csv \
                   data/credit_recent.csv data/short_recent.csv; do
            [ -f "$f" ] || continue
            n=$(wc -l < "$f")
            if [ "$n" -le 1 ]; then
              echo "::warning::$f 가 비었다(${n}줄) — 수집 실패로 보고 이전 파일을 지킨다"
              git checkout -- "$f" 2>/dev/null || rm -f "$f"; bad=$((bad+1))
            else
              echo "$f: ${n}줄"
            fi
          done
          [ "$bad" -eq 0 ] || echo "::warning::빈 파일 ${bad}건을 되돌렸다 — 수집 로그를 확인할 것"
      - name: build site (CSV + JSON)
        env: { TZ: Asia/Seoul }
        run: python pipeline.py --no-collect
      - name: 빌드된 표의 최신 거래일
        id: lastdate
        run: |
          D=$(python -c "import json;print((json.load(open('site/data/table.json',encoding='utf-8'))['dates'] or [''])[-1])")
          echo "d=$D" >> $GITHUB_OUTPUT
          echo "최신 거래일: $D"
      # 미장(나스닥·NYSE·아멕스) 조회용 목록 — 사이트를 만든 **뒤에** 얹는다(pipeline 이 site/ 를 지운다).
      # 실패해도 나머지는 그대로 배포한다. 실패하면 그 파일이 없어 화면이 '받지 못했습니다' 를 띄운다.
      # 미장 자사주 — 사이트 [자사주 낙폭] 이 쓰는 재료. SEC companyfacts 벌크(약 1GB)를 받아
      # 집행 금액만 뽑는다. 분기 보고서라 하루 단위로 바뀌지 않으므로 **월요일에만** 돌린다.
      # 결과 CSV 는 커밋되므로 다른 날은 그걸 그대로 쓴다(수집 실패해도 어제 것이 남는다).
      - name: collect US buyback (주 1회 · 월요일)
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
        continue-on-error: true
        env: { TZ: Asia/Seoul }
        run: |
          if [ "$(date +%u)" = "1" ] || [ ! -s data/us/buyback_recent.csv ]; then
            python collect_us_buyback.py --force
          else
            echo "월요일이 아니고 CSV 도 있다 — 건너뛴다 ($(wc -l < data/us/buyback_recent.csv)줄)"
          fi
      - name: collect US earnings (주 2회 · 월·목)
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
        continue-on-error: true
        env: { TZ: Asia/Seoul }
        run: |
          # yfinance 는 종목당 호출이라 6천 종목에 1~3시간이다. 매일은 못 돌린다.
          # 신호가 며칠 늦는 대가를 실측했더니(us_pead_delay.py) **D+7 까지는 성적이
          # 사실상 같았다** — 그래서 주 1회로 충분하고, 규칙이 peadage<=7 로 그 지연을 흡수한다.
          pip install yfinance
          # ⚠ 이 단계는 continue-on-error 라 **조용히 실패할 수 있다**. 월요일 하루만 노리면
          #   한 번 걸렀을 때 다음 기회가 일주일 뒤고, 그 사이 [실적 서프라이즈] 는 완전히
          #   죽는다(규칙이 흡수하는 지연은 7거래일뿐이다). 그래서 **월·목 두 번** 돈다 —
          #   월요일이 실패해도 사흘 뒤에 스스로 메운다. 수집기는 기존 CSV 와 **합치므로**
          #   (덮어쓰지 않는다) 두 번 돌아도 잃는 것이 없다.
          #   2026-09-16 사고: CSV 가 화요일에 처음 만들어져 월요일 조건에 한 번도 안 걸렸고,
          #   9/9 이후 발표분이 통째로 비어 규칙이 5일간 공백이 될 뻔했다.
          if [ "$(date +%u)" = "1" ] || [ "$(date +%u)" = "4" ] || [ ! -s data/us/earn_recent.csv ]; then
            python collect_us_earn.py --force
          else
            echo "월·목이 아니고 CSV 도 있다 — 건너뛴다 ($(wc -l < data/us/earn_recent.csv)줄)"
          fi
      - name: collect US (미장 전체 조회용)
        if: github.event_name != 'push'
        continue-on-error: true
        env: { TZ: Asia/Seoul }
        run: |
          pip install yfinance
          python collect_us_daily.py
      # pipeline 이 site/ 를 지우는데 위 단계는 **푸시 빌드에서 건너뛴다**(6천 종목이라 느리다).
      # 그래서 코드를 한 번 푸시할 때마다 배포본에서 미장 표가 통째로 사라졌고, 다음 수집까지
      # 미장 규칙(N)과 조회 탭이 죽었다. 없으면 지금 서비스 중인 파일을 그대로 되살린다.
      - name: 미장 파일이 없으면 배포본에서 되살린다
        run: |
          # collect_us_daily.py 가 만드는 파일을 **전부** 적는다. 예전에는 table_us.json 만
          # 되살려서, 푸시 빌드가 한 번 돌면 uscal.json(거래일 달력·환율)이 조용히 사라졌다
          # — 그러면 미장 보유일이 0 이 되고 정렬 환율도 없어진다(2026-09-11 발견).
          mkdir -p site/data
          for f in table_us.json uscal.json; do
            if [ -s "site/data/$f" ]; then
              echo "$f 있음 ($(du -h site/data/$f | cut -f1))"; continue
            fi
            echo "$f 없음 — 배포본에서 가져온다"
            curl -fsSL -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
                       -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
                 "$SITE_URL/data/$f" -o "site/data/$f" \
              && echo "  되살림 ($(du -h site/data/$f | cut -f1))" \
              || echo "::warning::배포본에도 $f 가 없다 — 다음 수집까지 그 기능은 쉰다"
          done
      # 데이터 커밋은 사람이 코드를 밀어넣는 것과 부딪힌다. 2026-09-07 이 그래서 통째로 날아갔다 —
      # 수집은 다 됐는데 `git pull --rebase` 가 충돌해 단계가 실패하고 그날(코스피 +4.6%) 데이터가
      # 저장되지 않았다. 원격이 앞서 있으면 다시 얹어 밀기를 재시도하고, 충돌하면 데이터 파일은
      # 방금 수집한 값을 쓴다(rebase 중 -X theirs = 내 커밋 쪽). 커밋에 데이터 파일만 담기므로
      # 코드가 이 규칙에 휩쓸릴 일은 없다.
      - name: commit monthly csv
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "kospi-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/us/buyback_recent.csv data/us/earn_recent.csv data/20*.csv data/short_recent.csv data/dilution_recent.csv data/buyback_recent.csv data/insider_recent.csv data/credit_recent.csv data/sector.csv data/industry.csv data/valuation.csv data/vkospi.csv data/feargreed.csv
          if git diff --cached --quiet; then echo "바뀐 데이터 없음"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d)"
          # ⚠ 2026-09-14: 전에는 `git pull --rebase ... && git push` 였다. pull 이 실패하면
          #   **push 가 아예 실행되지 않아** 다섯 번이 같은 자리에서 막혔다(그날 커밋 유실).
          #   checkout@v4 는 기본이 fetch-depth 1(얕은 클론)이라 rebase 가 공통 조상을 못 찾는
          #   경우가 있다. 그래서 ① 먼저 그냥 밀어 보고(경합이 없으면 이걸로 끝난다)
          #   ② 밀리면 그때 깊이를 늘려 rebase 한다.
          for i in 1 2 3 4 5; do
            if git push; then echo "데이터 커밋 성공 (${i}회차 · 경합 없음)"; exit 0; fi
            echo "원격이 앞섰다 — 깊이를 늘려 다시 얹는다 (${i}회차)"
            git fetch --deepen=50 origin main 2>/dev/null               || git fetch --unshallow origin 2>/dev/null || git fetch origin main || true
            if git pull --rebase -X theirs origin main && git push; then
              echo "데이터 커밋 성공 (${i}회차 · 재얹기)"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"             -d chat_id="$TELEGRAM_CHAT_ID"             -d text="⚠ 오늘 수집 데이터를 저장하지 못했습니다(커밋 경합 5회 실패). 데이터는 받았으나 리포지토리에 없습니다 — Actions 로그를 확인하세요." > /dev/null
          echo "::error::데이터 커밋 5회 실패"
          exit 1
      # Cloudflare Pages 가 유일한 배포처다(2026-09-11 전환 완료).
      # ⚠ 실패를 삼키지 않는다 — 여기서 조용히 넘어가면 사이트만 어제 것으로 남는다.
      #   GitHub Pages 라는 보험이 없어졌으므로 빨간불로 보이는 게 맞다.
      # ⚠ wrangler 를 직접 부르지 않는다. 푸시 빌드는 그때 리포에 있는 CSV 로 표를 만드는데,
      #   그게 배포본보다 낡으면 **사이트를 되돌린다**(2026-09-18 실제로 그랬다 — 손으로 올린
      #   09/17 표를 푸시 빌드가 09/16 으로 덮었다). deploy.py 는 올리기 전에 배포본과 거래일을
      #   견줘 뒤로 가는 것을 막는다. 손배포와 같은 길을 쓰는 게 맞다([[manual-deploy-guard]]).
      - name: Cloudflare Pages 배포 (기준일 가드 포함)
        run: python deploy.py
      # 수집이 실제로 됐는지 **여기서 확인한다**. 지금까지는 빠져도 초록불이었다 —
      # 수집 단계 대부분이 continue-on-error 라, 표가 하루 묵었는지는 사람이 화면을 봐야
      # 알 수 있었다. 세 번의 사고(2026-09-11·09-16·09-17) 모두 사용자가 먼저 발견했다.
      # 지수 달력(우리 수집과 다른 경로)과 견줘 묵었으면 **빨간불**로 만든다.
      - name: 수집 확인 (표 기준일이 지수 달력과 맞나)
        id: fresh
        if: github.event_name != 'push'
        env: { TZ: Asia/Seoul }
        run: python check_fresh.py
      # 화면의 '묵음' 경보는 모바일에서 감췄다(2026-09-18 요청). 그 경보를 여기로 옮긴다 —
      # 폰으로 보는 시간이 대부분이라 알림이 아니면 사실상 아무도 안 본다.
      # ⚠ 단계가 **죽으면** 그 뒤 단계를 안 타므로 위의 '수집 확인' 도 안 돌고 알림도 안 갔다
      #   (2026-09-17~20: 배포 단계가 .env 때문에 매번 실패 → 사흘 침묵). 그래서 **잡 실패 자체**도
      #   알린다. 실패는 대개 배포·수집 단계이고, 둘 다 사이트가 묵는다는 뜻이라 알림 가치가 같다.
      - name: 잡 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" -d text="❌ 수집·배포 워크플로가 실패했습니다(${{ github.run_id }}). 사이트가 묵을 수 있으니 Actions 로그를 확인하세요." > /dev/null
      - name: 수집 누락 알림
        if: always() && steps.fresh.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"             -d chat_id="$TELEGRAM_CHAT_ID"             -d text="⚠ 표가 묵었습니다 — 오늘 수집이 빠졌거나 덜 들어왔습니다. 규칙이 조용히 덜 잡힐 수 있으니 Actions 로그를 확인하세요." > /dev/null
  # 알림은 **배포가 끝난 뒤에** 보낸다. 예전에는 build 잡 안에서 커밋·배포보다 먼저 보냈고,
  # 그래서 알림 링크를 바로 누르면 사이트는 아직 어제 데이터였다(2026-09-10 사용자 신고:
  # 20:10 알림 · 20:11 배포 완료). 알림이 부가 기능이라 수집 커밋을 막으면 안 된다는
  # 원칙도 그대로 지켜진다 — 이제 아예 다른 잡이라 커밋에 영향을 줄 수 없다.
  #
  # site/data/*.json 은 리포에 커밋되지 않으므로(커밋 대상은 data/*.csv 뿐) 체크아웃으로는
  # 얻을 수 없다. **배포된 사이트에서 그대로 내려받아** 판정한다 — 알림과 화면이 같은
  # 파일을 보게 되는 이점도 있다. CDN 반영이 늦을 수 있어 최신 거래일이 맞을 때까지 기다린다.
  notify:
    needs: [build]
    # us_only(한국 휴장 + 미장 개장) 실행에서도 알린다 — 그날 새로 걸린 **미장** 종목이
    # 있는데 알림이 안 가면 수집해 놓고 못 사는 것과 같다. 국내 표는 어제 것 그대로라
    # 국내 규칙에서는 '새로 걸린 것' 이 나오지 않는다(같은 목록이므로 차집합이 빈다).
    if: github.event_name != 'push'
        && (needs.build.outputs.trading == 'true' || github.event.client_payload.us_only == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: 배포된 데이터 내려받기 (최신 거래일이 맞을 때까지)
        env:
          WANT: ${{ needs.build.outputs.last_date }}
          SITE: ${{ env.SITE_URL }}/data
        run: |
          mkdir -p site/data
          # Cloudflare Access 뒤에 있으면 서비스 토큰 헤더가 있어야 받는다.
          # 없으면 로그인 화면 HTML 이 200 으로 저장돼 json.load 가 깨진다.
          CFH=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
               -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          for i in $(seq 1 20); do
            curl -fsSL "${CFH[@]}" "$SITE/table.json?cb=$RANDOM$i" -o site/data/table.json || { sleep 15; continue; }
            GOT=$(python -c "import json;print((json.load(open('site/data/table.json',encoding='utf-8'))['dates'] or [''])[-1])" || echo "")
            echo "${i}회차: 배포본 최신 거래일 $GOT (기대 $WANT)"
            if [ "$GOT" = "$WANT" ]; then break; fi
            sleep 15
          done
          curl -fsSL "${CFH[@]}" "$SITE/table_us.json?cb=$RANDOM" -o site/data/table_us.json || echo "미장 표 없음 — 미장 규칙은 건너뛴다"
          if [ "$GOT" != "$WANT" ]; then echo "::warning::배포본이 아직 $GOT 다(기대 $WANT) — 그래도 진행한다"; fi
      # 스크립트가 죽어도 워크플로가 초록불이라 며칠간 아무도 몰랐던 적이 있다
      # (2026-09-03·04 이틀치 알림 유실). 죽으면 최소한 그 사실은 알린다.
      - name: notify new picks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python notify_new.py || {
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="⚠ 신규 편입 알림 스크립트가 죽었습니다. 오늘 알림이 나가지 않았습니다 — Actions 로그를 확인하세요." > /dev/null
            echo "notify_new.py 실패 — 텔레그램으로 사실만 알렸다"
          }

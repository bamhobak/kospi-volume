name: collect-and-deploy
on:
  schedule:
    - cron: "30 9 * * 1-5"   # 18:30 KST (UTC+9) 평일
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: collect (wait for today's data)
        env: { TZ: Asia/Seoul }
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then python pipeline.py --no-site; else python pipeline.py --wait --no-site; fi
      - name: collect sector/theme (테마 주1회·업종 분기1회)
        continue-on-error: true
        env: { TZ: Asia/Seoul }
        run: |
          DOW=$(date +%u); DOM=$(date +%d); MON=$(date +%m)
          ARGS=""
          if [ "$DOW" = "1" ]; then ARGS="--theme"; fi
          if [ "$DOM" = "01" ] && echo "01 04 07 10" | grep -qw "$MON"; then ARGS=""; fi
          if [ -n "${{ github.event_name == 'workflow_dispatch' && 'X' || '' }}" ]; then ARGS=""; fi
          if [ "$DOW" = "1" ] || [ "$DOM" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sector 수집: ARGS='$ARGS'"; python collect_sector.py $ARGS
          else
            echo "오늘은 sector 수집 안 함 (요일=$DOW, 일=$DOM)"
          fi
      - name: build site (CSV + JSON)
        env: { TZ: Asia/Seoul }
        run: python pipeline.py --no-collect
      - name: commit monthly csv
        run: |
          git config user.name "kospi-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/20*.csv
          git diff --cached --quiet || (git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d)" && git pull --rebase && git push)
      - name: notify new picks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_new.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

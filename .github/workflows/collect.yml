name: collect-and-deploy
on:
  schedule:
    # 아래는 외부 스케줄러(cron-job.org, 평일 19:00 KST)가 죽었을 때의 보험이다.
    # 주 트리거보다 이른 시각은 두지 않는다 — 발화해 봐야 데이터가 없어 대기에 들어갔다가
    # 19:00 트리거에 취소당하며 자리만 차지한다. 그래서 16:30·18:30 예약을 없앴다
    # (2026-09-03). 받을 게 없으면 is_trading_day.py 가 false 를 내어 스스로 빠진다.
    - cron: "30 12 * * 1-5"   # 21:30 KST 평일 — 19:00 트리거가 실패했을 때
    - cron: "0 22 * * 0-4"    # 다음날 07:00 KST — 최종 보충(앞의 둘을 다 놓쳤을 때)
  # 외부 스케줄러(cron-job.org)가 정시에 때려 주는 입구 — 이쪽이 주 트리거다.
  # GitHub 예약은 부하에 따라 몇 시간 밀리거나 통째로 유실된다(실측: 5일간 기대 10회 중
  # 4회만 발화, 지연 중앙값 3h). 이쪽은 시각을 우리가 소유한다.
  # 19:00 KST 로 잡았다 — 네이버가 당일 투자자 데이터를 올리는 시각이 17~21시로 들쭉날쭉해
  # (실측 완료 시각 17:25 / 19:35 / 20:21 / 20:47), 너무 이르면 몇 시간을 대기로 보낸다.
  repository_dispatch:
    types: [collect]
  workflow_dispatch:
    inputs:
      force:
        description: "휴장일에도 강제로 수집"
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
# Pages 배포는 한 번에 하나만 — 그래서 그룹은 하나다. 다만 '취소' 는 수집끼리만 한다.
# 코드 푸시(빌드만)가 진행 중인 수집을 취소하면 그날 데이터가 통째로 사라진다 —
# 수집은 대기까지 몇 시간짜리라 그 사이 푸시 한 번이면 죽는다. 푸시는 줄을 서서 기다린다.
concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  build:
    runs-on: ubuntu-latest
    # collect.py 의 wait_for_today 는 네이버가 당일 투자자 데이터를 올릴 때까지 21:00 까지
    # 기다린다. 잡 타임아웃이 그보다 짧으면 대기 중에 잡이 죽고(GitHub 은 이걸 cancelled 로
    # 표시한다) 뒤 단계가 전부 건너뛰어진다 — 2026-09-03 16:35 실행이 50분 만에 그렇게
    # 죽었다. 16:35 에 시작해 21:00 까지 버티려면 4시간 반이 필요하다. 공개 저장소라
    # 러너 시간은 무료다.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      # 코스피 지수의 최신 거래일이 우리가 가진 최신 거래일보다 앞서면 수집한다.
      # '오늘 장이 열렸나' 가 아니라 '못 받은 날이 있나' 로 보기 때문에,
      # 실행이 자정을 넘겨 지연돼도 전날치를 정상적으로 받아온다.
      - name: 수집 필요 판정 (못 받은 거래일이 있는가)
        id: td
        env: { TZ: Asia/Seoul }
        run: |
          OK=$(python is_trading_day.py)
          # 수동 실행은 inputs.force, 외부 스케줄러는 client_payload.force 로 강제할 수 있다
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event.client_payload.force }}" = "true" ]; then
            OK=true; echo "force 입력 — 휴장일이어도 수집"
          fi
          echo "trading=$OK" >> $GITHUB_OUTPUT
          echo "수집 여부: $OK"
      # 푸시(코드 변경)는 수집을 건너뛰고 빌드·배포만 한다.
      # 데이터 수집은 스케줄(평일 18:30)과 수동 실행에서만 — 하루 한 번이면 충분하다.
      - name: collect (wait for today's data)
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
        env: { TZ: Asia/Seoul }
        run: python pipeline.py --wait --no-site
      - name: collect sector/theme (테마 주1회·업종 분기1회)
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
        continue-on-error: true
        env: { TZ: Asia/Seoul }
        run: |
          DOW=$(date +%u); DOM=$(date +%d); MON=$(date +%m)
          ARGS=""
          if [ "$DOW" = "1" ]; then ARGS="--theme"; fi
          if [ "$DOM" = "01" ] && echo "01 04 07 10" | grep -qw "$MON"; then ARGS=""; fi
          if [ -n "${{ github.event_name == 'workflow_dispatch' && 'X' || '' }}" ]; then ARGS=""; fi
          if [ "$DOW" = "1" ] || [ "$DOM" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sector 수집: ARGS='$ARGS'"; python collect_sector.py $ARGS; python collect_industry.py
          else
            echo "오늘은 sector 수집 안 함 (요일=$DOW, 일=$DOM)"
          fi
      # 코스닥 DB·공매도는 리포지토리에 없어(용량) 캐시로 실행 간 이어붙인다.
      # 푸시 빌드에서도 복원해야 D1(코스닥) 규칙이 데이터를 찾는다.
      - name: restore kosdaq cache
        id: kdcache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/kosdaq.db
            data/kosdaq_short_recent.csv
          key: kosdaq-db-v2-${{ github.run_id }}
          restore-keys: kosdaq-db-v2-
      - name: collect kosdaq (최근 60거래일 누적 · 코스닥 필터용)
        # 캐시 미스면 푸시 빌드에서도 받는다. 코스닥 DB 는 리포지토리에 없어
        # 캐시가 유일한 출처이고, 비면 사이트에서 1,823종목이 통째로 사라진다.
        if: (github.event_name != 'push' && steps.td.outputs.trading == 'true') || steps.kdcache.outputs.cache-matched-key == ''
        continue-on-error: true
        env: { TZ: Asia/Seoul }
        run: python collect_kosdaq_daily.py --days 60 --backfill 260 --prune 300
      - name: save kosdaq cache
        uses: actions/cache/save@v4
        if: hashFiles('data/kosdaq.db') != ''
        with:
          path: |
            data/kosdaq.db
            data/kosdaq_short_recent.csv
          key: kosdaq-db-v2-${{ github.run_id }}

      - name: collect valuation (PER·PBR·PCR)
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
        continue-on-error: true
        env: { TZ: Asia/Seoul }
        run: python collect_valuation.py --workers 8

      # DART 재무(financials.db, 181MB)는 리포지토리에 못 넣어 캐시로 이어붙인다.
      # 분기 보고서는 자주 안 바뀌므로 월요일에만 최근 2년치를 갱신한다(약 2~3분).
      - name: restore financials cache
        id: fincache
        uses: actions/cache/restore@v4
        with:
          path: data/dart/financials.db
          key: dart-fin-v1-${{ github.run_id }}
          restore-keys: dart-fin-v1-
      - name: collect DART financials (월 1회 갱신)
        if: github.event_name != 'push' && (steps.td.outputs.trading == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          TZ: Asia/Seoul
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          DOW=$(date +%u)
          if [ ! -f data/dart/financials.db ]; then
            echo "재무 DB 없음 → 전체 수집(약 4분)"; python collect_dart_fin.py --workers 4
          elif [ "$DOW" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "월요일 → 최근 2년 갱신"; python collect_dart_fin.py --workers 4 --refresh --refresh-years 2
          else
            echo "오늘은 재무 갱신 안 함 (요일=$DOW)"
          fi
      - name: save financials cache
        if: hashFiles('data/dart/financials.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/dart/financials.db
          key: dart-fin-v1-${{ github.run_id }}

      - name: collect extra (공매도·희석공시 최근분)
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
        continue-on-error: true
        env:
          TZ: Asia/Seoul
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python collect_daily_extra.py

      # 신용잔고: [폭락반등] 이 쓴다. 20일 낙폭 -15% 이하 종목만 받으므로 보통 1~2분.
      - name: collect credit balance (신용잔고 · 폭락 종목만)
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
        continue-on-error: true
        env:
          TZ: Asia/Seoul
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python collect_credit_recent.py

      # 수집 단계는 continue-on-error 라서 실패해도 워크플로가 통과한다. 그때 빈 CSV 가
      # 그대로 빌드에 들어가면 그 필드를 쓰는 규칙이 조용히 0건이 된다 — 2026-09-02 에
      # 자사주·내부자가 비어 [자사주 낙폭]·[외인 매집] 이 하루 종일 멈춰 있었다.
      # 헤더만 남은 파일은 이전 것으로 되돌린다. 옛 데이터가 빈 데이터보다 낫다.
      # toss.db 는 완성 시 650MB 라 리포지토리에 못 넣는다(코스닥 DB 와 같은 사정).
      # 캐시로 실행 간 이어붙인다. 캐시가 비면 그날치부터 새로 쌓이기 시작한다 —
      # 과거 구간은 로컬에서 받은 백필이 원본이고, 여기서는 앞으로 것만 누적한다.
      - name: restore toss cache
        id: tosscache
        uses: actions/cache/restore@v4
        with:
          path: data/toss.db
          key: toss-db-v1-${{ github.run_id }}
          restore-keys: toss-db-v1-
      # 토스증권: 프로그램매매·대차잔고는 우리가 갖지 못했던 재료이고, 기관 7분할과
      # 신용잔고도 함께 온다. 2019-04 부터만 주므로 과거는 KRX 백필로 따로 받는다.
      # ⚠ 기존 지표(외국인·기관 순매수, 공매도)를 덮어쓰지 않는다 — 값이 다르기 때문이다.
      # 넥스트레이드(NXT) 출범 후 거래소 집계가 갈려서, 소스를 섞으면 같은 규칙이
      # 다른 종목을 뽑는다(실측: NXT 이전 기관은 일치, 이후 불일치). 별도 DB 로 쌓는다.
      - name: collect toss (프로그램매매·대차·기관세부 — 별도 DB)
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
        continue-on-error: true
        env:
          TZ: Asia/Seoul
          TOSS_CLIENT_KEY: ${{ secrets.TOSS_CLIENT_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
        run: |
          if [ -z "$TOSS_CLIENT_KEY" ]; then echo "::warning::TOSS 키 미설정 — 건너뜀"; exit 0; fi
          python collect_toss.py --days 5 --workers 3 --gap 0.35
      - name: save toss cache
        if: hashFiles('data/toss.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/toss.db
          key: toss-db-v1-${{ github.run_id }}
      - name: 수집 결과 점검 (빈 파일이면 이전 것을 지킨다)
        run: |
          bad=0
          for f in data/buyback_recent.csv data/insider_recent.csv data/dilution_recent.csv \
                   data/credit_recent.csv data/short_recent.csv; do
            [ -f "$f" ] || continue
            n=$(wc -l < "$f")
            if [ "$n" -le 1 ]; then
              echo "::warning::$f 가 비었다(${n}줄) — 수집 실패로 보고 이전 파일을 지킨다"
              git checkout -- "$f" 2>/dev/null || rm -f "$f"; bad=$((bad+1))
            else
              echo "$f: ${n}줄"
            fi
          done
          [ "$bad" -eq 0 ] || echo "::warning::빈 파일 ${bad}건을 되돌렸다 — 수집 로그를 확인할 것"
      - name: build site (CSV + JSON)
        env: { TZ: Asia/Seoul }
        run: python pipeline.py --no-collect
      # 알림은 데이터가 갱신됐을 때만 — 코드 푸시로 텔레그램이 나가면 안 된다
      # 알림이 실패해도 수집 데이터는 커밋돼야 한다. 2026-09-03 에 이 단계가 실패해
      # 그날 데이터가 통째로 커밋되지 않았다 — 알림은 부가 기능이지 수집의 전제가 아니다.
      - name: notify new picks
        if: github.event_name != 'push' && steps.td.outputs.trading == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # continue-on-error 는 알림 실패가 그날 수집 커밋을 막지 않게 하려고 둔 것인데,
        # 그 탓에 스크립트가 죽어도 워크플로가 초록불이라 며칠간 아무도 몰랐다
        # (2026-09-03·04 이틀치 알림 유실). 죽으면 최소한 그 사실은 알린다.
        run: |
          python notify_new.py || {
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"               -d chat_id="$TELEGRAM_CHAT_ID"               -d text="⚠ 신규 편입 알림 스크립트가 죽었습니다. 오늘 알림이 나가지 않았습니다 — Actions 로그를 확인하세요." > /dev/null
            echo "notify_new.py 실패 — 텔레그램으로 사실만 알렸다"
          }
      - name: commit monthly csv
        run: |
          git config user.name "kospi-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/20*.csv data/short_recent.csv data/dilution_recent.csv data/buyback_recent.csv data/insider_recent.csv data/credit_recent.csv data/sector.csv data/industry.csv data/valuation.csv
          git diff --cached --quiet || (git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d)" && git pull --rebase && git push)
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

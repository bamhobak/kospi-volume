<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="종목 선별기">
<!-- 선별(퍼널) — 수천 종목이 걸러져 하나가 남는다. 색은 사이트 팔레트를 따른다
     (#60a5fa 파랑 → #a78bfa 보라). 모서리는 안쪽으로 줄인 사다리꼴에 굵은 둥근
     테두리를 덧그려 굴린다(stroke-linejoin=round). -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#151824"/><stop offset="1" stop-color="#0a0b0e"/>
  </linearGradient>
  <linearGradient id="fn" x1="0" y1="0.245" x2="0" y2="0.60">
    <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <radialGradient id="gl">
    <stop offset="0" stop-color="#a78bfa" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="64" height="64" rx="15.04" fill="url(#bg)"/>
<rect x="1.3" y="1.3" width="61.4" height="61.4" rx="14.1" fill="none"
      stroke="#ffffff" stroke-opacity="0.07" stroke-width="0.5"/>
<polygon points="18.31,17.51 45.69,17.51 34.43,35.33 29.57,35.33"
         fill="url(#fn)" stroke="url(#fn)" stroke-width="6.4"
         stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="32" cy="47.68" r="11" fill="url(#gl)"/>
<circle cx="32" cy="47.68" r="3.71" fill="#a78bfa"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="종목 선별기">
<!-- 의미: 이 앱은 '오른다' 가 아니라 **떨어진 것을 산다**. 아홉 규칙이 전부 하락장
     규칙이므로 주인공은 화살표가 아니라 **저점** 이다. 파랑으로 길게 내려와 금색 점에서
     바닥을 찍고 빨강으로 짧게 들린다(한국 시장 관습: 하락 파랑·상승 빨강).
     좌우대칭이면 그냥 골짜기라 하락을 길게·반등을 짧게 두어 의미를 남긴다. -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1020"/><stop offset="1" stop-color="#05060a"/>
  </linearGradient>
  <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0.00" stop-color="#3b82f6"/>
    <stop offset="0.34" stop-color="#3b82f6"/>
    <stop offset="0.433" stop-color="#fbbf24"/>
    <stop offset="0.57" stop-color="#f87171"/>
    <stop offset="1.00" stop-color="#f87171"/>
  </linearGradient>
  <radialGradient id="gl">
    <stop offset="0" stop-color="#fbbf24" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="64" height="64" rx="15.04" fill="url(#bg)"/>
<rect x="1.15" y="1.15" width="61.7" height="61.7" rx="14.2" fill="none"
      stroke="#ffffff" stroke-opacity="0.06" stroke-width="0.45"/>
<circle cx="27.7" cy="41.1" r="15" fill="url(#gl)"/>
<path d="M11.07,12.35 C17.47,26.42 21.31,41.15 27.70,41.15
         C35.97,41.15 44.29,36.39 55.24,23.87"
      fill="none" stroke="url(#ln)" stroke-width="5.76"
      stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="27.7" cy="41.1" r="5.76" fill="#07090f"/>
<circle cx="27.7" cy="41.1" r="4.38" fill="#fbbf24"/>
</svg>
